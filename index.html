<style>

:root{
  --bg:#050d09;
  --bg2:#08150f;
  --panel:#0a1b13;
  --panel2:#0d241a;
  --emerald:#08734f;
  --emerald2:#159968;
  --bright:#39c18b;
  --text:#f2f7f4;
  --muted:#91a49b;
  --line:rgba(57,193,139,.28);
  --soft:rgba(255,255,255,.065);
  --shadow:0 25px 70px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  color:var(--text);
  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(19,126,86,.17),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 100%,
      rgba(10,101,70,.12),
      transparent 32%
    ),
    var(--bg);
  font-family:"Alegreya",serif;
}

button,
input,
select{
  font-family:"Alegreya",serif;
}

button{
  cursor:pointer;
}

/* =========================
   APP
========================= */

.app{
  height:100vh;
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:230px;
  flex-shrink:0;
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--line);
  background:rgba(3,12,8,.94);
}

.brand{
  margin:0 8px 32px;
  font-size:31px;
  font-weight:600;
  letter-spacing:-1.4px;
}

.brand span{
  color:var(--bright);
}

.new-btn{
  width:100%;
  padding:11px 14px;
  border:1px solid rgba(57,193,139,.43);
  border-radius:7px;
  background:#0b3022;
  color:white;
  font-size:17px;
  transition:.2s;
}

.new-btn:hover{
  background:#10442f;
  border-color:rgba(57,193,139,.7);
}

.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-top:24px;
}

.nav button{
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:#91a49b;
  text-align:left;
  font-size:17px;
}

.nav button:hover{
  color:white;
  background:rgba(22,121,85,.2);
}

.nav button.active{
  color:white;
  background:rgba(22,121,85,.29);
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  border-bottom:1px solid var(--line);
  background:rgba(5,17,11,.8);
  backdrop-filter:blur(18px);
}

.page-title{
  font-size:22px;
  font-weight:600;
}

.top-btn{
  padding:7px 11px;
  border:1px solid transparent;
  border-radius:5px;
  background:transparent;
  color:#9caea6;
}

.top-btn:hover{
  border-color:var(--line);
  color:white;
}

.workspace{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:34px;
}

/* =========================
   HOME
========================= */

.home{
  max-width:1000px;
  margin:auto;
}

.home-title{
  margin:0 0 8px;
  font-size:42px;
  font-weight:500;
  letter-spacing:-1px;
}

.home-subtitle{
  margin-bottom:36px;
  color:var(--muted);
  font-size:17px;
}

.create-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.create-card{
  min-height:120px;
  padding:22px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(10,34,24,.58);
  transition:.2s;
}

.create-card:hover{
  transform:translateY(-2px);
  border-color:rgba(57,193,139,.58);
  background:#0d2a1e;
}

.create-card h3{
  margin:0 0 7px;
  font-size:21px;
  font-weight:600;
}

.create-card p{
  margin:0;
  color:var(--muted);
}

/* =========================
   FILES
========================= */

.file-list{
  max-width:1000px;
  margin:auto;
}

.file-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 17px;
  border-top:1px solid var(--soft);
}

.file-name{
  font-size:18px;
}

.file-type{
  color:var(--muted);
  font-size:14px;
}

.file-actions{
  display:flex;
  gap:6px;
}

.small-btn{
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:5px;
  background:transparent;
  color:#b8c7c0;
}

.small-btn:hover{
  color:white;
  border-color:var(--bright);
}

/* =========================
   EDITOR
========================= */

.editor-shell{
  max-width:1200px;
  min-height:calc(100vh - 130px);
  margin:auto;
  display:flex;
  flex-direction:column;
}

.toolbar{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:18px;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#091a12;
}

.toolbar button{
  height:32px;
  min-width:34px;
  padding:0 9px;
  border:1px solid transparent;
  border-radius:5px;
  background:transparent;
  color:#b9c6c0;
}

.toolbar button:hover{
  color:white;
  border-color:var(--line);
  background:#0e281d;
}

/* =========================
   FONT PICKER
========================= */

.font-picker{
  position:relative;
}

.font-search{
  width:190px;
  height:32px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:5px;
  outline:none;
  background:#0a1c14;
  color:white;
  font-size:15px;
}

.font-search::placeholder{
  color:#70867b;
}

.font-menu{
  position:absolute;
  z-index:100;
  top:38px;
  left:0;
  width:290px;
  max-height:400px;
  overflow:auto;
  display:none;
  padding:5px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#091a12;
  box-shadow:var(--shadow);
}

.font-menu.open{
  display:block;
}

.font-option{
  width:100%;
  display:block;
  padding:8px 10px;
  border:0;
  border-radius:4px;
  background:transparent;
  color:#dce5e0;
  text-align:left;
  font-size:17px;
}

.font-option:hover{
  background:#123b2a;
  color:white;
}

/* =========================
   FONT SIZE
========================= */

.size-select{
  width:78px;
  height:32px;
  padding:0 7px;
  border:1px solid var(--line);
  border-radius:5px;
  outline:none;
  background:#0a1c14;
  color:#dce5e0;
}

/* =========================
   TEXT COLOR
========================= */

.color-control{
  height:32px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:3px 7px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#0a1c14;
}

.color-control span{
  color:#aebdb5;
  font-size:14px;
}

.color-control input{
  width:24px;
  height:24px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}

.color-control input::-webkit-color-swatch-wrapper{
  padding:0;
}

.color-control input::-webkit-color-swatch{
  border:1px solid rgba(255,255,255,.3);
  border-radius:4px;
}

/* =========================
   DOCUMENT
========================= */

.document-page{
  width:min(850px,100%);
  min-height:1000px;
  margin:auto;
  padding:75px 85px;
  outline:none;
  background:white;
  color:#111;
  box-shadow:var(--shadow);
  font-family:"Alegreya",serif;
  font-size:18px;
  line-height:1.65;
}

.document-page:focus{
  outline:1px solid rgba(28,155,108,.38);
}

.document-page img{
  display:block;
  max-width:100%;
  height:auto;
  margin:18px auto;
}

/* =========================
   SLIDES
========================= */

.slides-layout{
  min-height:calc(100vh - 130px);
  display:grid;
  grid-template-columns:185px 1fr;
  gap:20px;
}

.slide-sidebar{
  padding:10px;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:8px;
  background:#091812;
}

.slide-thumb{
  width:100%;
  aspect-ratio:16/9;
  margin-bottom:10px;
  padding:5px;
  overflow:hidden;
  border:2px solid transparent;
  background:white;
  color:#111;
  cursor:pointer;
}

.slide-thumb.active{
  border-color:var(--bright);
}

.slide-thumb-content{
  width:100%;
  height:100%;
  overflow:hidden;
  font-size:8px;
}

.slide-area{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.slide{
  width:min(100%,1000px);
  aspect-ratio:16/9;
  padding:70px;
  overflow:hidden;
  outline:none;
  background:white;
  color:#111;
  box-shadow:var(--shadow);
  font-family:"Alegreya",serif;
  font-size:25px;
  line-height:1.4;
}

.slide:focus{
  outline:1px solid rgba(28,155,108,.4);
}

.slide img{
  display:block;
  max-width:100%;
  max-height:65%;
  margin:15px auto;
}

/* =========================
   SHEETS
========================= */

.sheet-shell{
  max-width:1250px;
  margin:auto;
}

.formula-bar{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.formula-name{
  width:70px;
  padding:8px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#091912;
  color:#b7c5be;
  text-align:center;
}

.formula-input{
  flex:1;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:5px;
  outline:none;
  background:#091912;
  color:white;
}

.sheet-wrap{
  overflow:auto;
  border:1px solid var(--line);
}

.sheet{
  min-width:1000px;
  border-collapse:collapse;
  background:#07110d;
}

.sheet th,
.sheet td{
  min-width:100px;
  height:34px;
  padding:6px 8px;
  border-right:1px solid rgba(75,120,101,.18);
  border-bottom:1px solid rgba(75,120,101,.18);
  font-family:"Alegreya",serif;
}

.sheet th{
  background:#0c2018;
  color:#8fa49a;
  font-weight:500;
  text-align:center;
}

.sheet td{
  outline:none;
  background:#07120e;
  color:#dce6e0;
}

.sheet td:focus{
  background:#0a1b14;
  box-shadow:inset 0 0 0 1px var(--bright);
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(8px);
}

.modal{
  width:min(420px,90%);
  padding:24px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0b1c15;
  box-shadow:var(--shadow);
}

.modal h2{
  margin:0 0 16px;
  font-size:24px;
}

.modal input{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:6px;
  outline:none;
  background:#07120e;
  color:white;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* =========================
   PRESENTATION
========================= */

.presentation{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000;
}

.presentation-slide{
  width:100vw;
  height:100vh;
  padding:7vw;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:white;
  color:#111;
  font-family:"Alegreya",serif;
}

.presentation-controls{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:7px;
  background:rgba(15,15,15,.84);
}

.presentation-controls button{
  padding:7px 12px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:5px;
  background:transparent;
  color:white;
}

.presentation-controls button:hover{
  background:rgba(255,255,255,.08);
}

.slide-counter{
  padding:8px 10px;
  color:#aaa;
}

/* =========================
   COMMAND
========================= */

.command-bg{
  position:fixed;
  inset:0;
  z-index:900;
  display:none;
  justify-content:center;
  align-items:flex-start;
  padding-top:100px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
}

.command{
  width:min(600px,90%);
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:8px;
  background:#0a1b14;
  box-shadow:var(--shadow);
}

.command input{
  width:100%;
  padding:15px;
  border:0;
  border-bottom:1px solid var(--line);
  outline:none;
  background:transparent;
  color:white;
  font-size:17px;
}

.command-list button{
  width:100%;
  padding:12px 15px;
  border:0;
  background:transparent;
  color:#c5d0cb;
  text-align:left;
  font-size:16px;
}

.command-list button:hover{
  background:#123426;
  color:white;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  z-index:2000;
  padding:10px 15px;
  border:1px solid #276f52;
  border-radius:6px;
  background:#102a20;
  color:white;
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .sidebar{
    width:72px;
    padding:18px 8px;
  }

  .brand{
    margin:0 0 25px;
    font-size:20px;
    text-align:center;
  }

  .new-btn{
    padding:10px;
    font-size:0;
  }

  .new-btn::after{
    content:"+";
    font-size:22px;
  }

  .nav button{
    padding:11px 4px;
    font-size:0;
    text-align:center;
  }

  .workspace{
    padding:18px;
  }

  .create-row{
    grid-template-columns:1fr;
  }

  .document-page{
    padding:40px 25px;
  }

  .slides-layout{
    grid-template-columns:100px 1fr;
    gap:10px;
  }

  .slide{
    padding:30px;
    font-size:18px;
  }

  .font-search{
    width:145px;
  }
}

</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      clamme<span>.</span>
    </div>

    <button
      class="new-btn"
      id="newButton"
      onclick="newCurrentFile()"
    >
      + New document
    </button>

    <div class="nav">

      <button
        id="navHome"
        class="active"
        onclick="goHome()"
      >
        Home
      </button>

      <button
        id="navDocs"
        onclick="showFiles('docs')"
      >
        Docs
      </button>

      <button
        id="navSlides"
        onclick="showFiles('slides')"
      >
        Slides
      </button>

      <button
        id="navSheets"
        onclick="showFiles('sheets')"
      >
        Sheets
      </button>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div
        class="page-title"
        id="pageTitle"
      >
        Home
      </div>

      <button
        class="top-btn"
        onclick="openCommand()"
      >
        ⌘ K
      </button>

    </header>

    <section
      class="workspace"
      id="workspace"
    ></section>

  </main>

</div>


<!-- =========================
     MODAL
========================= -->

<div
  class="modal-bg"
  id="modalBg"
>

  <div class="modal">

    <h2 id="modalTitle">
      Create
    </h2>

    <input
      id="modalInput"
      placeholder="Name"
    >

    <div class="modal-actions">

      <button
        class="small-btn"

/* =========================================================

========================================================= */

function saveFiles(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(files)
  );

}

function uid(){

  return Date.now().toString(36)+
    Math.random()
      .toString(36)
      .slice(2);

}

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function findFile(id){

  return files.find(
    file=>file.id===id
  );

}

========================================================= */

  document
    .querySelectorAll(".nav button")
    .forEach(button=>{
      button.classList.remove("active");
    });

  if(section==="home")
    navHome.classList.add("active");

  if(section==="docs")
    navDocs.classList.add("active");

  if(section==="slides")
    navSlides.classList.add("active");

  if(section==="sheets")
    navSheets.classList.add("active");

}

function updateNewButton(){

  const button=
    document.getElementById(
      "newButton"
    );

  if(currentSection==="slides"){

    button.textContent=
      "+ New presentation";

  }
  else if(currentSection==="sheets"){

    button.textContent=
      "+ New spreadsheet";

  }
  else{

    button.textContent=
      "+ New document";

  }

}

function goHome(){

  currentSection="home";

  updateNewButton();

  renderHome();

}

  currentSection=type;
  currentFileId=null;

    slides:"Slides",
    sheets:"Sheets"
  };

  pageTitle.textContent=
    titles[type];

/* =========================================================
   CREATE FILES
========================================================= */

function newCurrentFile(){

  if(currentSection==="slides")
    return newPresentation();

  if(currentSection==="sheets")
    return newSpreadsheet();

  newDocument();

}

function createFile(type,name){

  const file={
    id:uid(),
    name:name,
    type:type,
    content:
      type==="docs"
        ? ""
        : type==="slides"
          ? [{content:""}]
          : Array.from(
              {length:20},
              ()=>Array.from(
                {length:10},
                ()=>""
              )
            ),
    updated:Date.now()
  };

  files.push(file);

  saveFiles();

  openFile(file.id);

}

function newDocument(){

  openCreateModal(
    "New document",
    "Document name",
    name=>{
      createFile(
        "docs",
        name||"Untitled document"
      );
    }
  );

}

function newPresentation(){

  openCreateModal(
    "New presentation",
    "Presentation name",

      createFile(
        "slides",
        name||"Untitled presentation"
      );
    }
  );

}

/* =========================================================
   MODAL
========================================================= */

function openCreateModal(
  title,
  placeholder,
  callback
){

  modalAction=callback;

  modalTitle.textContent=title;
  modalInput.placeholder=placeholder;
  modalInput.value="";

  modalBg.style.display="flex";

  setTimeout(
    ()=>modalInput.focus(),
    50
  );

}

function closeModal(){

  modalBg.style.display="none";
  modalAction=null;

}

function confirmModal(){

  const value=
    modalInput.value.trim();

  if(!modalAction)
    return;

  const action=modalAction;

  closeModal();

  action(value);

}

modalInput.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter")
      confirmModal();

    if(event.key==="Escape")
      closeModal();

  }
);


/* =========================================================
   FILE ACTIONS
========================================================= */

function openFile(id){

  const file=findFile(id);

  if(!file)
    return;

  currentFileId=id;
  currentSection=file.type;

  pageTitle.textContent=
    file.name;

  setActiveNav(file.type);
  updateNewButton();

  if(file.type==="docs")
    renderDocs(file);

  if(file.type==="slides")
    renderSlides(file);

  if(file.type==="sheets")
    renderSheets(file);

}

function renameFile(id){

  const file=findFile(id);

  if(!file)
    return;

  openCreateModal(
    "Rename file",
    "New name",
    name=>{

      if(name){

        file.name=name;

        saveFiles();

        openFile(id);

      }

    }
  );

}

function duplicateFile(id){

  const file=findFile(id);

  if(!file)
    return;

  const copy=
    JSON.parse(
      JSON.stringify(file)
    );

  copy.id=uid();
  copy.name=
    file.name+" copy";
  copy.updated=Date.now();

  files.push(copy);

  saveFiles();

  showToast(
    "File duplicated"
  );

  renderFileList(file.type);

}

function deleteFile(id){

  const file=findFile(id);

  if(!file)
    return;

  if(!confirm("Delete this file?"))
    return;

  files=
    files.filter(
      item=>item.id!==id
    );

  saveFiles();

  showToast(
    "File deleted"
  );

  if(currentSection==="home")
    renderHome();
  else
    renderFileList(currentSection);

}


/* =========================================================
   FONT PICKER
========================================================= */

function createFontPicker(target){

  return `

    <div class="font-picker">

      <input
        class="font-search"
        id="${target}FontSearch"
        placeholder="Choose font..."
        autocomplete="off"
        onclick="openFontMenu('${target}')"
        oninput="filterFonts('${target}')"
      >

      <div
        class="font-menu"
        id="${target}FontMenu"
      >

        ${fonts.map(font=>`

          <button
            class="font-option"
            data-font="${escapeHTML(font)}"
            style="font-family:'${font}',sans-serif"
            onclick="selectFont('${target}',${JSON.stringify(font)})"
          >
            ${escapeHTML(font)}
          </button>

        `).join("")}

      </div>

    </div>

  `;

}

function openFontMenu(target){

  const menu=
    document.getElementById(
      target+"FontMenu"
    );

  if(menu)
    menu.classList.add("open");

}

function closeFontMenus(){

  document
    .querySelectorAll(".font-menu")
    .forEach(menu=>{
      menu.classList.remove("open");
    });

}

document.addEventListener(
  "click",
  event=>{

    if(
      !event.target.closest(
        ".font-picker"
      )
    ){

      closeFontMenus();

    }

  }
);

function filterFonts(target){

  const search=
    document.getElementById(
      target+"FontSearch"
    );

  const menu=
    document.getElementById(
      target+"FontMenu"
    );

  if(!search || !menu)
    return;

  menu.classList.add("open");

  const query=
    search.value.toLowerCase();

  menu
    .querySelectorAll(
      ".font-option"
    )
    .forEach(option=>{

      const name=
        option.dataset.font
          .toLowerCase();

      option.style.display=
        name.includes(query)
          ? "block"
          : "none";

    });

}

function selectFont(target,font){

  const search=
    document.getElementById(
      target+"FontSearch"
    );

  if(search)
    search.value=font;

  closeFontMenus();

  if(target==="doc")
    formatDoc(
      "fontName",
      font
    );

  if(target==="slide")
    formatSlide(
      "fontName",
      font
    );

}

function renderDocs(file){

  workspace.innerHTML=`

    <div class="editor-shell">

      ${documentToolbar()}

      <div
        id="docEditor"
        class="document-page"
        contenteditable="true"
        spellcheck="true"
      >
        ${file.content}
      </div>

    </div>

  `;

  const editor=
    document.getElementById(
      "docEditor"
    );

  editor.addEventListener(
    "input",
    ()=>{

      file.content=
        editor.innerHTML;

      file.updated=
        Date.now();

      saveFiles();

    }
  );

}

function formatDoc(
  command,
  value=null
){

  const editor=
    document.getElementById(
      "docEditor"
    );

  if(!editor)
    return;

  editor.focus();

  document.execCommand(
    command,
    false,
    value
  );

  const file=
    findFile(currentFileId);

  if(file){

    file.content=
      editor.innerHTML;

    file.updated=
      Date.now();

    saveFiles();

  }

}

function insertDocImage(){

  document.getElementById(
    "docImageInput"
  ).click();

}

function addDocImage(event){

  const imageFile=
    event.target.files[0];

  if(!imageFile)
    return;

  const reader=
    new FileReader();

  reader.onload=e=>{

    const editor=
      document.getElementById(
        "docEditor"
      );

    editor.focus();

    document.execCommand(
      "insertHTML",
      false,
      `<img src="${e.target.result}" alt="Image">`
    );

    const file=
      findFile(currentFileId);

    if(file){

      file.content=
        editor.innerHTML;

      saveFiles();

    }

  };

  reader.readAsDataURL(
    imageFile
  );

}

   SLIDES
========================================================= */

function renderSlides(file){

  if(
    !Array.isArray(file.content) ||
    !file.content.length
  ){

    file.content=[
      {content:""}
    ];

    saveFiles();

  }

  let active=0;

  workspace.innerHTML=`

    <div class="editor-shell">

      <div class="toolbar">

        ${createFontPicker("slide")}

        <select
          class="size-select"
          onchange="formatSlide('fontSize',this.value)"
        >

          <option value="2">12</option>

          <option value="4" selected>18</option>
          <option value="5">24</option>
          <option value="6">32</option>
          <option value="7">40</option>

        </select>

        <div class="color-control">

          <span>Text</span>

          <input
            id="slideColor"
            type="color"
            value="#111111"
            onchange="formatSlide('foreColor',this.value)"
            title="Text color"
          >

        </div>

        <button
          onclick="formatSlide('bold')"
        >
          <b>B</b>
        </button>

        <button
          onclick="formatSlide('italic')"
        >
          <i>I</i>
        </button>

        <button
          onclick="formatSlide('underline')"
        >
          <u>U</u>
        </button>

        <button
          onclick="formatSlide('justifyLeft')"
        >
          Left
        </button>

        <button
          onclick="formatSlide('justifyCenter')"
        >
          Center
        </button>

        <button
          onclick="formatSlide('justifyRight')"
        >
          Right
        </button>

        <button
          onclick="addSlide()"
        >
          New slide
        </button>

        <button
          onclick="duplicateSlide()"
        >
          Duplicate
        </button>

        <button
          onclick="deleteSlide()"
        >
          Delete
        </button>

        <button
          onclick="insertSlideImage()"
        >
          Image
        </button>

        <button
          onclick="startPresentation()"
        >
          Present
        </button>

        <input
          id="slideImageInput"
          type="file"
          accept="image/*"
          style="display:none"
          onchange="addSlideImage(event)"
        >

      </div>

      <div class="slides-layout">

        <div
          class="slide-sidebar"
          id="slideSidebar"
        ></div>

        <div class="slide-area">

          <div
            id="slideEditor"
            class="slide"
            contenteditable="true"
            spellcheck="true"
          ></div>

        </div>

      </div>

    </div>

  `;

  function renderActive(){

    const editor=
      document.getElementById(
        "slideEditor"
      );

    editor.innerHTML=
      file.content[
        active
      ].content||"";

    editor.oninput=()=>{

      file.content[
        active
      ].content=
        editor.innerHTML;

      file.updated=
        Date.now();

      saveFiles();

      renderThumbs();

    };

    renderThumbs();

  }

  function renderThumbs(){

    const sidebar=
      document.getElementById(
        "slideSidebar"
      );

    sidebar.innerHTML=
      file.content
        .map(
          (slide,index)=>`

            <div
              class="slide-thumb ${
                index===active
                  ?"active"
                  :""
              }"
              onclick="window.__selectSlide(${index})"
            >

              <div class="slide-thumb-content">
                ${slide.content||""}
              </div>

            </div>

          `
        )
        .join("");

  }

  window.__selectSlide=
    index=>{

      active=index;

      renderActive();

    };

  window.__slideState={
    get active(){
      return active;
    },
    file:file
  };

  renderActive();

}

function formatSlide(
  command,
  value=null
){

  const editor=
    document.getElementById(
      "slideEditor"
    );

  const state=
    window.__slideState;

  if(!editor || !state)
    return;

  editor.focus();

  document.execCommand(
    command,
    false,
    value
  );

  state.file.content[
    state.active
  ].content=
    editor.innerHTML;

  state.file.updated=
    Date.now();

  saveFiles();

}

function addSlide(){

  const state=
    window.__slideState;

  if(!state)
    return;

  state.file.content.splice(
    state.active+1,
    0,
    {content:""}
  );

  saveFiles();

  const next=
    state.active+1;

  openFile(
    state.file.id
  );

  setTimeout(
    ()=>{
      if(window.__selectSlide)
        window.__selectSlide(next);
    },
    30
  );

}

function duplicateSlide(){

  const state=
    window.__slideState;

  if(!state)
    return;

  const copy=
    JSON.parse(
      JSON.stringify(
        state.file.content[
          state.active
        ]
      )
    );

  const next=
    state.active+1;

  state.file.content.splice(
    next,
    0,
    copy
  );

  saveFiles();

  openFile(
    state.file.id
  );

  setTimeout(
    ()=>{
      if(window.__selectSlide)
        window.__selectSlide(next);
    },
    30
  );

}

function deleteSlide(){

  const state=
    window.__slideState;

  if(!state)
    return;

  if(
    state.file.content.length<=1
  ){

    showToast(
      "A presentation needs at least one slide"
    );

    return;
  }

  state.file.content.splice(
    state.active,
    1
  );

  saveFiles();

  openFile(
    state.file.id
  );

}

function insertSlideImage(){

  document.getElementById(
    "slideImageInput"
  ).click();

}

function addSlideImage(event){

  const imageFile=
    event.target.files[0];

  if(!imageFile)
    return;

  const reader=
    new FileReader();

  reader.onload=e=>{

    const state=
      window.__slideState;

    if(!state)
      return;

    const editor=
      document.getElementById(
        "slideEditor"
      );

    editor.focus();

    document.execCommand(
      "insertHTML",
      false,
      `<img src="${e.target.result}" alt="Image">`
    );

    state.file.content[
      state.active
    ].content=
      editor.innerHTML;

    saveFiles();

  };

  reader.readAsDataURL(
    imageFile
  );

}


/* =========================================================
   PRESENTATION
========================================================= */

function startPresentation(){

  const state=
    window.__slideState;

  if(!state)
    return;

  presentationIndex=0;

  presentation.style.display=
    "flex";

  renderPresentationSlide();

  if(
    presentation.requestFullscreen
  ){

    presentation
      .requestFullscreen()
      .catch(()=>{});

  }

}

function renderPresentationSlide(){

  const state=
    window.__slideState;

  if(!state)
    return;

  const slide=
    state.file.content[
      presentationIndex
    ];

  presentationSlide.innerHTML=
    slide.content||"";

  slideCounter.textContent=
    `${presentationIndex+1} / ${state.file.content.length}`;

}

function nextSlide(){

  const state=
    window.__slideState;

  if(!state)
    return;

  if(
    presentationIndex<
    state.file.content.length-1
  ){

    presentationIndex++;

    renderPresentationSlide();

  }

}

function previousSlide(){

  if(presentationIndex>0){

    presentationIndex--;

    renderPresentationSlide();

  }

}

function exitPresentation(){

  presentation.style.display=
    "none";

  if(document.fullscreenElement){

    document
      .exitFullscreen()
      .catch(()=>{});

  }

}

document.addEventListener(
  "keydown",
  event=>{

    if(
      presentation.style.display==="flex"
    ){

      if(
        event.key==="ArrowRight" ||
        event.key===" " ||
        event.key==="Enter"
      ){

        event.preventDefault();

        nextSlide();

      }

      if(event.key==="ArrowLeft"){

        event.preventDefault();

        previousSlide();

      }

      if(event.key==="Escape"){

        exitPresentation();

      }

    }

  }
);


/* =========================================================
   SHEETS
========================================================= */

function renderSheets(file){

  const rows=20;
  const cols=10;

  while(
    file.content.length<rows
  ){

    file.content.push([]);

  }

  for(
    let r=0;
    r<rows;
    r++
  ){

    while(
      file.content[r].length<cols
    ){

      file.content[r].push("");

    }

  }

  saveFiles();

  let html=`

    <div class="sheet-shell">

      <div class="toolbar">

        <button
          onclick="formatSheet('fontFamily','Alegreya')"
        >
          Alegreya
        </button>

        <button
          onclick="formatSheet('fontWeight','bold')"
        >
          <b>B</b>
        </button>

        <button
          onclick="formatSheet('fontStyle','italic')"
        >
          <i>I</i>
        </button>

        <button
          onclick="addSheetRow()"
        >
          Add row
        </button>

        <button
          onclick="addSheetColumn()"
        >
          Add column
        </button>

      </div>

      <div class="formula-bar">

        <div
          class="formula-name"
          id="cellName"
        >
          A1
        </div>

        <input
          class="formula-input"
          id="formulaInput"
          placeholder="Value or formula"
        >

      </div>

      <div class="sheet-wrap">

        <table class="sheet">

          <thead>

            <tr>

              <th></th>

  `;

  for(
    let c=0;
    c<cols;
    c++
  ){

    html+=`
      <th>
        ${columnName(c)}
      </th>
    `;

  }

  html+=`

            </tr>

          </thead>

          <tbody>

  `;

  for(
    let r=0;
    r<rows;
    r++
  ){

    html+=`

      <tr>

        <th>
          ${r+1}
        </th>

    `;

    for(
      let c=0;
      c<cols;
      c++
    ){

      html+=`

        <td
          contenteditable="true"
          data-row="${r}"
          data-col="${c}"
        >
          ${escapeHTML(
            file.content[r][c]||""
          )}
        </td>

      `;

    }

    html+=`

      </tr>

    `;

  }

  html+=`

          </tbody>

        </table>

      </div>

    </div>

  `;

  workspace.innerHTML=html;

  const cells=
    document.querySelectorAll(
      ".sheet td"
    );

  cells.forEach(cell=>{

    cell.addEventListener(
      "focus",
      ()=>{

        const r=
          Number(
            cell.dataset.row
          );

        const c=
          Number(
            cell.dataset.col
          );

        cellName.textContent=
          columnName(c)+(r+1);

        formulaInput.value=
          file.content[r][c]||"";

      }
    );

    cell.addEventListener(
      "input",
      ()=>{

        const r=
          Number(
            cell.dataset.row
          );

        const c=
          Number(
            cell.dataset.col
          );

        file.content[r][c]=
          cell.innerText;

        file.updated=
          Date.now();

        saveFiles();

        calculateSheet(file);

      }
    );

  });

  formulaInput.addEventListener(
    "change",
    event=>{

      const parsed=
        parseCellName(
          cellName.textContent
        );

      if(!parsed)
        return;

      file.content[
        parsed.row
      ][
        parsed.col
      ]=
        event.target.value;

      saveFiles();

      renderSheets(file);

    }
  );

}

function columnName(index){

  let result="";

  index++;

  while(index>0){

    const remainder=
      (index-1)%26;

    result=
      String.fromCharCode(
        65+remainder
      )+
      result;

    index=
      Math.floor(
        (index-1)/26
      );

  }

  return result;

}

function parseCellName(name){

  const match=
    name.match(
      /^([A-Z]+)(\d+)$/
    );

  if(!match)
    return null;

  let col=0;

  for(
    const char of match[1]
  ){

    col=
      col*26+
      (
        char.charCodeAt(0)-64
      );

  }

  return{
    col:col-1,
    row:Number(match[2])-1
  };

}

function calculateSheet(file){

  const cells=
    document.querySelectorAll(
      ".sheet td"
    );

  cells.forEach(cell=>{

    const r=
      Number(
        cell.dataset.row
      );

    const c=
      Number(
        cell.dataset.col
      );

    const value=
      file.content[r][c];

    if(
      typeof value==="string" &&
      value.startsWith("=")
    ){

      const formula=
        value
          .slice(1)
          .trim();

      try{

        const result=
          evaluateFormula(
            formula,
            file
          );

        if(
          result!==undefined &&
          !Number.isNaN(result)
        ){

          cell.textContent=
            result;

        }

      }
      catch{}

    }

  });

}

function evaluateFormula(
  formula,
  file
){

  const sumMatch=
    formula.match(
      /^SUM\(([A-Z]+\d+):([A-Z]+\d+)\)$/i
    );

  if(sumMatch){

    const a=
      parseCellName(
        sumMatch[1]
      );

    const b=
      parseCellName(
        sumMatch[2]
      );

    let total=0;

    for(
      let r=a.row;
      r<=b.row;
      r++
    ){

      for(
        let c=a.col;
        c<=b.col;
        c++
      ){

        const value=
          parseFloat(
            file.content[r]?.[c]
          );

        if(
          !Number.isNaN(value)
        ){

          total+=value;

        }

      }

    }

    return total;

  }

  const averageMatch=
    formula.match(
      /^AVERAGE\(([A-Z]+\d+):([A-Z]+\d+)\)$/i
    );

  if(averageMatch){

    const a=
      parseCellName(
        averageMatch[1]
      );

    const b=
      parseCellName(
        averageMatch[2]
      );

    const values=[];

    for(
      let r=a.row;
      r<=b.row;
      r++
    ){

      for(
        let c=a.col;
        c<=b.col;
        c++
      ){

        const value=
          parseFloat(
            file.content[r]?.[c]
          );

        if(
          !Number.isNaN(value)
        ){

          values.push(value);

        }

      }

    }

    if(!values.length)
      return 0;

    return values.reduce(
      (a,b)=>a+b,
      0
    )/values.length;

  }

  if(
    /^[0-9+\-*/().\s]+$/.test(
      formula
    )
  ){

    return Function(
      '"use strict";return ('+
      formula+
      ')'
    )();

  }

  return undefined;

}

function formatSheet(
  property,
  value
){

  const selected=
    document.activeElement;

  if(
    !selected ||
    selected.tagName!=="TD"
  )
    return;

  selected.style[property]=
    value;

}

function addSheetRow(){

  const file=
    findFile(currentFileId);

  if(!file)
    return;

  const cols=
    file.content[0]?.length||10;

  file.content.push(
    Array.from(
      {length:cols},
      ()=>""
    )
  );

  saveFiles();

  renderSheets(file);

}

function addSheetColumn(){

  const file=
    findFile(currentFileId);

  if(!file)
    return;

  file.content.forEach(
    row=>row.push("")
  );

  saveFiles();

  renderSheets(file);

}


/* =========================================================
   COMMAND PALETTE
========================================================= */

function openCommand(){

  commandBg.style.display=
    "flex";

  commandInput.value="";

  commandInput.focus();

}

function closeCommand(event){

  if(
    event &&
    event.target!==commandBg
  )
    return;

  commandBg.style.display=
    "none";

}

function filterCommands(){

  const query=
    commandInput.value
      .toLowerCase();

  document
    .querySelectorAll(
      "#commandList button"
    )
    .forEach(button=>{

      button.style.display=
        button.textContent
          .toLowerCase()
          .includes(query)
          ? "block"
          : "none";

    });

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

  const toast=
    document.getElementById(
      "toast"
    );

  toast.textContent=
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer=
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      1800
    );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase()==="k"
    ){

      event.preventDefault();

      openCommand();

    }

    if(event.key==="Escape"){

      commandBg.style.display=
        "none";

      closeFontMenus();

    }

  }
);

goHome();
