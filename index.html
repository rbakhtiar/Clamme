
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07100b">
<meta name="description" content="Clamme Studio — a refined workspace for documents, presentations and spreadsheets.">
<title>Clamme Studio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  color-scheme:dark;
  --bg:#070d09;
  --surface:#0b140e;
  --surface2:#101c14;
  --surface3:#17251b;
  --line:#263b2c;
  --text:#edf5ee;
  --muted:#899b8e;
  --green:#4ac477;
  --light:#a0e8b3;
  --gold:#c5aa70;
  --red:#d77b7b;
  --serif:'Alegreya',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
}

* {box-sizing:border-box}

body {
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 15% -20%,#1d593333,transparent 45%),
    radial-gradient(ellipse at 100% 100%,#153b2220,transparent 40%),
    var(--bg);
  color:var(--text);
  font:13px var(--sans);
}

button,input,textarea,select {font:inherit}
button {cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible,[contenteditable]:focus-visible {
  outline:2px solid var(--green);
  outline-offset:3px;
}
button:disabled {opacity:.4;cursor:not-allowed}

.app {
  min-height:100vh;
  display:grid;
  grid-template-columns:240px minmax(0,1fr);
}

/* SIDEBAR */

.sidebar {
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:22px 15px 15px;
  background:#09110cee;
  border-right:1px solid var(--line);
  z-index:10;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
  padding:5px 8px 30px;
}

.brand-mark {
  width:41px;
  height:41px;
  display:grid;
  place-items:center;
  border:1px solid #438457;
  border-radius:13px;
  background:linear-gradient(145deg,#215b36,#102819);
  color:var(--light);
  font-size:25px;
  box-shadow:0 5px 25px #0006, inset 0 1px #ffffff20;
}

.brand-name {font:26px var(--serif);letter-spacing:.2px}
.brand-sub {
  margin-top:1px;
  color:#86a68d;
  font-size:9px;
  letter-spacing:2px;
}

.section-label {
  padding:12px 11px;
  color:#6f8575;
  font-size:9px;
  letter-spacing:2px;
}

.nav {display:grid;gap:4px}

.nav button,.side-button {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:11px 12px;
  color:#9aab9e;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:10px;
  transition:.18s;
}

.nav button:hover,.side-button:hover {
  background:#ffffff09;
  color:white;
}

.nav button.active {
  color:#eff9f0;
  border-color:#315c3e;
  background:linear-gradient(100deg,#19452b,#102017);
}

.nav-icon {
  width:20px;
  color:#8dc69a;
  font-size:17px;
  text-align:center;
}

.push {flex:1}

.side-note {
  padding:16px;
  margin:14px 2px;
  border:1px solid #2b4832;
  border-radius:14px;
  background:linear-gradient(145deg,#172b1c,#0c1510);
}

.side-note .star {color:var(--light);font-size:20px}
.side-note h3 {font:20px var(--serif);margin:9px 0 5px}
.side-note p {color:var(--muted);font-size:11px;line-height:1.7;margin:0}

.status {
  padding:15px 8px 3px;
  border-top:1px solid var(--line);
  color:#839687;
  font-size:10px;
}
.status span {color:var(--green)}

/* MAIN */

main {min-width:0}

.topbar {
  height:68px;
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 27px;
  background:#080f0bed;
  backdrop-filter:blur(20px);
  border-bottom:1px solid #203126;
}

.top-left,.actions {display:flex;align-items:center;gap:10px}
.crumb {color:#899b8e}
.crumb strong {color:#eff7f0;font-weight:500}

.btn,.icon-btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:9px 13px;
  border:1px solid #304636;
  border-radius:9px;
  background:#111d15;
  color:#dce8de;
  white-space:nowrap;
  transition:.18s;
}

.btn:hover,.icon-btn:hover {
  border-color:#578263;
  background:#1a2b1e;
}

.btn.primary {
  color:white;
  border-color:#398a52;
  background:linear-gradient(135deg,#318b4e,#18552f);
  box-shadow:inset 0 1px #ffffff15;
}

.btn.primary:hover {
  background:linear-gradient(135deg,#3ba55d,#206c3c);
}

.btn.quiet {background:transparent;border-color:transparent;color:#a0b0a3}
.btn.danger {color:#e7a1a1}
.icon-btn {width:36px;height:36px;padding:0}

.save-state {color:#91a395;font-size:10px}
.save-state::before {content:'●';color:var(--green);margin-right:7px}

/* CONTENT */

.content {
  width:100%;
  max-width:1500px;
  padding:31px;
  margin:auto;
}

.page-head {
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:16px;
  margin-bottom:26px;
}

.eyebrow {
  color:#82d39a;
  font-size:9px;
  letter-spacing:2.5px;
  margin-bottom:10px;
}

.page-title {
  font:500 clamp(30px,4vw,44px)/1.08 var(--serif);
  margin:0;
}

.subtitle {
  color:#91a196;
  line-height:1.8;
  font-size:12px;
  max-width:620px;
  margin:10px 0 0;
}

.head-actions {display:flex;gap:8px;flex-wrap:wrap}

.hero {
  position:relative;
  min-height:240px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  overflow:hidden;
  padding:36px;
  border:1px solid #315b3c;
  border-radius:20px;
  background:
    radial-gradient(ellipse at 85% 40%,#31935438,transparent 42%),
    linear-gradient(120deg,#142d1d,#0b1510 75%);
  box-shadow:inset 0 1px #ffffff0a,0 15px 40px #0002;
}

.hero-copy {z-index:1}
.hero h2 {font:400 clamp(35px,5vw,54px)/1.03 var(--serif);margin:0}
.hero h2 em {font-style:normal;color:var(--light)}
.hero p {max-width:500px;color:#a1b2a5;line-height:1.8;margin:14px 0 20px}
.hero-mark {
  font-size:clamp(90px,13vw,155px);
  color:#a0e8b3;
  text-shadow:0 0 60px #48bb763d;
  padding:0 25px;
  animation:float 5s ease-in-out infinite;
}

@keyframes float {
  0%,100% {transform:translateY(0)}
  50% {transform:translateY(-9px)}
}

.hero-actions,.head-actions {display:flex;gap:8px;flex-wrap:wrap}

.section-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:29px 0 14px;
}

.section-title {font:24px var(--serif)}
.muted {font-size:11px;color:var(--muted)}

.quick-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.quick-card {
  min-height:150px;
  padding:20px;
  text-align:left;
  color:var(--text);
  border:1px solid #293e2e;
  border-radius:15px;
  background:linear-gradient(145deg,#121e15,#0b130e);
  transition:.2s;
}

.quick-card:hover {
  transform:translateY(-3px);
  border-color:#568464;
  box-shadow:0 12px 35px #0003;
}

.quick-icon {
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  margin-bottom:16px;
  border:1px solid #345b3d;
  border-radius:11px;
  background:#193a25;
  color:var(--light);
  font-size:18px;
}

.quick-card strong {display:block;font:22px var(--serif);font-weight:500}
.quick-card small {display:block;color:#91a195;margin-top:6px;line-height:1.6}

/* FILES */

.file-list {
  overflow:hidden;
  border:1px solid #293c2e;
  border-radius:14px;
}

.file-row {
  display:grid;
  grid-template-columns:40px minmax(0,1fr) auto auto;
  align-items:center;
  gap:12px;
  padding:13px 15px;
  background:#0d1610;
  border-bottom:1px solid #213126;
}

.file-row:last-child {border-bottom:0}
.file-row:hover {background:#132019}

.file-icon {
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border:1px solid #34543a;
  border-radius:10px;
  background:#14291b;
  color:#a0e8b3;
  font-size:17px;
}

.file-title {font-weight:600;font-size:12px}
.file-info {margin-top:4px;color:#819487;font-size:10px}
.file-type {
  padding:5px 8px;
  border:1px solid #304334;
  border-radius:6px;
  color:#a2b2a5;
  font-size:10px;
}

.file-tools {display:flex;gap:5px}
.file-tools .btn {padding:7px 9px;font-size:11px}

.empty {
  padding:35px;
  text-align:center;
  color:#899a8d;
  line-height:1.8;
}

/* EDITOR */

.editor {
  display:grid;
  grid-template-columns:205px minmax(0,1fr);
  min-height:530px;
  overflow:hidden;
  border:1px solid #293e2e;
  border-radius:15px;
  background:#0b130e;
  box-shadow:0 15px 40px #0002;
}

.rail {
  padding:15px;
  background:#0d1710;
  border-right:1px solid #26392b;
}

.rail-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
  color:#91a397;
  font-size:10px;
}

.rail-item {
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  padding:10px;
  margin-bottom:5px;
  color:#b6c4b9;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:9px;
}

.rail-item:hover {background:#16251a}
.rail-item.active {background:#193724;border-color:#355c40;color:white}
.rail-item .remove {margin-left:auto;color:#9aa99d}

.editor-main {display:flex;flex-direction:column;min-width:0}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  padding:12px;
  border-bottom:1px solid #26392b;
  background:#101a13;
}

.toolbar .btn {padding:8px 10px}
.toolbar-spacer {flex:1}

select,.input {
  min-width:0;
  padding:9px;
  border:1px solid #304636;
  border-radius:8px;
  background:#111e15;
  color:#e0ebe2;
}

.workspace {flex:1;min-width:0;padding:25px;overflow:auto}

/* DOCUMENTS */

.doc-paper {
  width:min(820px,100%);
  min-height:490px;
  margin:auto;
  padding:42px clamp(22px,5vw,72px) 60px;
  background:#f4f5ef;
  color:#263027;
  border:1px solid #e0e6dd;
  box-shadow:0 20px 55px #0004;
}

.doc-title {
  display:block;
  width:100%;
  padding:0;
  margin-bottom:20px;
  color:#203125;
  font:36px var(--serif);
  border:0;
  outline:0;
  background:transparent;
}

.doc-body {
  min-height:350px;
  outline:none;
  overflow-wrap:anywhere;
  color:#28332a;
  font:16px/1.85 Georgia,serif;
}

.doc-body:empty::before {
  content:'Start writing something worth keeping…';
  color:#a0aaa0;
}

.doc-body h1,.doc-body h2,.doc-body h3 {line-height:1.2}
.doc-body blockquote {border-left:3px solid #5c9569;padding-left:15px;color:#637269}

/* PRESENTATIONS */

.slide-list {
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:4px 4px 15px;
}

.slide-thumb {
  position:relative;
  flex:0 0 130px;
  height:80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
  padding:10px;
  text-align:left;
  color:#203326;
  background:#e8eee5;
  border:1px solid #435447;
  border-radius:9px;
}

.slide-thumb.active {outline:2px solid #60ce83;outline-offset:2px}
.slide-thumb strong {position:relative;z-index:1;font:14px var(--serif)}
.slide-thumb small {position:relative;z-index:1;margin-top:5px;opacity:.7}
.slide-thumb img {position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide-thumb.has-image {color:white}

.slide-stage {
  position:relative;
  width:min(100%,1050px);
  aspect-ratio:16/9;
  margin:auto;
  overflow:hidden;
  background:#edf2e9;
  color:#1c3022;
  box-shadow:0 20px 55px #0005;
}

.slide-stage.has-image {color:white}
.slide-bg {position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide-shade {
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,#06130be0,#06130b66);
}

.slide-copy {
  position:absolute;
  z-index:1;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:8%;
}

.slide-heading {
  width:100%;
  padding:0;
  border:0;
  outline:0;
  resize:none;
  overflow:hidden;
  background:transparent;
  color:inherit;
  font:500 clamp(22px,4.5vw,55px)/1.08 var(--serif);
}

.slide-body {
  width:100%;
  min-height:90px;
  margin-top:17px;
  padding:0;
  border:0;
  outline:0;
  resize:vertical;
  background:transparent;
  color:inherit;
  font:16px/1.65 var(--sans);
}

.slide-body::placeholder {color:currentColor;opacity:.6}
.slide-hint {margin-top:14px;text-align:center;color:#87988b;font-size:10px}

/* SPREADSHEETS */

.formula-bar {
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:13px;
}

.formula-bar label {min-width:30px;color:#a6c0ac}
.formula-bar input {flex:1}

.sheet-wrap {overflow:auto;border:1px solid #304333;border-radius:10px}

.sheet {
  width:100%;
  min-width:750px;
  table-layout:fixed;
  border-collapse:collapse;
  background:#0d1710;
}

.sheet th {
  height:33px;
  border:1px solid #2a3e2e;
  background:#17281b;
  color:#a5b7a8;
  font-size:10px;
  font-weight:500;
}

.sheet td {padding:0;border:1px solid #25372a}

.sheet td input {
  width:100%;
  height:35px;
  padding:6px 8px;
  border:0;
  border-radius:0;
  outline:none;
  background:transparent;
  color:#dce8de;
  font-size:11px;
}

.sheet td input:focus {
  outline:1px solid #58c17b;
  outline-offset:-1px;
  background:#183020;
}

.sheet td input.formula {color:#a0e8b3}
.sheet td input.header-cell {background:#122319;color:#a9d9b3;font-weight:600}

/* SEARCH AND UTILITIES */

.search-input {width:100%;max-width:570px;padding:14px}
.notice {
  padding:14px;
  border:1px solid #34513a;
  border-radius:10px;
  background:#14231a;
  color:#c0d0c3;
}

.toast {
  position:fixed;
  z-index:50;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 18px;
  border:1px solid #477c55;
  border-radius:10px;
  background:#193625;
  color:#eaf8ed;
  box-shadow:0 12px 35px #0008;
  animation:toastIn .2s ease-out;
}

@keyframes toastIn {
  from {opacity:0;transform:translate(-50%,8px)}
  to {opacity:1;transform:translate(-50%,0)}
}

.hidden {display:none!important}

/* RESPONSIVE */

@media(max-width:950px) {
  .app {grid-template-columns:1fr}
  .sidebar {
    position:fixed;
    left:-260px;
    width:245px;
    transition:left .22s ease;
    box-shadow:15px 0 45px #0008;
  }
  .sidebar.open {left:0}
  .editor {grid-template-columns:1fr}
  .rail {border-right:0;border-bottom:1px solid var(--line)}
  .rail-items {display:flex;gap:5px;overflow-x:auto}
  .rail-item {width:auto;white-space:nowrap}
}

@media(max-width:650px) {
  .content {padding:22px 15px}
  .topbar {height:61px;padding:0 13px}
  .save-state {display:none}
  .hero {min-height:220px;padding:24px}
  .hero-mark {display:none}
  .quick-grid {grid-template-columns:1fr}
  .quick-card {min-height:110px}
  .page-head {align-items:flex-start;flex-direction:column}
  .file-row {grid-template-columns:36px minmax(0,1fr) auto}
  .file-type {display:none}
  .file-tools .btn:not(.open-file) {display:none}
  .workspace {padding:13px}
  .doc-paper {padding:25px 20px}
  .toolbar {gap:5px}
  .toolbar .btn {padding:8px}
  .crumb {font-size:11px}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="brand">
    <div class="brand-mark">✦</div>
    <div>
      <div class="brand-name">Clamme</div>
      <div class="brand-sub">STUDIO</div>
    </div>
  </div>

  <div class="section-label">WORKSPACE</div>

  <nav class="nav">
    <button data-page="home" class="active"><span class="nav-icon">⌂</span>Overview</button>
    <button data-page="documents"><span class="nav-icon">▤</span>Documents</button>
    <button data-page="slides"><span class="nav-icon">▧</span>Presentations</button>
    <button data-page="sheets"><span class="nav-icon">▦</span>Spreadsheets</button>
    <button data-page="files"><span class="nav-icon">◇</span>Your files</button>
  </nav>

  <div class="section-label" style="margin-top:18px">TOOLS</div>

  <button class="side-button" id="searchButton"><span class="nav-icon">⌕</span>Find anything</button>
  <button class="side-button" id="backupButton"><span class="nav-icon">↧</span>Export backup</button>
  <button class="side-button" id="importButton"><span class="nav-icon">↥</span>Import backup</button>
  <input id="backupInput" type="file" accept=".json,application/json" hidden>

  <div class="push"></div>

  <div class="side-note">
    <div class="star">✦</div>
    <h3>Make room for ideas.</h3>
    <p>One thoughtful workspace for everything you create. Your ideas, your space.</p>
  </div>

  <div class="status"><span>●</span> Local workspace · Autosave enabled</div>

</aside>

<main>

<header class="topbar">
  <div class="top-left">
    <button class="icon-btn" id="menuButton" aria-label="Open menu">☰</button>
    <div class="crumb">Clamme <span style="color:#425647">/</span> <strong id="breadcrumb">Overview</strong></div>
  </div>

  <div class="actions">
    <span class="save-state" id="saveState">All changes saved</span>
    <button class="btn" id="topSearch">⌕ Search</button>
    <button class="btn primary" id="newButton">＋ New</button>
  </div>
</header>

<div class="content" id="content"></div>

</main>
</div>

<div id="toastHost"></div>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const KEY = 'clamme-studio-v2';

const FONT_OPTIONS = [
  'Alegreya','Inter','Georgia','Arial',
  'Verdana','Times New Roman','Courier New'
];

const uid = () =>
  Math.random().toString(36).slice(2,10) +
  Date.now().toString(36);

const blankGrid = () =>
  Array.from({length:15},()=>Array(10).fill(''));

function initialState() {
  return {
    version:2,
    documents:[],
    presentations:[],
    spreadsheets:[],
    page:'home',
    activeDocument:null,
    activePresentation:null,
    activeSpreadsheet:null
  };
}

function validState(data) {
  return data &&
    Array.isArray(data.documents) &&
    Array.isArray(data.presentations) &&
    Array.isArray(data.spreadsheets);
}

function loadState() {
  try {
    const data=JSON.parse(localStorage.getItem(KEY));
    if(validState(data)) return {...initialState(),...data};
  } catch(e) {}
  return initialState();
}

let state=loadState();
let selectedSlide=0;
let selectedCell='A1';
let searchTerm='';
let saveTimer;
let toastTimer;

const pageNames={
  home:'Overview',
  documents:'Documents',
  slides:'Presentations',
  sheets:'Spreadsheets',
  files:'Your files',
  search:'Search'
};

/* HELPERS */

function escapeHTML(value) {
  return String(value??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}

function safeName(value) {
  return (String(value||'untitled')
    .trim()
    .replace(/[^a-z0-9-_]+/gi,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,60))||'untitled';
}

function toast(message) {
  clearTimeout(toastTimer);
  $('#toastHost').innerHTML=
    `<div class="toast" role="status">${escapeHTML(message)}</div>`;
  toastTimer=setTimeout(()=>$('#toastHost').innerHTML='',2500);
}

function saveNow() {
  try {
    localStorage.setItem(KEY,JSON.stringify(state));
    $('#saveState').textContent='All changes saved';
  } catch(e) {
    $('#saveState').textContent='Storage full';
    toast('Storage full. Export a backup or remove large images.');
  }
}

function saveSoon() {
  $('#saveState').textContent='Saving…';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,300);
}

function downloadFile(name,data,type) {
  const blob=new Blob([data],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function dateLabel(timestamp) {
  if(!timestamp) return 'Recently';
  return new Date(timestamp).toLocaleDateString();
}

/* FILE ACCESS */

function activeDocument() {
  return state.documents.find(x=>x.id===state.activeDocument);
}

function activePresentation() {
  return state.presentations.find(x=>x.id===state.activePresentation);
}

function activeSpreadsheet() {
  return state.spreadsheets.find(x=>x.id===state.activeSpreadsheet);
}

function allFiles() {
  return [
    ...state.documents.map(x=>({...x,kind:'Document',icon:'▤',page:'documents'})),
    ...state.presentations.map(x=>({...x,kind:'Presentation',icon:'▧',page:'slides'})),
    ...state.spreadsheets.map(x=>({...x,kind:'Spreadsheet',icon:'▦',page:'sheets'}))
  ].sort((a,b)=>(b.updated||0)-(a.updated||0));
}

/* FILE OPERATIONS */

function findFile(id) {
  for(const type of ['documents','presentations','spreadsheets']) {
    const item=state[type].find(x=>x.id===id);
    if(item) return {item,type};
  }
}

function duplicateFile(id) {
  const result=findFile(id);
  if(!result) return;

  const clone=JSON.parse(JSON.stringify(result.item));
  clone.id=uid();
  clone.title=(clone.title||'Untitled')+' copy';
  clone.updated=Date.now();

  const list=state[result.type];
  list.unshift(clone);

  saveNow();
  render();
  toast('Duplicate created');
}

function deleteFile(id) {
  const result=findFile(id);
  if(!result) return;

  if(!confirm(`Delete "${result.item.title}" permanently from this workspace?`)) return;

  state[result.type]=state[result.type].filter(x=>x.id!==id);

  if(state.activeDocument===id) state.activeDocument=null;
  if(state.activePresentation===id) state.activePresentation=null;
  if(state.activeSpreadsheet===id) state.activeSpreadsheet=null;

  saveNow();
  render();
  toast('File deleted');
}

function renameFile(id) {
  const result=findFile(id);
  if(!result) return;

  const name=prompt('Rename file:',result.item.title);
  if(name===null||!name.trim()) return;

  result.item.title=name.trim().slice(0,120);
  result.item.updated=Date.now();

  saveNow();
  render();
  toast('File renamed');
}

/* SAFE DOCUMENT HTML */

function cleanDocumentHTML(html) {
  const parser=new DOMParser();
  const doc=parser.parseFromString(String(html||''),'text/html');

  const allowed=new Set([
    'P','BR','DIV','H1','H2','H3','H4',
    'B','STRONG','I','EM','U','S',
    'UL','OL','LI','BLOCKQUOTE','HR','A'
  ]);

  function clean(node) {
    [...node.childNodes].forEach(child=>{
      if(child.nodeType===Node.ELEMENT_NODE) {
        if(!allowed.has(child.tagName)) {
          child.replaceWith(...child.childNodes);
          return;
        }

        [...child.attributes].forEach(attr=>{
          if(child.tagName!=='A'||attr.name!=='href') {
            child.removeAttribute(attr.name);
          }
        });

        if(child.tagName==='A') {
          const href=child.getAttribute('href')||'';
          if(!/^https?:\/\//i.test(href)) child.removeAttribute('href');
          child.setAttribute('rel','noopener noreferrer');
        }

        clean(child);
      } else if(child.nodeType!==Node.TEXT_NODE) {
        child.remove();
      }
    });
  }

  clean(doc.body);
  return doc.body.innerHTML;
}

/* SPREADSHEET ENGINE */

function colName(n) {
  let s='';
  while(n>=0) {
    s=String.fromCharCode(n%26+65)+s;
    n=Math.floor(n/26)-1;
  }
  return s;
}

function parseAddress(addr) {
  const m=/^([A-Z]+)(\d+)$/i.exec(addr);
  if(!m) return {r:0,c:0};

  let c=0;
  for(const ch of m[1].toUpperCase()) {
    c=c*26+ch.charCodeAt(0)-64;
  }

  return {
    r:Math.max(0,Number(m[2])-1),
    c:Math.max(0,c-1)
  };
}

function cellRaw(sh,r,c) {
  return sh.cells[r]?.[c]??'';
}

function parseMath(expression) {
  const tokens=expression.match(/\d+(?:\.\d+)?|[()+\-*/%]/g)||[];
  const original=expression.replace(/\s/g,'');

  if(tokens.join('')!==original) throw Error('Invalid formula');

  let pos=0;

  function factor() {
    const token=tokens[pos++];

    if(token==='+') return factor();
    if(token==='-') return -factor();

    if(token==='(') {
      const value=expressionPart();
      if(tokens[pos++]!==')') throw Error('Missing bracket');
      return value;
    }

    if(token===undefined||!Number.isFinite(Number(token))) {
      throw Error('Invalid number');
    }

    return Number(token);
  }

  function term() {
    let value=factor();

    while(tokens[pos]==='*'||tokens[pos]==='/'||tokens[pos]==='%') {
      const op=tokens[pos++];
      const next=factor();

      if(op==='*') value*=next;
      if(op==='/') value/=next;
      if(op==='%') value%=next;
    }

    return value;
  }

  function expressionPart() {
    let value=term();

    while(tokens[pos]==='+'||tokens[pos]==='-') {
      const op=tokens[pos++];
      const next=term();
      value=op==='+'?value+next:value-next;
    }

    return value;
  }

  const result=expressionPart();

  if(pos!==tokens.length||!Number.isFinite(result)) {
    throw Error('Invalid calculation');
  }

  return result;
}

function numericCell(sh,r,c,seen=new Set()) {
  const raw=String(cellRaw(sh,r,c));

  if(!raw.startsWith('=')) {
    const n=Number(raw);
    return raw.trim()!==''&&Number.isFinite(n)?n:0;
  }

  const key=`${r},${c}`;

  if(seen.has(key)) return '#CYCLE!';

  seen.add(key);

  try {
    let formula=raw.slice(1).toUpperCase();

    // Support SUM, AVERAGE, MIN, MAX and COUNT over cell ranges.
    formula=formula.replace(
      /\b(SUM|AVERAGE|MIN|MAX|COUNT)\(([A-Z]+\d+):([A-Z]+\d+)\)/g,
      (match,fn,start,end)=>{
        const a=parseAddress(start);
        const b=parseAddress(end);
        const values=[];

        for(let y=Math.min(a.r,b.r);y<=Math.max(a.r,b.r);y++) {
          for(let x=Math.min(a.c,b.c);x<=Math.max(a.c,b.c);x++) {
            const rawValue=String(cellRaw(sh,y,x));
            if(rawValue.trim()!=='') {
              const v=numericCell(sh,y,x,new Set(seen));
              if(typeof v!=='number') throw Error('Invalid cell');
              values.push(v);
            }
          }
        }

        if(fn==='SUM') return values.reduce((a,b)=>a+b,0);
        if(fn==='COUNT') return values.length;
        if(fn==='AVERAGE') return values.length?values.reduce((a,b)=>a+b,0)/values.length:0;
        if(fn==='MIN') return values.length?Math.min(...values):0;
        if(fn==='MAX') return values.length?Math.max(...values):0;
      }
    );

    formula=formula.replace(
      /\b([A-Z]+\d+)\b/g,
      ref=>{
        const p=parseAddress(ref);
        const value=numericCell(sh,p.r,p.c,new Set(seen));
        if(typeof value!=='number') throw Error('Invalid cell');
        return String(value);
      }
    );

    return parseMath(formula);
  } catch(e) {
    return '#ERROR';
  }
}

function cellValue(sh,r,c) {
  const raw=String(cellRaw(sh,r,c));
  return raw.startsWith('=')?numericCell(sh,r,c):raw;
}

function spreadsheetHTML() {
  const sh=activeSpreadsheet();

  if(!sh) {
    return `
      ${pageHead('NUMBERS','Spreadsheets','Organise your information and calculate with formulas.',
        '<button class="btn primary" data-create="sheets">＋ New spreadsheet</button>')}
      ${fileRows(allFiles().filter(f=>f.kind==='Spreadsheet'))}
    `;
  }

  const columns=10;
  const rows=15;

  let html=`
    ${pageHead('SPREADSHEET','Make the numbers make sense.',
      'Enter values or formulas such as =SUM(A1:A5).',
      '<button class="btn" id="exportCSV">Export CSV</button><button class="btn primary" id="newSheet">＋ New</button>')}

    <div style="display:flex;gap:10px;margin-bottom:13px">
      <input class="input" id="sheetTitle" value="${escapeHTML(sh.title)}"
        style="flex:1;font:21px var(--serif)" aria-label="Spreadsheet title">
      <button class="btn" id="clearSheet">Clear cells</button>
    </div>

    <div class="formula-bar">
      <label id="cellName">${selectedCell}</label>
      <input class="input" id="formulaInput" placeholder="Value or formula, e.g. =A1+B1">
      <button class="btn primary" id="applyFormula">Apply</button>
    </div>

    <div class="sheet-wrap">
      <table class="sheet">
        <thead><tr><th style="width:40px">#</th>
  `;

  for(let c=0;c<columns;c++) html+=`<th>${colName(c)}</th>`;

  html+='</tr></thead><tbody>';

  for(let r=0;r<rows;r++) {
    html+=`<tr><th>${r+1}</th>`;

    for(let c=0;c<columns;c++) {
      const addr=colName(c)+(r+1);
      const raw=cellRaw(sh,r,c);
      const value=String(raw).startsWith('=')?cellValue(sh,r,c):raw;

      html+=`
        <td>
          <input
            data-cell="${addr}"
            class="${String(raw).startsWith('=')?'formula':''} ${r===0?'header-cell':''}"
            value="${escapeHTML(value)}"
            aria-label="${addr}"
            title="${escapeHTML(raw)}"
          >
        </td>
      `;
    }

    html+='</tr>';
  }

  html+=`
      </tbody>
      </table>
    </div>
    <p class="muted" style="margin-top:11px">
      15 rows · 10 columns · Formula support · Local storage
    </p>
  `;

  return html;
}

/* RENDER */

function render() {
  const page=state.page;

  $('#breadcrumb').textContent=pageNames[page]||'Overview';

  $$('.nav button').forEach(b=>
    b.classList.toggle('active',b.dataset.page===page)
  );

  const content=$('#content');

  if(page==='home') content.innerHTML=homeHTML();
  else if(page==='documents') content.innerHTML=documentHTML();
  else if(page==='slides') content.innerHTML=presentationHTML();
  else if(page==='sheets') content.innerHTML=spreadsheetHTML();
  else if(page==='files') content.innerHTML=filesHTML();
  else if(page==='search') content.innerHTML=searchHTML();
  else content.innerHTML=homeHTML();

  bindCommon();

  if(page==='documents') bindDocument();
  if(page==='slides') bindPresentation();
  if(page==='sheets') bindSpreadsheet();
  if(page==='files') bindFileSearch('#librarySearch','#fileResults');
  if(page==='search') bindFileSearch('#searchInput','#searchResults');
}

function setPage(page) {
  state.page=page;
  $('#sidebar').classList.remove('open');
  saveSoon();
  render();
}

/* COMMON EVENTS */

function bindCommon() {
  $$('[data-page]').forEach(b=>{
    b.onclick=()=>setPage(b.dataset.page);
  });

  $$('[data-create]').forEach(b=>{
    b.onclick=()=>{
      const type=b.dataset.create;
      if(type==='documents') addDocument();
      if(type==='slides') addPresentation();
      if(type==='sheets') addSpreadsheet();
    };
  });

  $$('[data-open]').forEach(b=>{
    b.onclick=()=>{
      const type=b.dataset.open;
      const id=b.dataset.id;

      state.page=type;

      if(type==='documents') state.activeDocument=id;
      if(type==='slides') {
        state.activePresentation=id;
        selectedSlide=0;
      }
      if(type==='sheets') {
        state.activeSpreadsheet=id;
        selectedCell='A1';
      }

      saveSoon();
      render();
    };
  });

  $$('[data-rename]').forEach(b=>{
    b.onclick=()=>renameFile(b.dataset.rename);
  });

  $$('[data-duplicate]').forEach(b=>{
    b.onclick=()=>duplicateFile(b.dataset.duplicate);
  });

  $$('[data-delete]').forEach(b=>{
    b.onclick=()=>deleteFile(b.dataset.delete);
  });

  $('#newButton').onclick=createMenu;

  $('#searchButton').onclick=()=>{
    searchTerm='';
    setPage('search');
  };

  $('#topSearch').onclick=()=>{
    searchTerm='';
    setPage('search');
  };

  $('#menuButton').onclick=()=>{
    $('#sidebar').classList.toggle('open');
  };

  $('#backupButton').onclick=exportBackup;

  $('#importButton').onclick=()=>$('#backupInput').click();

  $('#backupInput').onchange=e=>{
    const file=e.target.files?.[0];
    e.target.value='';
    if(file) importBackup(file);
  };
}

/* DOCUMENT EDITOR */

function bindDocument() {
  const d=activeDocument();
  if(!d) return;

  $$('[data-doc]').forEach(b=>{
    b.onclick=()=>{
      state.activeDocument=b.dataset.doc;
      saveSoon();
      render();
    };
  });

  $('#newDoc').onclick=addDocument;

  const title=$('#docTitle');
  const body=$('#docBody');

  title.oninput=e=>{
    d.title=e.target.value;
    d.updated=Date.now();
    saveSoon();
  };

  body.oninput=()=>{
    d.content=cleanDocumentHTML(body.innerHTML);
    d.updated=Date.now();
    saveSoon();
  };

  $('#docFont').onchange=e=>{
    body.style.fontFamily=e.target.value;
    body.focus();
  };

  $$('[data-format]').forEach(b=>{
    b.onclick=()=>{
      body.focus();

      document.execCommand(
        b.dataset.format,
        false,
        b.dataset.value||null
      );

      d.content=cleanDocumentHTML(body.innerHTML);
      d.updated=Date.now();
      saveSoon();
    };
  });

  $('#exportDoc').onclick=()=>{
    const html=`
      <!DOCTYPE html>
      <html>
      <head>
      <meta charset="UTF-8">
      <title>${escapeHTML(d.title)}</title>
      <style>
        body {
          max-width:760px;
          margin:60px auto;
          padding:0 25px;
          color:#263027;
          font:17px/1.8 Georgia,serif;
        }
        h1 {font-size:2.3em}
      </style>
      </head>
      <body>
        <h1>${escapeHTML(d.title)}</h1>
        ${cleanDocumentHTML(d.content)}
      </body>
      </html>
    `;

    downloadFile(safeName(d.title)+'.html',html,'text/html;charset=utf-8');
  };
}

/* PRESENTATION EDITOR */

function bindPresentation() {
  const d=activePresentation();
  if(!d) return;

  $('#deckTitle').oninput=e=>{
    d.title=e.target.value;
    d.updated=Date.now();
    saveSoon();
  };

  $('#newDeck').onclick=addPresentation;

  $$('[data-slide]').forEach(b=>{
    b.onclick=()=>{
      selectedSlide=Number(b.dataset.slide);
      render();
    };
  });

  $('#addSlide').onclick=()=>{
    d.slides.push({
      title:'New slide',
      body:'Add your ideas here.',
      image:'',
      font:'Alegreya'
    });

    selectedSlide=d.slides.length-1;
    d.updated=Date.now();
    saveNow();
    render();
  };

  $('#duplicateSlide').onclick=()=>{
    const clone={
      ...d.slides[selectedSlide],
      title:(d.slides[selectedSlide].title||'Slide')+' copy'
    };

    d.slides.splice(selectedSlide+1,0,clone);
    selectedSlide++;
    saveNow();
    render();
  };

  $('#deleteSlide').onclick=()=>{
    if(d.slides.length===1) {
      d.slides[0]={
        title:'New slide',
        body:'',
        image:'',
        font:'Alegreya'
      };
      selectedSlide=0;
    } else {
      d.slides.splice(selectedSlide,1);
      selectedSlide=Math.max(0,selectedSlide-1);
    }

    saveNow();
    render();
  };

  const s=d.slides[selectedSlide];

  $('#slideHeading').oninput=e=>{
    s.title=e.target.value;
    d.updated=Date.now();
    updateSlideRail(d);
    saveSoon();
  };

  $('#slideBody').oninput=e=>{
    s.body=e.target.value;
    d.updated=Date.now();
    saveSoon();
  };

  $('#slideFont').onchange=e=>{
    s.font=e.target.value;
    $('#slideStage').style.fontFamily=s.font;
    $('#slideHeading').style.fontFamily=s.font;
    d.updated=Date.now();
    saveSoon();
  };

  $('#addImage').onclick=()=>$('#slideImageInput').click();

  $('#removeImage').onclick=()=>{
    s.image='';
    d.updated=Date.now();
    saveNow();
    render();
  };

  $('#slideImageInput').onchange=e=>{
    const file=e.target.files?.[0];
    e.target.value='';

    if(!file) return;

    if(!file.type.startsWith('image/')) {
      toast('Choose an image file.');
      return;
    }

    if(file.size>2*1024*1024) {
      toast('Choose an image smaller than 2 MB.');
      return;
    }

    const reader=new FileReader();

    reader.onerror=()=>toast('Could not read that image.');

    reader.onload=()=>{
      s.image=reader.result;
      d.updated=Date.now();
      saveNow();
      render();
    };

    reader.readAsDataURL(file);
  };

  $('#presentDeck').onclick=()=>openPresentation(d);
  $('#exportDeck').onclick=()=>exportPresentation(d);
}

function updateSlideRail(d) {
  $$('[data-slide]').forEach((b,i)=>{
    const label=d.slides[i]?.title||'Untitled slide';
    b.innerHTML=`
      <span>${String(i+1).padStart(2,'0')}</span>
      ${escapeHTML(label).slice(0,18)}
    `;
  });
}

/* PRESENTATION OUTPUT */

function buildDeckHTML(deck) {
  const slides=deck.slides.map(s=>`
    <section class="slide" style="font-family:${escapeHTML(s.font||'Georgia')}">
      ${s.image?`<img src="${s.image}" alt=""><div class="shade"></div>`:''}
      <div class="text">
        <h1>${escapeHTML(s.title||'')}</h1>
        <p>${escapeHTML(s.body||'')}</p>
      </div>
    </section>
  `).join('');

  return `
    <!doctype html>
    <html>
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${escapeHTML(deck.title)}</title>

    <style>
      * {box-sizing:border-box}
      body {
        margin:0;
        background:#07100b;
        color:#eff6ef;
        font-family:Arial,sans-serif;
      }
      .slide {
        display:none;
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        width:min(92vw,1200px);
        aspect-ratio:16/9;
        overflow:hidden;
        background:#edf2e9;
        color:#182b1e;
        padding:7%;
        justify-content:center;
        flex-direction:column;
      }
      .slide.active {display:flex}
      .slide img {
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:cover;
      }
      .shade {
        position:absolute;
        inset:0;
        background:linear-gradient(90deg,#07150bdd,#07150b66);
      }
      .text {position:relative;z-index:1;max-width:85%}
      .slide h1 {
        font-size:clamp(24px,5vw,64px);
        line-height:1.05;
        margin:0 0 20px;
      }
      .slide p {
        font-size:clamp(12px,2vw,23px);
        line-height:1.6;
        white-space:pre-wrap;
      }
      .controls {
        position:fixed;
        bottom:18px;
        left:0;
        right:0;
        display:flex;
        justify-content:center;
        align-items:center;
        gap:16px;
        color:#a8b6aa;
      }
      .controls button {
        border:1px solid #304536;
        border-radius:8px;
        background:#132019;
        color:#e0ece2;
        padding:9px 13px;
      }
    </style>
    </head>

    <body>
      ${slides}

      <div class="controls">
        <button id="prev">← Previous</button>
        <span id="count"></span>
        <button id="next">Next →</button>
      </div>

      <script>
        const slides=[...document.querySelectorAll('.slide')];
        let i=0;

        function draw() {
          slides.forEach((s,n)=>s.classList.toggle('active',n===i));
          document.querySelector('#count').textContent=(i+1)+' / '+slides.length;
        }

        document.querySelector('#prev').onclick=()=>{
          i=Math.max(0,i-1);
          draw();
        };

        document.querySelector('#next').onclick=()=>{
          i=Math.min(slides.length-1,i+1);
          draw();
        };

        document.addEventListener('keydown',e=>{
          if(e.key==='ArrowRight') i=Math.min(slides.length-1,i+1);
          if(e.key==='ArrowLeft') i=Math.max(0,i-1);
          draw();
        });

        draw();
      <\/script>
    </body>
    </html>
  `;
}

function openPresentation(deck) {
  const w=window.open('','_blank');

  if(!w) {
    toast('Allow pop-ups to present your slides.');
    return;
  }

  w.document.open();
  w.document.write(buildDeckHTML(deck));
  w.document.close();
  w.focus();
}

function exportPresentation(deck) {
  downloadFile(
    safeName(deck.title)+'.html',
    buildDeckHTML(deck),
    'text/html;charset=utf-8'
  );
}

/* SPREADSHEET EVENTS */

function bindSpreadsheet() {
  const sh=activeSpreadsheet();
  if(!sh) return;

  $('#sheetTitle').oninput=e=>{
    sh.title=e.target.value;
    sh.updated=Date.now();
    saveSoon();
  };

  function selectCell(addr) {
    selectedCell=addr;

    $('#cellName').textContent=addr;

    const p=parseAddress(addr);
    $('#formulaInput').value=cellRaw(sh,p.r,p.c);

    $$('[data-cell]').forEach(input=>{
      input.style.background=input.dataset.cell===addr?'#183121':'';
    });
  }

  $$('[data-cell]').forEach(input=>{
    const addr=input.dataset.cell;

    input.addEventListener('focus',()=>selectCell(addr));
    input.addEventListener('click',()=>selectCell(addr));

    input.addEventListener('change',()=>{
      const p=parseAddress(addr);
      sh.cells[p.r][p.c]=input.value;
      sh.updated=Date.now();
      saveSoon();
      refreshSheet(sh);
    });

    input.addEventListener('keydown',e=>{
      if(e.key==='Enter') {
        e.preventDefault();
        input.blur();

        const p=parseAddress(addr);
        const nextRow=Math.min(15,p.r+2);
        const next=$(`[data-cell="${colName(p.c)+nextRow}"]`);
        next?.focus();
      }

      if(e.key==='Tab') {
        e.preventDefault();
        const p=parseAddress(addr);
        const nextCol=Math.min(9,p.c+1);
        $(`[data-cell="${colName(nextCol)+(p.r+1)}"]`)?.focus();
      }
    });
  });

  function applyFormula() {
    const p=parseAddress(selectedCell);

    sh.cells[p.r][p.c]=$('#formulaInput').value;
    sh.updated=Date.now();
    saveNow();
    render();
  }

  $('#formulaInput').onkeydown=e=>{
    if(e.key==='Enter') {
      e.preventDefault();
      applyFormula();
    }
  };

  $('#applyFormula').onclick=applyFormula;

  $('#clearSheet').onclick=()=>{
    if(confirm('Clear all cells in this spreadsheet?')) {
      sh.cells=blankGrid();
      selectedCell='A1';
      saveNow();
      render();
    }
  };

  $('#newSheet').onclick=addSpreadsheet;

  $('#exportCSV').onclick=()=>{
    const csv=sh.cells.map((row,r)=>
      row.map((_,c)=>{
        const v=String(cellValue(sh,r,c)??'');
        return '"'+v.replace(/"/g,'""')+'"';
      }).join(',')
    ).join('\r\n');

    downloadFile(
      safeName(sh.title)+'.csv',
      csv,
      'text/csv;charset=utf-8'
    );
  };

  selectCell(selectedCell);
}

function refreshSheet(sh) {
  $$('[data-cell]').forEach(input=>{
    const p=parseAddress(input.dataset.cell);
    const raw=String(cellRaw(sh,p.r,p.c));

    input.classList.toggle('formula',raw.startsWith('='));

    input.value=raw.startsWith('=')?
      String(cellValue(sh,p.r,p.c)):raw;

    input.title=raw.startsWith('=')?
      raw+' = '+cellValue(sh,p.r,p.c):raw;
  });
}

/* SEARCH */

function bindFileSearch(inputSelector,resultsSelector) {
  const input=$(inputSelector);
  const results=$(resultsSelector);

  if(!input||!results) return;

  const update=()=>{
    searchTerm=input.value.toLowerCase().trim();

    const files=allFiles().filter(f=>
      f.title.toLowerCase().includes(searchTerm)
    );

    results.innerHTML=fileRows(files);

    bindCommon();
  };

  input.oninput=update;
  update();
}

/* BACKUP */

function exportBackup() {
  saveNow();

  downloadFile(
    'clamme-backup.json',
    JSON.stringify(state,null,2),
    'application/json;charset=utf-8'
  );

  toast('Backup exported');
}

function importBackup(file) {
  if(file.size>15*1024*1024) {
    toast('Backup is too large to import.');
    return;
  }

  const reader=new FileReader();

  reader.onerror=()=>toast('Could not read that backup.');

  reader.onload=()=>{
    try {
      const next=JSON.parse(reader.result);

      if(!validState(next)) throw Error('Invalid backup');

      if(!confirm(
        'Import this backup? It replaces the workspace currently saved in this browser.'
      )) return;

      state={
        ...initialState(),
        ...next
      };

      selectedSlide=0;
      selectedCell='A1';
      saveNow();
      render();
      toast('Backup successfully imported');
    } catch(e) {
      toast('That file is not a valid Clamme backup.');
    }
  };

  reader.readAsText(file);
}

/* KEYBOARD SHORTCUTS */

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s') {
    e.preventDefault();
    saveNow();
    toast('Everything saved');
  }

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k') {
    e.preventDefault();
    searchTerm='';
    setPage('search');
    setTimeout(()=>$('#searchInput')?.focus(),50);
  }

  if(e.key==='Escape') {
    $('#sidebar').classList.remove('open');
  }
});

/* LIBRARY BACKUP */

document.addEventListener('click',e=>{
  if(e.target.closest('#backupLibrary')) exportBackup();
});

/* INITIALISE */

render();

})();
</script>
