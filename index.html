
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07100b">
<title>✦ Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  color-scheme: dark;
  --bg: #070c09;
  --panel: #0c1510;
  --panel2: #111d15;
  --panel3: #17271b;
  --line: #24372a;
  --text: #edf5ee;
  --muted: #8b9b8f;
  --green: #48bb76;
  --green-light: #91e5aa;
  --serif: 'Alegreya', Georgia, serif;
  --sans: 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 20% -20%, #17472b55, transparent 45%), var(--bg);
  color: var(--text);
  font: 13px var(--sans);
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible,
select:focus-visible, [contenteditable]:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}
button:disabled { opacity: .4; cursor: not-allowed; }

.app { min-height: 100vh; display: grid; grid-template-columns: 225px minmax(0,1fr); }
.sidebar {
  height: 100vh; position: sticky; top: 0;
  display: flex; flex-direction: column;
  padding: 23px 14px 15px;
  background: #09100dee; border-right: 1px solid #203126;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 5px 8px 27px; }
.brand-star {
  width: 39px; height: 39px; display: grid; place-items: center;
  border: 1px solid #36754a; border-radius: 12px;
  background: linear-gradient(145deg,#17472b,#0c2114);
  color: var(--green-light); font-size: 25px;
  box-shadow: 0 5px 24px #0005;
}
.brand-name { font: 24px var(--serif); }
.brand-sub { color: #7c9a83; font-size: 9px; letter-spacing: 2px; margin-top: 3px; }
.section-label { color: #687b6d; font-size: 9px; letter-spacing: 2px; padding: 10px 11px; }
.nav { display: grid; gap: 4px; }
.nav button, .side-button {
  width: 100%; display: flex; gap: 12px; align-items: center;
  padding: 11px 12px; border-radius: 10px;
  color: #9cad9f; background: transparent; border: 1px solid transparent;
  text-align: left; transition: .15s;
}
.nav button:hover, .side-button:hover { background: #ffffff08; color: white; }
.nav button.active {
  color: #edfaef; background: linear-gradient(100deg,#17452b,#102017);
  border-color: #2c5739;
}
.nav-icon { width: 18px; text-align: center; color: #82b48d; font-size: 16px; }
.push { flex: 1; }
.side-note {
  padding: 15px; margin: 15px 2px;
  border: 1px solid #2b4030; border-radius: 14px;
  background: linear-gradient(145deg,#13271a,#0c1510);
}
.side-note .star { color: var(--green-light); font-size: 19px; }
.side-note h3 { font: 19px var(--serif); margin: 9px 0 5px; }
.side-note p { color: var(--muted); font-size: 11px; line-height: 1.7; margin: 0; }
.status { border-top: 1px solid #203126; padding: 15px 8px 3px; color: #829586; font-size: 10px; }
.status span { color: var(--green-light); }

main { min-width: 0; }
.topbar {
  height: 67px; position: sticky; top: 0; z-index: 4;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 27px; border-bottom: 1px solid #1e2d22;
  background: #080f0beF; backdrop-filter: blur(18px);
}
.crumb { color: #8a9a8d; }
.crumb strong { color: #edf5ee; font-weight: 500; }
.actions { display: flex; align-items: center; gap: 8px; }
.save-state { color: #8a9c8d; font-size: 10px; margin-right: 8px; }
.save-state::before { content: '●'; color: var(--green); margin-right: 7px; }
.btn, .icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 12px; border-radius: 9px;
  color: #d5e1d7; background: #111d15; border: 1px solid #2b4030;
  transition: .15s; white-space: nowrap;
}
.btn:hover, .icon-btn:hover { border-color: #4c7957; background: #17271b; }
.btn.primary {
  color: #f4fff5; border-color: #3b9a5a;
  background: linear-gradient(135deg,#318d50,#185c32);
}
.btn.primary:hover { background: linear-gradient(135deg,#3aa560,#21733e); }
.btn.quiet { background: transparent; border-color: transparent; color: #9bad9f; }
.btn.danger { color: #e7a0a0; }
.icon-btn { width: 35px; height: 35px; padding: 0; }

.content { max-width: 1450px; margin: auto; padding: 30px; }
.eyebrow { color: #7dc995; font-size: 9px; letter-spacing: 2.5px; margin-bottom: 10px; }
.page-title { font: 500 clamp(30px,3.5vw,43px)/1.1 var(--serif); margin: 0; }
.subtitle { color: #8d9e91; line-height: 1.8; font-size: 12px; max-width: 600px; margin: 10px 0 0; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin-bottom: 25px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.hero {
  position: relative; overflow: hidden; min-height: 220px;
  display: flex; justify-content: space-between; align-items: center; gap: 20px;
  padding: 34px; border: 1px solid #2c5137; border-radius: 19px;
  background: radial-gradient(ellipse at 85% 40%,#2b7a4835,transparent 40%),
    linear-gradient(120deg,#10271a,#0b1510 70%);
}
.hero h2 { font: 400 clamp(33px,4vw,48px)/1.05 var(--serif); margin: 0; }
.hero h2 em { color: var(--green-light); font-style: normal; }
.hero p { color: #9aab9d; max-width: 480px; line-height: 1.8; margin: 14px 0 20px; }
.hero-mark { font-size: clamp(80px,12vw,145px); color: #91e5aa; text-shadow: 0 0 45px #3eb16b35; padding: 0 22px; }
.hero-copy { z-index: 1; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.section-head { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 13px; }
.section-title { font: 23px var(--serif); }
.muted { color: var(--muted); font-size: 11px; }
.quick-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 13px; }
.quick-card {
  min-height: 135px; padding: 18px; text-align: left; color: var(--text);
  border: 1px solid #25392b; border-radius: 14px;
  background: linear-gradient(145deg,#101b13,#0b120d); transition: .18s;
}
.quick-card:hover { transform: translateY(-2px); border-color: #467352; }
.quick-icon {
  display: grid; place-items: center; width: 36px; height: 36px;
  margin-bottom: 15px; border-radius: 10px; border: 1px solid #2d573a;
  background: #153522; color: var(--green-light); font-size: 17px;
}
.quick-card strong { display: block; font: 21px var(--serif); font-weight: 500; }
.quick-card small { display: block; color: #8c9c90; margin-top: 5px; line-height: 1.6; }

.file-list { border: 1px solid #26392b; border-radius: 14px; overflow: hidden; }
.file-row {
  display: grid; grid-template-columns: 38px minmax(0,1fr) auto auto;
  align-items: center; gap: 12px; padding: 13px 15px;
  border-bottom: 1px solid #1e2c22; background: #0d1510;
}
.file-row:last-child { border-bottom: 0; }
.file-row:hover { background: #111d15; }
.file-icon {
  display: grid; place-items: center; width: 35px; height: 35px;
  border: 1px solid #2d4933; border-radius: 10px;
  background: #13251a; color: #91dca6;
}
.file-title { font-size: 12px; font-weight: 500; }
.file-info { font-size: 10px; color: #7f9184; margin-top: 4px; }
.file-type { font-size: 10px; color: #9aab9d; border: 1px solid #293a2d; padding: 5px 7px; border-radius: 6px; }
.empty { padding: 28px; color: #859688; text-align: center; }

.editor {
  display: grid; grid-template-columns: 205px minmax(0,1fr);
  min-height: 500px; overflow: hidden; border: 1px solid #25392a;
  border-radius: 15px; background: #0b120d;
}
.rail { padding: 14px; border-right: 1px solid #203126; background: #0c1510; }
.rail-head { display: flex; justify-content: space-between; align-items: center; color: #849487; font-size: 10px; margin-bottom: 12px; }
.rail-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 10px; border: 1px solid transparent; border-radius: 9px;
  text-align: left; background: transparent; color: #b1beb4; margin-bottom: 5px;
}
.rail-item:hover { background: #142219; }
.rail-item.active { background: #173322; border-color: #315a3c; color: white; }
.rail-item .remove { margin-left: auto; color: #879789; padding: 0 3px; }
.editor-main { min-width: 0; display: flex; flex-direction: column; }
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
  padding: 12px; border-bottom: 1px solid #213126; background: #0d1711;
}
.toolbar .btn { padding: 8px 10px; }
.toolbar-spacer { flex: 1; }
select, .input {
  min-width: 0; background: #111d15; color: #d8e4da;
  border: 1px solid #2b4030; border-radius: 8px; padding: 9px;
}
.workspace { flex: 1; min-width: 0; padding: 24px; overflow: auto; }
.doc-paper {
  width: min(800px,100%); min-height: 420px; margin: 0 auto;
  padding: 36px clamp(20px,5vw,68px) 50px;
  background: #f4f5ef; color: #263027; border: 1px solid #e2e7de;
  box-shadow: 0 20px 50px #0003;
}
.doc-title {
  width: 100%; padding: 0; margin-bottom: 18px;
  background: transparent; border: 0; outline: none;
  color: #1b2b20; font: 34px var(--serif);
}
.doc-title:focus { outline: none; }
.doc-body {
  min-height: 300px; outline: none; font: 16px/1.8 Georgia,serif;
  overflow-wrap: anywhere;
}
.doc-body:empty::before { content: 'Start writing something worth keeping…'; color: #a0a89f; }
.doc-body h1,.doc-body h2,.doc-body h3 { line-height: 1.2; }
.slide-list { display: flex; gap: 10px; overflow-x: auto; padding: 3px 3px 15px; }
.slide-thumb {
  flex: 0 0 125px; height: 76px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; padding: 9px;
  border: 1px solid #34483a; border-radius: 8px; text-align: left;
  color: #203326; background: #e8eee5;
}
.slide-thumb.active { outline: 2px solid #57c57b; outline-offset: 1px; }
.slide-thumb strong { font: 14px var(--serif); position: relative; z-index: 1; }
.slide-thumb small { margin-top: 5px; position: relative; z-index: 1; opacity: .7; }
.slide-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slide-thumb.has-image { color: white; }
.slide-stage {
  position: relative; overflow: hidden; width: min(100%,1000px); margin: 0 auto;
  aspect-ratio: 16 / 9; background: #edf2e9; color: #1c3022;
  box-shadow: 0 20px 55px #0005;
}
.slide-stage.has-image { color: white; }
.slide-stage .slide-bg {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
}
.slide-shade { position: absolute; inset: 0; background: linear-gradient(90deg,#06130bd9,#06130b66); }
.slide-copy { position: absolute; z-index: 1; inset: 0; padding: 8%; display: flex; flex-direction: column; justify-content: center; }
.slide-heading {
  width: 100%; border: 0; outline: 0; background: transparent; color: inherit;
  font: 500 clamp(22px,4.5vw,52px)/1.08 var(--serif); resize: none; overflow: hidden;
}
.slide-heading:focus,.slide-body:focus { outline: none; }
.slide-body {
  width: 100%; min-height: 90px; margin-top: 17px; padding: 0;
  border: 0; outline: 0; background: transparent; color: inherit;
  font: 16px/1.65 var(--sans); resize: vertical;
}
.slide-body::placeholder { color: currentColor; opacity: .6; }
.slide-hint { color: #819286; font-size: 10px; text-align: center; margin-top: 14px; }
.sheet-wrap { overflow: auto; border: 1px solid #263a2b; border-radius: 10px; }
.sheet { border-collapse: collapse; min-width: 750px; width: 100%; table-layout: fixed; background: #0d1510; }
.sheet th { height: 32px; background: #15251a; color: #93a598; font-size: 10px; font-weight: 500; border: 1px solid #26392b; }
.sheet td { padding: 0; border: 1px solid #213126; }
.sheet td input { width: 100%; height: 33px; padding: 6px 8px; border: 0; border-radius: 0; outline: none; background: transparent; color: #dbe6dc; font-size: 11px; }
.sheet td input:focus { outline: 1px solid #53b875; outline-offset: -1px; background: #16271b; }
.sheet td input.formula { color: #a0e5b4; }
.sheet td input.header-cell { background: #101e14; color: #9dd5aa; font-weight: 600; }
.formula-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.formula-bar label { color: #9bb0a0; min-width: 28px; }
.formula-bar input { flex: 1; min-width: 0; }
.search-input { width: 100%; max-width: 550px; padding: 13px; }
.notice { padding: 12px; border: 1px solid #304633; background: #112017; border-radius: 10px; color: #b9cbbd; }
.toast {
  position: fixed; z-index: 30; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: #183323; border: 1px solid #477b53; color: #e5f8e9;
  border-radius: 10px; padding: 12px 17px; box-shadow: 0 12px 35px #0008;
}
.hidden { display: none !important; }

@media(max-width:900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: -250px; width: 235px; transition: left .2s; box-shadow: 15px 0 45px #0007; }
  .sidebar.open { left: 0; }
  .topbar { padding: 0 16px; }
  .content { padding: 22px 16px; }
  .editor { grid-template-columns: 1fr; }
  .rail { border-right: 0; border-bottom: 1px solid #203126; }
  .rail-items { display: flex; overflow-x: auto; gap: 5px; }
  .rail-item { width: auto; white-space: nowrap; }
  .rail-item .remove { margin-left: 5px; }
}
@media(max-width:600px) {
  .save-state { display: none; }
  .topbar { height: 60px; }
  .hero { padding: 23px; }
  .hero-mark { display: none; }
  .quick-grid { grid-template-columns: 1fr; }
  .quick-card { min-height: 110px; }
  .page-head { align-items: flex-start; flex-direction: column; }
  .file-row { grid-template-columns: 35px minmax(0,1fr) auto; }
  .file-type { display: none; }
  .workspace { padding: 14px; }
  .doc-paper { padding: 24px 20px; }
  .toolbar { gap: 5px; }
  .toolbar .btn { padding: 8px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-star">✦</div>
      <div><div class="brand-name">Studio</div><div class="brand-sub">A SPACE TO CREATE</div></div>
    </div>
    <div class="section-label">WORKSPACE</div>
    <nav class="nav">
      <button data-page="home" class="active"><span class="nav-icon">⌂</span>Overview</button>
      <button data-page="documents"><span class="nav-icon">▤</span>Documents</button>
      <button data-page="slides"><span class="nav-icon">▧</span>Presentations</button>
      <button data-page="sheets"><span class="nav-icon">▦</span>Spreadsheets</button>
      <button data-page="files"><span class="nav-icon">◇</span>Your files</button>
    </nav>
    <div class="section-label" style="margin-top:18px">TOOLS</div>
    <button class="side-button" id="searchButton"><span class="nav-icon">⌕</span>Find anything</button>
    <button class="side-button" id="backupButton"><span class="nav-icon">↧</span>Export backup</button>
    <button class="side-button" id="importButton"><span class="nav-icon">↥</span>Import backup</button>
    <input id="backupInput" type="file" accept=".json,application/json" hidden>
    <div class="push"></div>
    <div class="side-note"><div class="star">✦</div><h3>Make room for ideas.</h3><p>A calm, focused workspace for writing, presenting and making sense of things.</p></div>
    <div class="status"><span>●</span> Saved on this device</div>
  </aside>

  <main>
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="icon-btn" id="menuButton" aria-label="Open menu">☰</button>
        <div class="crumb">Workspace <span style="color:#425647">/</span> <strong id="breadcrumb">Overview</strong></div>
      </div>
      <div class="actions">
        <span class="save-state" id="saveState">Autosaved</span>
        <button class="btn" id="topSearch">⌕ Search</button>
        <button class="btn primary" id="newButton">＋ New</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="toastHost"></div>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const KEY = 'star-studio-workspace-v1';
const FONT_OPTIONS = ['Alegreya','Inter','Georgia','Arial','Verdana','Times New Roman','Courier New'];

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const blankGrid = () => Array.from({length:15}, () => Array(10).fill(''));

function initialState() {
  return {
    documents: [],
    presentations: [],
    spreadsheets: [],
    page: 'home',
    activeDocument: null,
    activePresentation: null,
    activeSpreadsheet: null
  };
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.documents) &&
        Array.isArray(saved.presentations) && Array.isArray(saved.spreadsheets)) {
      return {...initialState(), ...saved};
    }
  } catch (e) {}
  return initialState();
}

let state = loadState();
let selectedSlide = 0;
let selectedCell = 'A1';
let searchTerm = '';
let saveTimer;
let toastTimer;

const pageNames = {
  home:'Overview', documents:'Documents', slides:'Presentations',
  sheets:'Spreadsheets', files:'Your files', search:'Search'
};

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function safeName(value) {
  return (String(value || 'untitled').trim()
    .replace(/[^a-z0-9-_]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,60)) || 'untitled';
}

function toast(message) {
  clearTimeout(toastTimer);
  $('#toastHost').innerHTML = `<div class="toast" role="status">${escapeHTML(message)}</div>`;
  toastTimer = setTimeout(() => $('#toastHost').innerHTML = '', 2300);
}

function saveNow() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    $('#saveState').textContent = 'Autosaved';
  } catch (e) {
    $('#saveState').textContent = 'Storage full';
    toast('Browser storage is full. Export a backup and reduce large images.');
  }
}

function saveSoon() {
  $('#saveState').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 250);
}

function downloadFile(name, data, type) {
  const blob = new Blob([data], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}

function addDocument() {
  const item = {id:uid(), title:'Untitled document', content:'', updated:Date.now()};
  state.documents.unshift(item);
  state.activeDocument = item.id;
  state.page = 'documents';
  saveNow(); render();
}

function addPresentation() {
  const item = {
    id:uid(), title:'Untitled presentation', updated:Date.now(),
    slides:[{title:'A new beginning', body:'Add your ideas here.', image:'', font:'Alegreya'}]
  };
  state.presentations.unshift(item);
  state.activePresentation = item.id;
  selectedSlide = 0;
  state.page = 'slides';
  saveNow(); render();
}

function addSpreadsheet() {
  const item = {id:uid(), title:'Untitled spreadsheet', cells:blankGrid(), updated:Date.now()};
  state.spreadsheets.unshift(item);
  state.activeSpreadsheet = item.id;
  state.page = 'sheets';
  saveNow(); render();
}

function createMenu() {
  const choice = prompt('Create what?\n1 — Document\n2 — Presentation\n3 — Spreadsheet');
  if (choice === '1') addDocument();
  if (choice === '2') addPresentation();
  if (choice === '3') addSpreadsheet();
}

function activeDocument() {
  return state.documents.find(x => x.id === state.activeDocument);
}
function activePresentation() {
  return state.presentations.find(x => x.id === state.activePresentation);
}
function activeSpreadsheet() {
  return state.spreadsheets.find(x => x.id === state.activeSpreadsheet);
}

function setPage(page) {
  state.page = page;
  saveSoon();
  render();
}

function pageHead(eyebrow, title, subtitle, actions='') {
  return `<div class="page-head"><div>
    <div class="eyebrow">${eyebrow}</div>
    <h1 class="page-title">${title}</h1>
    ${subtitle ? `<p class="subtitle">${subtitle}</p>` : ''}
  </div><div class="head-actions">${actions}</div></div>`;
}

function quickCard(icon, title, desc, page) {
  return `<button class="quick-card" data-create="${page}">
    <span class="quick-icon">${icon}</span>
    <strong>${title}</strong><small>${desc}</small>
  </button>`;
}

function allFiles() {
  return [
    ...state.documents.map(x => ({...x, kind:'Document', icon:'▤', page:'documents'})),
    ...state.presentations.map(x => ({...x, kind:'Presentation', icon:'▧', page:'slides'})),
    ...state.spreadsheets.map(x => ({...x, kind:'Spreadsheet', icon:'▦', page:'sheets'}))
  ].sort((a,b) => (b.updated||0) - (a.updated||0));
}

function fileRows(files) {
  if (!files.length) return `<div class="empty"><div style="font-size:25px;color:#78cc91;margin-bottom:8px">✦</div>No files yet. Create something new to begin.</div>`;
  return `<div class="file-list">${files.map(f => `<div class="file-row">
    <div class="file-icon">${f.icon}</div>
    <div><div class="file-title">${escapeHTML(f.title)}</div>
    <div class="file-info">Updated ${new Date(f.updated||Date.now()).toLocaleDateString()}</div></div>
    <span class="file-type">${f.kind}</span>

function colName(n) {
  let s='';
  while(n>=0){s=String.fromCharCode(n%26+65)+s;n=Math.floor(n/26)-1;}
  return s;
}

function parseAddress(addr) {
  const m = /^([A-Z]+)(\d+)$/i.exec(addr);
  if (!m) return {r:0,c:0};
  let c=0;
  for(const ch of m[1].toUpperCase()) c=c*26+ch.charCodeAt(0)-64;
  return {r:Math.max(0,Number(m[2])-1),c:Math.max(0,c-1)};
}

function cellRaw(sheet,r,c) {
  return sheet.cells[r]?.[c] ?? '';
}

function numericCell(sheet,r,c,seen=new Set()) {
  const raw=String(cellRaw(sheet,r,c));
  if(!raw.startsWith('=')) {
    const n=Number(raw);
    return raw.trim()!=='' && Number.isFinite(n) ? n : 0;
  }
  const key=`${r},${c}`;
  if(seen.has(key)) return '#CYCLE!';
  seen.add(key);
  const formula=raw.slice(1).replace(/\b([A-Z]+\d+)\b/gi, ref => {
    const p=parseAddress(ref);
    return String(numericCell(sheet,p.r,p.c,new Set(seen)));
  });
  if(!/^[\d\s()+\-*/.,%]+$/.test(formula)) return '#ERROR';
  try {
    const result=Function('"use strict";return ('+formula+')')();
    return Number.isFinite(result) ? result : '#ERROR';
  } catch(e) { return '#ERROR'; }
}

function cellValue(sheet,r,c) {
  const raw=String(cellRaw(sheet,r,c));
  return raw.startsWith('=') ? numericCell(sheet,r,c) : raw;
}

function spreadsheetHTML() {
  const sh = activeSpreadsheet();
  if (!sh) return `${pageHead('NUMBERS','Spreadsheets','A simple grid for your data and calculations.',
    '<button class="btn primary" data-create="sheets">＋ New spreadsheet</button>')}
    ${fileRows(allFiles().filter(f=>f.kind==='Spreadsheet'))}`;

  const columns=10, rows=15;
  let html=`${pageHead('SPREADSHEET','Make the numbers make sense.','Enter values or formulas such as =SUM(A1:A5).',
    '<button class="btn" id="exportCSV">Export CSV</button><button class="btn primary" id="newSheet">＋ New</button>')}
    <div style="display:flex;gap:10px;margin-bottom:13px">
      <input class="input" id="sheetTitle" value="${escapeHTML(sh.title)}" style="flex:1;font:20px var(--serif)" aria-label="Spreadsheet title">
      <button class="btn" id="clearSheet">Clear cells</button>
    </div>
    <div class="formula-bar"><label id="cellName">${selectedCell}</label>
      <input class="input" id="formulaInput" placeholder="Value or formula, e.g. =A1+B1">
      <button class="btn primary" id="applyFormula">Apply</button>
    </div><div class="sheet-wrap"><table class="sheet"><thead><tr><th style="width:40px">#</th>`;
  for(let c=0;c<columns;c++) html+=`<th>${colName(c)}</th>`;
  html+='</tr></thead><tbody>';
  for(let r=0;r<rows;r++) {
    html+=`<tr><th>${r+1}</th>`;
    for(let c=0;c<columns;c++) {
      const addr=colName(c)+(r+1), raw=cellRaw(sh,r,c);
      const value=String(raw).startsWith('=')?cellValue(sh,r,c):raw;
      html+=`<td><input data-cell="${addr}" class="${String(raw).startsWith('=')?'formula':''} ${r===0?'header-cell':''}" value="${escapeHTML(value)}" aria-label="${addr}" title="${escapeHTML(raw)}"></td>`;
    }
    html+='</tr>';
  }
  html+='</tbody></table></div><p class="muted" style="margin-top:10px">15 rows · 10 columns · Formulas begin with =</p>';
  return html;
}

function bindSpreadsheet() {
  const sh=activeSpreadsheet();
  if(!sh)return;
  $('#sheetTitle').oninput=e=>{sh.title=e.target.value;sh.updated=Date.now();saveSoon();};

  function selectCell(addr) {
    selectedCell=addr;
    $('#cellName').textContent=addr;
    const p=parseAddress(addr);
    $('#formulaInput').value=cellRaw(sh,p.r,p.c);
    $$('[data-cell]').forEach(input=>input.style.background=input.dataset.cell===addr?'#183121':'');
  }

  $$('[data-cell]').forEach(input=>{
    const addr=input.dataset.cell;
    input.addEventListener('focus',()=>selectCell(addr));
    input.addEventListener('click',()=>selectCell(addr));
    input.addEventListener('change',()=>{
      const p=parseAddress(addr);
      sh.cells[p.r][p.c]=input.value;
      sh.updated=Date.now();saveSoon();
      refreshSheet(sh);
    });
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter') {
        e.preventDefault();input.blur();
        const p=parseAddress(addr);
        $(`[data-cell="${colName(p.c)+(Math.min(15,p.r+2))}"]`)?.focus();
      }
    });
  });

  $('#formulaInput').onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();applyFormula();}
  };
  $('#applyFormula').onclick=applyFormula;

  function applyFormula() {
    const p=parseAddress(selectedCell);
    sh.cells[p.r][p.c]=$('#formulaInput').value;
    sh.updated=Date.now();saveNow();render();
  }

  $('#clearSheet').onclick=()=>{
    if(confirm('Clear all cells in this spreadsheet?')) {
      sh.cells=blankGrid();selectedCell='A1';saveNow();render();
    }
  };
  $('#newSheet').onclick=addSpreadsheet;
  $('#exportCSV').onclick=()=>{
    const csv=sh.cells.map((row,r)=>row.map((_,c)=>{
      const v=String(cellValue(sh,r,c)??'');
      return '"'+v.replace(/"/g,'""')+'"';
    }).join(',')).join('\r\n');
    downloadFile(safeName(sh.title)+'.csv',csv,'text/csv;charset=utf-8');
  };
  selectCell(selectedCell);
}

function refreshSheet(sh) {
  $$('[data-cell]').forEach(input=>{
    const p=parseAddress(input.dataset.cell);
    const raw=String(cellRaw(sh,p.r,p.c));
    input.classList.toggle('formula',raw.startsWith('='));
    input.value=raw.startsWith('=')?String(cellValue(sh,p.r,p.c)):raw;
    input.title=raw.startsWith('=')?raw+' = '+cellValue(sh,p.r,p.c):raw;
  });
}

function bindFileSearch(inputSelector,resultsSelector) {
  const input=$(inputSelector);
  const results=$(resultsSelector);
  if(!input||!results)return;
  const update=()=>{
    searchTerm=input.value.toLowerCase().trim();
    const files=allFiles().filter(f=>f.title.toLowerCase().includes(searchTerm));
    results.innerHTML=fileRows(files);
    bindCommon();
  };
  input.oninput=update;
  update();
}

function exportBackup() {
  saveNow();
  downloadFile('studio-backup.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');
}

function importBackup(file) {
  if(file.size>15*1024*1024) {toast('Backup is too large to import.');return;}
  const reader=new FileReader();
  reader.onerror=()=>toast('Could not read that backup.');
  reader.onload=()=>{
    try {
      const next=JSON.parse(reader.result);
      if(!next || !Array.isArray(next.documents) ||
         !Array.isArray(next.presentations) || !Array.isArray(next.spreadsheets)) {
        throw new Error('Invalid backup');
      }
      if(!confirm('Import this backup? It replaces the workspace currently saved in this browser.')) return;
      state={...initialState(),...next};
      saveNow();render();toast('Backup imported');
    } catch(e) { toast('That file is not a valid Studio backup.'); }
  };
  reader.readAsText(file);
}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s') {
    e.preventDefault();saveNow();toast('Everything saved');
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k') {
    e.preventDefault();searchTerm='';setPage('search');
  }
  if(e.key==='Escape') $('#sidebar').classList.remove('open');
});

render();
})();
</script>
</body>
</html>
