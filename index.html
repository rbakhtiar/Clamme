<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clamme</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --black:#020604;
  --black-2:#050b07;

  --emerald-0:#07130d;
  --emerald-1:#0a1c12;
  --emerald-2:#0d2618;
  --emerald-3:#123a24;
  --emerald-4:#185637;
  --emerald-5:#26734a;
  --emerald-light:#65c994;

  --border:#163a27;
  --border-light:#23563a;

  --text:#f2f7f4;
  --muted:#91a89b;
  --dim:#60776a;

  --paper:#fcfdfc;
  --ink:#152019;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:"Alegreya",serif;
  color:var(--text);
  background:var(--black);
  overflow:hidden;
}

button,
input,
select,
textarea{
  font-family:"Alegreya",serif;
}

button{
  cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

.app{
  height:100vh;
  width:100%;

  display:flex;

  background:
    radial-gradient(
      circle at 75% -10%,
      rgba(28,105,64,.13),
      transparent 32%
    ),
    var(--black);
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:230px;
  flex-shrink:0;

  display:flex;
  flex-direction:column;

  padding:26px 16px;

  background:
    linear-gradient(
      180deg,
      #091910 0%,
      #050c08 100%
    );

  border-right:1px solid var(--border);
}

.brand{
  padding:0 10px 30px;

  font-size:31px;
  line-height:1;

  font-weight:600;
  letter-spacing:-1px;
}

.brand span{
  color:var(--emerald-light);
}

/* =========================================================
   PREMIUM NEW BUTTON
========================================================= */

.new-button{
  position:relative;

  width:100%;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  border:1px solid #285a3e;
  border-radius:5px;

  background:#0c2116;

  color:#eef7f1;

  font-size:17px;
  font-weight:500;

  letter-spacing:.1px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 4px 16px rgba(0,0,0,.18);

  transition:
    background .16s ease,
    border-color .16s ease,
    transform .12s ease;
}

.new-button::before{
  content:"+";

  color:var(--emerald-light);

  font-size:21px;
  line-height:1;

  transform:translateY(-1px);
}

.new-button:hover{
  background:#102c1b;
  border-color:#3b7653;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 5px 18px rgba(0,0,0,.22);
}

.new-button:active{
  transform:translateY(1px);

  background:#091a10;
  border-color:#28583d;
}

/* =========================================================
   NAVIGATION
========================================================= */

.nav{
  margin-top:25px;

  display:flex;
  flex-direction:column;
  gap:3px;
}

.nav button{
  width:100%;

  height:39px;

  padding:0 13px;

  text-align:left;

  border:0;
  border-left:2px solid transparent;

  background:transparent;

  color:var(--muted);

  font-size:17px;

  transition:
    background .15s ease,
    color .15s ease,
    border-color .15s ease;
}

.nav button:hover{
  background:rgba(30,112,69,.11);
  color:var(--text);
}

.nav button.active{
  color:#ffffff;

  border-left-color:var(--emerald-light);

  background:
    linear-gradient(
      90deg,
      rgba(27,107,65,.31),
      rgba(27,107,65,.045)
    );
}

.sidebar-footer{
  margin-top:auto;

  padding:12px 10px 0;

  color:var(--dim);

  font-size:14px;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  min-width:0;
  flex:1;

  display:flex;
  flex-direction:column;
}

.topbar{
  height:61px;
  flex-shrink:0;

  display:flex;
  align-items:center;

  padding:0 21px;

  background:
    rgba(5,14,9,.94);

  border-bottom:1px solid var(--border);
}

.title{
  font-size:21px;
  font-weight:500;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-actions{
  margin-left:auto;

  display:flex;
  gap:5px;
}

.top-button{
  height:31px;

  padding:0 10px;

  background:transparent;

  border:1px solid var(--border);

  border-radius:4px;

  color:var(--muted);

  font-size:14px;
}

.top-button:hover{
  color:white;
  background:var(--emerald-1);
  border-color:var(--border-light);
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
  min-height:0;
  flex:1;

  overflow:auto;

  background:
    radial-gradient(
      circle at 85% 0%,
      rgba(32,117,70,.10),
      transparent 32%
    ),
    #050c08;
}

/* =========================================================
   HOME
========================================================= */

.home{
  width:min(1080px,100%);

  margin:auto;

  padding:74px 46px;
}

.hero{
  margin-bottom:52px;
}

.hero h1{
  margin:0;

  font-size:55px;
  line-height:1;

  font-weight:500;

  letter-spacing:-2px;
}

.hero h1 span{
  color:var(--emerald-light);
}

.hero p{
  margin:10px 0 0;

  color:var(--muted);

  font-size:20px;
}

.create-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.create-card{
  min-height:160px;

  padding:25px;

  text-align:left;

  background:
    linear-gradient(
      145deg,
      rgba(21,82,51,.20),
      rgba(6,17,11,.08)
    );

  border:0;

  color:white;

  transition:
    background .17s ease;
}

.create-card + .create-card{
  border-left:1px solid var(--border);
}

.create-card:hover{
  background:
    linear-gradient(
      145deg,
      rgba(30,111,68,.29),
      rgba(6,17,11,.10)
    );
}

.create-card-title{
  font-size:27px;
}

.create-card-desc{
  margin-top:3px;

  color:var(--muted);

  font-size:16px;
}

.workspace-heading{
  margin-top:52px;
  margin-bottom:14px;

  font-size:23px;
}

/* =========================================================
   FILE LIST
========================================================= */

.file-list{
  border-top:1px solid var(--border);
}

.file-row{
  min-height:51px;

  display:grid;
  grid-template-columns:1fr 160px 140px;

  align-items:center;

  padding:7px 11px;

  border-bottom:1px solid var(--border);

  transition:
    background .14s ease;
}

.file-row:hover{
  background:rgba(18,58,36,.16);
}

.file-name{
  font-size:18px;

  cursor:pointer;
}

.file-name:hover{
  color:var(--emerald-light);
}

.file-type{
  color:var(--muted);
}

.file-actions{
  display:flex;
  justify-content:flex-end;
  gap:12px;
}

.file-actions button{
  border:0;
  background:transparent;

  color:var(--muted);
}

.file-actions button:hover{
  color:white;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty{
  min-height:290px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  color:var(--muted);
}

.empty h2{
  margin:0 0 4px;

  color:white;

  font-size:30px;
  font-weight:500;
}

/* =========================================================
   EDITOR
========================================================= */

.editor{
  height:100%;

  display:flex;
  flex-direction:column;
}

.toolbar{
  min-height:51px;
  flex-shrink:0;

  display:flex;
  align-items:center;

  gap:3px;

  padding:7px 12px;

  background:#07140d;

  border-bottom:1px solid var(--border);

  overflow-x:auto;
}

.tool{
  height:32px;
  min-width:34px;

  padding:0 9px;

  background:transparent;

  border:1px solid transparent;
  border-radius:4px;

  color:var(--muted);

  font-size:15px;

  white-space:nowrap;
}

.tool:hover{
  color:white;

  background:var(--emerald-1);

  border-color:var(--border);
}

.tool.primary{
  color:#f4fff8;

  background:var(--emerald-3);

  border-color:var(--emerald-4);
}

.tool.primary:hover{
  background:var(--emerald-4);
  border-color:#397c55;
}

.select{
  height:32px;

  padding:0 9px;

  background:var(--emerald-1);

  border:1px solid var(--border);

  border-radius:4px;

  color:white;
}

/* =========================================================
   DOCUMENT
========================================================= */

.document-space{
  flex:1;

  overflow:auto;

  padding:55px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(25,91,55,.07),
      transparent 45%
    );
}

.document{
  width:794px;
  min-height:1123px;

  margin:auto;

  padding:78px 84px;

  outline:none;

  background:var(--paper);
  color:var(--ink);

  box-shadow:
    0 25px 80px rgba(0,0,0,.45);
}

.document:empty::before{
  content:"Start writing…";

  color:#a2aaa5;
}

.document p{
  margin:0 0 13px;

  font-size:18px;
  line-height:1.7;
}

.document h1{
  font-size:41px;
  line-height:1.15;
}

.document h2{
  font-size:30px;
}

.document h3{
  font-size:24px;
}

/* =========================================================
   SLIDES
========================================================= */

.slides-layout{
  min-height:0;
  flex:1;

  display:flex;
}

.slide-sidebar{
  width:180px;
  flex-shrink:0;

  padding:13px;

  background:#06110b;

  border-right:1px solid var(--border);

  overflow:auto;
}

.slide-sidebar-top{
  display:flex;
  gap:4px;

  margin-bottom:13px;
}

.slide-sidebar-top button{
  flex:1;

  height:32px;

  border:1px solid var(--border);
  border-radius:4px;

  background:transparent;

  color:var(--muted);
}

.slide-sidebar-top button:hover{
  color:white;
  background:var(--emerald-1);
}

.thumbnail{
  width:100%;

  aspect-ratio:16/9;

  margin-bottom:10px;

  padding:7px;

  overflow:hidden;

  text-align:left;

  background:var(--paper);
  color:var(--ink);

  border:2px solid transparent;

  font-family:"Alegreya",serif;
  font-size:10px;
}

.thumbnail.active{
  border-color:var(--emerald-light);

  box-shadow:
    0 0 0 1px var(--emerald-4);
}

.slide-stage{
  min-width:0;
  flex:1;

  overflow:auto;

  padding:45px;

  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.slide{
  width:min(1000px,85vw);

  aspect-ratio:16/9;

  padding:70px;

  outline:none;

  background:var(--paper);
  color:var(--ink);

  font-size:30px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.45);
}

.slide:empty::before{
  content:"Start your presentation…";
  color:#a2aaa5;
}

/* =========================================================
   SHEETS
========================================================= */

.sheet{
  height:100%;

  display:flex;
  flex-direction:column;
}

.sheet-toolbar{
  min-height:49px;

  display:flex;
  align-items:center;

  padding:7px 12px;

  background:#07140d;

  border-bottom:1px solid var(--border);
}

.formula-bar{
  height:42px;
  flex-shrink:0;

  display:flex;

  background:#050c08;

  border-bottom:1px solid var(--border);
}

.cell-reference{
  width:76px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--emerald-light);

  border-right:1px solid var(--border);

  font-size:16px;
}

.formula-input{
  min-width:0;
  flex:1;

  padding:0 13px;

  border:0;
  outline:none;

  background:transparent;

  color:white;

  font-size:16px;
}

.sheet-scroll{
  min-height:0;
  flex:1;

  overflow:auto;
}

.sheet-table{
  min-width:100%;

  border-collapse:collapse;
}

.sheet-table th,
.sheet-table td{
  height:33px;
  min-width:110px;

  padding:4px 8px;

  border-right:1px solid #173525;
  border-bottom:1px solid #173525;
}

.sheet-table th{
  position:sticky;
  top:0;

  z-index:3;

  background:#0a1b11;

  color:var(--muted);

  font-weight:500;

  text-align:center;
}

.sheet-table .row-number{
  position:sticky;
  left:0;

  z-index:4;

  width:48px;
  min-width:48px;

  background:#0a1b11;
}

.sheet-table td{
  background:#040a06;

  color:white;

  outline:none;
}

.sheet-table td:focus{
  background:#0b2115;

  box-shadow:
    inset 0 0 0 1px var(--emerald-light);
}

.sheet-table td.formula-result{
  color:var(--emerald-light);
}

/* =========================================================
   MODALS
========================================================= */

.overlay{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.78);
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(440px,90vw);

  padding:26px;

  background:
    linear-gradient(
      145deg,
      #0d2417,
      #07100b
    );

  border:1px solid var(--border-light);

  box-shadow:
    0 30px 90px rgba(0,0,0,.55);
}

.modal h2{
  margin:0 0 18px;

  font-size:26px;
  font-weight:500;
}

.modal-input{
  width:100%;
  height:42px;

  padding:0 11px;

  background:#040906;

  border:1px solid var(--border-light);

  outline:none;

  color:white;

  font-size:17px;
}

.modal-input:focus{
  border-color:var(--emerald-light);
}

.modal-actions{
  margin-top:18px;

  display:flex;
  justify-content:flex-end;
  gap:5px;
}

.modal-actions button{
  padding:7px 14px;

  background:transparent;

  border:0;

  color:var(--muted);
}

.modal-actions button:hover{
  color:white;
}

.modal-actions .primary{
  color:white;

  background:var(--emerald-3);

  border:1px solid var(--emerald-4);

  border-radius:4px;
}

/* =========================================================
   COMMAND PALETTE
========================================================= */

.command{
  width:min(620px,90vw);
}

.command-list{
  max-height:340px;

  margin-top:8px;

  overflow:auto;
}

.command-item{
  padding:10px;

  color:var(--muted);

  cursor:pointer;
}

.command-item:hover{
  background:var(--emerald-1);
  color:white;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;
  bottom:22px;

  z-index:200;

  padding:8px 15px;

  background:#0c2116;

  border:1px solid var(--border-light);

  color:white;

  opacity:0;

  pointer-events:none;

  transform:translate(-50%,10px);

  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

  .sidebar{
    width:65px;
    padding:19px 7px;
  }

  .brand{
    padding:0 0 26px;

    text-align:center;

    font-size:0;
  }

  .brand span{
    font-size:28px;
  }

  .new-button{
    font-size:0;
    gap:0;
  }

  .new-button::before{
    font-size:24px;
  }

  .nav button{
    padding:0;

    text-align:center;

    font-size:0;

    border-left:0;
  }

  .nav button.active{
    border-left:0;
    box-shadow:inset 0 0 0 1px var(--emerald-4);
  }

  .sidebar-footer{
    display:none;
  }

  .home{
    padding:45px 20px;
  }

  .hero h1{
    font-size:41px;
  }

  .create-grid{
    grid-template-columns:1fr;
  }

  .create-card{
    min-height:110px;
  }

  .create-card + .create-card{
    border-left:0;
    border-top:1px solid var(--border);
  }

  .document-space{
    padding:20px;
  }

  .document{
    width:100%;
    min-height:900px;
    padding:45px 30px;
  }

  .slide-sidebar{
    width:110px;
  }

  .slide-stage{
    padding:20px;
  }

  .slide{
    width:95vw;
    padding:35px;
  }

  .file-row{
    grid-template-columns:1fr 90px;
  }

  .file-type{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">
      clamme<span>.</span>
    </div>

    <button
      class="new-button"
      onclick="newDocument()"
    >
      New
    </button>

    <nav class="nav">

      <button
        id="navHome"
        class="active"
        onclick="goHome()"
      >
        Home
      </button>

      <button
        id="navDocs"
        onclick="showFiles('doc')"
      >
        Docs
      </button>

      <button
        id="navSlides"
        onclick="showFiles('slide')"
      >
        Slides
      </button>

      <button
        id="navSheets"
        onclick="showFiles('sheet')"
      >
        Sheets
      </button>

    </nav>

    <div class="sidebar-footer">
      Clamme
    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div
        id="pageTitle"
        class="title"
      >
        Home
      </div>

      <div class="top-actions">

        <button
          class="top-button"
          onclick="openCommands()"
        >
          Ctrl K
        </button>

      </div>

    </header>

    <section
      id="workspace"
      class="workspace"
    ></section>

  </main>

</div>

<!-- FILE MODAL -->

<div
  id="fileModal"
  class="overlay"
>

  <div class="modal">

    <h2 id="modalHeading">
      New document
    </h2>

    <input
      id="fileInput"
      class="modal-input"
      autocomplete="off"
    >

    <div class="modal-actions">

      <button onclick="closeFileModal()">
        Cancel
      </button>

      <button
        class="primary"
        onclick="confirmFileModal()"
      >
        Create
      </button>

    </div>

  </div>

</div>

<!-- COMMAND PALETTE -->

<div
  id="commandModal"
  class="overlay"
>

  <div class="modal command">

    <input
      id="commandInput"
      class="modal-input"
      placeholder="Search commands..."
      oninput="filterCommands()"
    >

    <div
      id="commandList"
      class="command-list"
    ></div>

  </div>

</div>

<div
  id="toast"
  class="toast"
></div>

<script>

/* =========================================================
   STATE
========================================================= */

const STORAGE_KEY="clamme_smart_premium_v3";

let state=
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || {
    files:[]
  };

let currentFile=null;

let pendingType="doc";
let pendingAction="create";
let pendingRename=null;

let activeSlide=0;

let selectedCell=null;

let rowCount=30;
let columnCount=10;

/* =========================================================
   STORAGE
========================================================= */

function saveState(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}

function toast(message){

  const element=
    document.getElementById("toast");

  element.textContent=message;

  element.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast=
    setTimeout(
      ()=>{
        element.classList.remove("show");
      },
      1400
    );
}

/* =========================================================
   NAVIGATION
========================================================= */

function setNav(id){

  document
    .querySelectorAll(".nav button")
    .forEach(
      button=>
        button.classList.remove("active")
    );

  document
    .getElementById(id)
    ?.classList.add("active");

}

/* =========================================================
   HOME
========================================================= */

function goHome(){

  currentFile=null;

  setNav("navHome");

  pageTitle.textContent="Home";

  workspace.innerHTML=`

    <div class="home">

      <div class="hero">

        <h1>
          Clamme<span>.</span>
        </h1>

        <p>
          A focused workspace for writing, presenting and calculating.
        </p>

      </div>

      <div class="create-grid">

        <button
          class="create-card"
          onclick="createFile('doc')"
        >

          <div class="create-card-title">
            Document
          </div>

          <div class="create-card-desc">
            Write
          </div>

        </button>

        <button
          class="create-card"
          onclick="createFile('slide')"
        >

          <div class="create-card-title">
            Presentation
          </div>

          <div class="create-card-desc">
            Present
          </div>

        </button>

        <button
          class="create-card"
          onclick="createFile('sheet')"
        >

          <div class="create-card-title">
            Spreadsheet
          </div>

function fileRow(file){

}

/* =========================================================
   CREATE
========================================================= */

function newDocument(){

  createFile("doc");

}

function createFile(type){

  pendingType=type;
  pendingAction="create";

  const defaultNames={
    doc:"Untitled document",
    slide:"Untitled presentation",
    sheet:"Untitled spreadsheet"
  };

  modalHeading.textContent=
    "New "+typeName(type).toLowerCase();

  fileInput.value=
    defaultNames[type];

  fileModal.classList.add("show");

  setTimeout(
    ()=>{
      fileInput.focus();
      fileInput.select();
    },
    30
  );

}

function confirmFileModal(){

  const name=
    fileInput.value.trim()
    ||"Untitled";

  if(pendingAction==="rename"){

    const file=
      state.files.find(
        f=>f.id===pendingRename
      );

    if(file){

      file.name=name;
      file.updated=Date.now();

    }

    saveState();

    closeFileModal();

    if(currentFile)
      openFile(currentFile.id);
    else
      goHome();

    return;
  }

  const file={
    id:
      typeof crypto!=="undefined"
      &&crypto.randomUUID
      ?crypto.randomUUID()
      :Date.now().toString(),

    name:name,

    type:typeSafe(pendingType),

    created:Date.now(),

    updated:Date.now()
  };

  if(file.type==="doc"){

    file.content="";

  }

  if(file.type==="slide"){

    file.slides=[
      {
        id:
          Date.now().toString(),
        content:""
      }
    ];

  }

  if(file.type==="sheet"){

    file.cells={};

  }

  state.files.push(file);

  saveState();

  closeFileModal();

  openFile(file.id);

}

function typeSafe(type){

  return ["doc","slide","sheet"]
    .includes(type)
    ?type
    :"doc";
}

function renameFile(id){

  const file=
    state.files.find(
      f=>f.id===id
    );

  if(!file)
    return;

  pendingAction="rename";
  pendingRename=id;

  modalHeading.textContent="Rename";

  fileInput.value=file.name;

  fileModal.classList.add("show");

  setTimeout(
    ()=>{
      fileInput.focus();
      fileInput.select();
    },
    30
  );

}

function closeFileModal(){

  fileModal.classList.remove("show");

}

/* =========================================================
   DELETE
========================================================= */

function deleteFile(id){

  const file=
    state.files.find(
      f=>f.id===id
    );

  if(!file)
    return;

  if(
    !confirm(
      `Delete "${file.name}"?`
    )
  )
    return;

  state.files=
    state.files.filter(
      f=>f.id!==id
    );

  saveState();

  showFiles(file.type);

}

/* =========================================================
   OPEN
========================================================= */

function openFile(id){

  currentFile=
    state.files.find(
      f=>f.id===id
    );

  if(!currentFile)
    return;

  pageTitle.textContent=
    currentFile.name;

  if(currentFile.type==="doc")
    renderDocument();

  if(currentFile.type==="slide")
    renderSlides();

  if(currentFile.type==="sheet")
    renderSpreadsheet();

}

function renderThumbnails(){

    currentFile.slides
      .map(

              index===activeSlide
              ?"active"
              :""
            }"
            onclick="selectSlide(${index})"

        `
      )

}

function loadActiveSlide(){

  slideEditor.innerHTML=
    currentFile
      .slides[
        activeSlide
      ]
      .content||"";

}

function saveSlide(){

  if(!currentFile)
    return;

  currentFile.slides[
    activeSlide
  ].content=
    slideEditor.innerHTML;

  currentFile.updated=
    Date.now();

  saveState();

  renderThumbnails();

}

function selectSlide(index){

  saveSlide();

  activeSlide=
    Math.max(
      0,
      Math.min(
        index,
        currentFile.slides.length-1
      )
    );

  renderThumbnails();

  loadActiveSlide();

}

function addSlide(){

  saveSlide();

  currentFile.slides.push({
    id:Date.now().toString(),
    content:""
  });

  activeSlide=
    currentFile.slides.length-1;

  saveState();

  renderThumbnails();

  loadActiveSlide();

  slideEditor?.focus();

}

function duplicateSlide(){

  saveSlide();

  const original=
    currentFile.slides[
      activeSlide
    ];

  const copy={
    id:Date.now().toString(),
    content:original.content||""
  };

  currentFile.slides.splice(
    activeSlide+1,
    0,
    copy
  );

  activeSlide++;

  saveState();

  renderThumbnails();

  loadActiveSlide();

}

function deleteSlide(){

  if(
    currentFile.slides.length<=1
  ){

    toast(
      "A presentation needs one slide."
    );

    return;
  }

  currentFile.slides.splice(
    activeSlide,
    1
  );

  activeSlide=
    Math.max(
      0,
      activeSlide-1
    );

  saveState();

  renderThumbnails();

  loadActiveSlide();

}

function presentSlides(){

  saveSlide();

  const slides=
    currentFile.slides
      .map(
        slide=>`

          <section class="presentation-slide">

            ${
              slide.content||
              ""
            }

          </section>

        `
      )
      .join("");

  const win=
    window.open(
      "",
      "_blank"
    );

  if(!win)
    return;

  win.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <title>
        ${escapeHTML(currentFile.name)}
      </title>

      <link
        href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      >

      <style>

        *{
          box-sizing:border-box;
        }

        html,
        body{
          margin:0;
          width:100%;
          height:100%;
          overflow:hidden;
        }

        body{
          background:#000;

          font-family:Alegreya,serif;
        }

        .presentation-slide{
          width:100vw;
          height:100vh;

          display:none;

          padding:8vw;

          background:#fcfdfc;
          color:#152019;

          font-size:3vw;
        }

        .presentation-slide:first-child{
          display:block;
        }

      </style>

    </head>

    <body>

      ${slides}

      <script>

        let index=0;

        const slides=
          document.querySelectorAll(
            ".presentation-slide"
          );

        function show(){

          slides.forEach(
            slide=>{
              slide.style.display="none";
            }
          );

          if(slides[index]){
            slides[index].style.display="block";
          }

        }

        document.addEventListener(
          "keydown",
          event=>{

            if(event.key==="ArrowRight"){

              index=
                Math.min(
                  index+1,
                  slides.length-1
                );

              show();

            }

            if(event.key==="ArrowLeft"){

              index=
                Math.max(
                  index-1,
                  0
                );

              show();

            }

            if(event.key==="Escape"){
              window.close();
            }

          }
        );

      <\/script>

    </body>

    </html>

  `);

  win.document.close();

}

/* =========================================================
   SHEETS
========================================================= */

function columnName(number){

  let result="";

  while(number>=0){

    result=
      String.fromCharCode(
        number%26+65
      )+result;

    number=
      Math.floor(number/26)-1;
  }

  return result;

}

function columnIndex(value){

  let result=0;

  for(
    const character of value
  ){

    result=
      result*26+
      character.charCodeAt(0)-64;

  }

  return result-1;

}

function renderSpreadsheet(){

  workspace.innerHTML=`

    <div class="sheet">

      <div class="sheet-toolbar">

        <button
          class="tool primary"
          onclick="addSheetRow()"
        >
          + Row
        </button>

        <button
          class="tool"
          onclick="addSheetColumn()"
        >
          + Column
        </button>

        <div style="flex:1"></div>

        <button
          class="tool"
          onclick="insertFormula('SUM')"
        >
          SUM
        </button>

        <button
          class="tool"
          onclick="insertFormula('AVERAGE')"
        >
          AVG
        </button>

      </div>

      <div class="formula-bar">

        <div
          id="cellReference"
          class="cell-reference"
        >
          A1
        </div>

        <input
          id="formulaInput"
          class="formula-input"
          placeholder="Value or formula..."
        >

      </div>

      <div class="sheet-scroll">

        <table class="sheet-table">

          <thead>

            <tr>

              <th class="row-number"></th>

              ${
                Array.from(
                  {
                    length:columnCount
                  },
                  (_,index)=>
                    `<th>
                      ${columnName(index)}
                    </th>`
                ).join("")
              }

            </tr>

          </thead>

          <tbody id="sheetBody"></tbody>

        </table>

      </div>

    </div>

  `;

  buildSheet();

  formulaInput.addEventListener(
    "keydown",
    formulaKey
  );

}

function buildSheet(){

  sheetBody.innerHTML="";

  for(
    let row=1;
    row<=rowCount;
    row++
  ){

    let html=`

      <tr>

        <th class="row-number">
          ${row}
        </th>

    `;

    for(
      let column=0;
      column<columnCount;
      column++
    ){

      const ref=
        columnName(column)+row;

      const raw=
        currentFile.cells[ref]??"";

      const display=
        calculateValue(raw);

      html+=`

        <td
          contenteditable="true"
          data-cell="${ref}"
          class="${
            typeof raw==="string"
            &&raw.startsWith("=")
            ?"formula-result"
            :""
          }"
        >
          ${escapeHTML(String(display))}
        </td>

      `;

    }

    html+="</tr>";

    sheetBody.insertAdjacentHTML(
      "beforeend",
      html
    );

  }

  document
    .querySelectorAll("[data-cell]")
    .forEach(cell=>{

      cell.addEventListener(
        "focus",
        ()=>{
          selectCell(
            cell.dataset.cell
          );
        }
      );

      cell.addEventListener(
        "input",
        ()=>{

          currentFile.cells[
            cell.dataset.cell
          ]=
            cell.innerText;

          currentFile.updated=
            Date.now();

          saveState();

        }
      );

      cell.addEventListener(
        "keydown",
        event=>{

          if(event.key==="Enter"){

            event.preventDefault();

            saveCellAndMove(
              cell,
              1,
              0
            );

          }

          if(event.key==="Tab"){

            event.preventDefault();

            saveCellAndMove(
              cell,
              0,
              1
            );

          }

        }
      );

    });

}

function selectCell(ref){

  selectedCell=ref;

  cellReference.textContent=ref;

  formulaInput.value=
    currentFile.cells[ref]??"";

}

function saveCellAndMove(
  cell,
  rowMove,
  columnMove
){

  const current=
    cell.dataset.cell;

  const match=
    current.match(
      /^([A-Z]+)(\d+)$/
    );

  if(!match)
    return;

  let column=
    columnIndex(match[1]);

  let row=
    Number(match[2])-1;

  row+=rowMove;
  column+=columnMove;

  row=
    Math.max(
      0,
      Math.min(
        row,
        rowCount-1
      )
    );

  column=
    Math.max(
      0,
      Math.min(
        column,
        columnCount-1
      )
    );

  buildSheet();

  const next=
    document.querySelector(
      `[data-cell="${columnName(column)}${row+1}"]`
    );

  next?.focus();

}

function formulaKey(event){

  if(event.key!=="Enter")
    return;

  event.preventDefault();

  if(!selectedCell)
    return;

  currentFile.cells[
    selectedCell
  ]=
    formulaInput.value;

  saveState();

  buildSheet();

  const cell=
    document.querySelector(
      `[data-cell="${selectedCell}"]`
    );

  cell?.focus();

}

function numericCell(ref){

  const raw=
    currentFile.cells[ref];

  if(
    raw===undefined||
    raw===""
  )
    return 0;

  if(
    typeof raw==="string" &&
    raw.startsWith("=")
  ){

    const value=
      calculateValue(raw);

    return Number(value)||0;

  }

  return Number(raw)||0;

}

function calculateValue(raw){

  if(
    typeof raw!=="string"||
    !raw.startsWith("=")
  )
    return raw;

  return evaluateFormula(
    raw.substring(1)
  );

}

function evaluateFormula(expression){

  const functionMatch=
    expression.match(
      /^(SUM|AVERAGE|MIN|MAX|COUNT)\(([A-Z]+)(\d+):([A-Z]+)(\d+)\)$/i
    );

  if(functionMatch){

    const type=
      functionMatch[1].toUpperCase();

    const startColumn=
      columnIndex(
        functionMatch[2]
      );

    const endColumn=
      columnIndex(
        functionMatch[4]
      );

    const startRow=
      Number(functionMatch[3]);

    const endRow=
      Number(functionMatch[5]);

    const values=[];

    for(
      let row=startRow;
      row<=endRow;
      row++
    ){

      for(
        let column=startColumn;
        column<=endColumn;
        column++
      ){

        const ref=
          columnName(column)+row;

        values.push(
          numericCell(ref)
        );

      }

    }

    if(type==="SUM")
      return values.reduce(
        (a,b)=>a+b,
        0
      );

    if(type==="AVERAGE")
      return values.length
        ?values.reduce(
          (a,b)=>a+b,
          0
        )/values.length
        :0;

    if(type==="MIN")
      return values.length
        ?Math.min(...values)
        :0;

    if(type==="MAX")
      return values.length
        ?Math.max(...values)
        :0;

    if(type==="COUNT")
      return values.filter(
        value=>value!==0
      ).length;

  }

  let safe=
    expression.replace(
      /([A-Z]+)(\d+)/g,
      (_,column,row)=>
        numericCell(
          column+row
        )
    );

  if(
    !/^[0-9+\-*/().\s]+$/.test(safe)
  )
    return "";

  try{

    return Function(
      `"use strict";return (${safe})`
    )();

  }catch{

    return "";

  }

}

function insertFormula(type){

  if(!selectedCell){

    toast(
      "Select a cell first."
    );

    return;

  }

  currentFile.cells[
    selectedCell
  ]=
    `=${type}(A1:${columnName(columnCount-1)}${rowCount})`;

  saveState();

  buildSheet();

  toast("Formula added.");

}

function addSheetRow(){

  rowCount++;

  buildSheet();

}

function addSheetColumn(){

  columnCount++;

  buildSheet();

}

const commandsData=[

  [
    "New Document",
    ()=>createFile("doc")
  ],

  [
    "New Presentation",
    ()=>createFile("slide")
  ],

  [
    "New Spreadsheet",
    ()=>createFile("sheet")
  ],

  [
    "Home",
    goHome
  ],

  [
    "Docs",
    ()=>showFiles("doc")
  ],

  [
    "Slides",
    ()=>showFiles("slide")
  ],

  [
    "Sheets",
    ()=>showFiles("sheet")
  ]

];

function openCommands(){

  commandModal.classList.add("show");

  commandInput.value="";

  renderCommands();

  setTimeout(
    ()=>commandInput.focus(),
    20
  );

}

function renderCommands(filter=""){

  const visible=
    commandsData.filter(
      command=>
        command[0]
          .toLowerCase()
          .includes(
            filter.toLowerCase()
          )
    );

  commandList.innerHTML=
    visible
      .map(
        command=>`

          <div
            class="command-item"
            onclick="runCommand('${escapeAttribute(command[0])}')"
          >
            ${escapeHTML(command[0])}
          </div>

        `
      )
      .join("");

}

function filterCommands(){

  renderCommands(
    commandInput.value
  );

}

function runCommand(name){

  const command=
    commandsData.find(
      item=>item[0]===name
    );

  commandModal.classList.remove(
    "show"
  );

  command?.[1]();

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      (event.ctrlKey||event.metaKey)&&
      event.key.toLowerCase()==="k"
    ){

      event.preventDefault();

      openCommands();

    }

    if(
      (event.ctrlKey||event.metaKey)&&
      event.key.toLowerCase()==="s"
    ){

      event.preventDefault();

      saveState();

      toast("Saved.");

    }

    if(event.key==="Escape"){

      fileModal.classList.remove(
        "show"
      );

      commandModal.classList.remove(
        "show"
      );

    }

  }
);

/* =========================================================
   FULLSCREEN
========================================================= */

function fullscreen(){

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen?.();

  }else{

    document
      .exitFullscreen?.();

  }

}

/* =========================================================
   UTILITIES
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttribute(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}

/* =========================================================
   MODAL BEHAVIOR
========================================================= */

fileModal.addEventListener(
  "click",
  event=>{

    if(
      event.target===fileModal
    ){

      closeFileModal();

    }

  }
);

commandModal.addEventListener(
  "click",
  event=>{

    if(
      event.target===commandModal
    ){

      commandModal.classList.remove(
        "show"
      );

    }

  }
);

/* =========================================================
   START
========================================================= */

goHome();

</script>
