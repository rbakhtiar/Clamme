<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clamme.</title>

<meta
  name="description"
  content="Clamme — Docs, Slides and Sheets."
>

<meta name="theme-color" content="#08291d">

<link rel="manifest" href="/Clamme/manifest.json">

<style>
@import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;500;600&display=swap');

:root {
  --bg: #050806;
  --panel: #08130e;
  --panel2: #0a1912;
  --emerald: #0c4b34;
  --emerald-light: #176b49;

  --line: rgba(147,190,166,.14);
  --line-strong: rgba(147,190,166,.25);

  --text: #edf5ef;
  --muted: rgba(225,239,229,.55);

  --paper: #fafbf9;
  --paper-text: #141815;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: "Alegreya", serif;

  background:
    radial-gradient(
      circle at 18% -10%,
      rgba(17,91,61,.38),
      transparent 34%
    ),
    radial-gradient(
      circle at 90% 100%,
      rgba(8,57,39,.18),
      transparent 35%
    ),
    var(--bg);

  color: var(--text);

  overflow: hidden;
}

button,
input,
select,
textarea {
  font-family: "Alegreya", serif;
}

button {
  cursor: pointer;
}

/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  height: 100vh;

  display: flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
  width: 238px;

  flex-shrink: 0;

  padding: 27px 18px 20px;

  display: flex;
  flex-direction: column;

  background:
    linear-gradient(
      180deg,
      rgba(8,31,22,.98),
      rgba(4,12,8,.99)
    );

  border-right: 1px solid var(--line);
}

.logo {
  padding: 0 11px;

  margin-bottom: 29px;

  font-size: 31px;

  font-weight: 600;

  letter-spacing: -1.4px;
}

/* =========================================================
   NEW
========================================================= */

.new-button {
  width: 100%;

  border: 1px solid rgba(131,190,158,.28);

  background:
    linear-gradient(
      180deg,
      rgba(16,82,56,.88),
      rgba(8,54,37,.88)
    );

  border-radius: 7px;

  padding: 11px 15px;

  color: white;

  font-size: 16px;

  text-align: left;

  transition: .18s ease;
}

.new-button:hover {
  background:
    linear-gradient(
      180deg,
      rgba(22,101,69,.95),
      rgba(10,64,43,.95)
    );
}

/* =========================================================
   NAV
========================================================= */

.nav {
  display: flex;

  flex-direction: column;

  gap: 3px;

  margin-top: 24px;
}

.nav button {
  width: 100%;

  border: 0;

  background: transparent;

  color: rgba(225,239,229,.57);

  text-align: left;

  padding: 10px 12px;

  border-radius: 6px;

  font-size: 16px;

  transition: .16s ease;
}

.nav button:hover {
  background: rgba(57,127,93,.13);

  color: white;
}

.nav button.active {
  background: rgba(43,117,81,.21);

  color: white;
}

/* =========================================================
   MAIN
========================================================= */

.main {
  flex: 1;

  min-width: 0;

  height: 100%;

  display: flex;

  flex-direction: column;
}

.topbar {
  height: 66px;

  flex-shrink: 0;

  padding: 0 30px;

  display: flex;

  align-items: center;

  border-bottom: 1px solid var(--line);

  background: rgba(4,10,7,.72);

  backdrop-filter: blur(22px);
}

.page-title {
  font-size: 21px;

  font-weight: 500;
}

.workspace {
  flex: 1;

  min-height: 0;

  overflow: auto;

  padding: 38px;
}

/* =========================================================
   HOME
========================================================= */

.home {
  width: min(1100px,100%);

  margin: auto;
}

.home-header {
  padding: 22px 2px 35px;
}

.home-header h1 {
  margin: 0;

  font-size: clamp(46px,6vw,76px);

  line-height: .92;

  font-weight: 500;

  letter-spacing: -2.7px;
}

.home-rule {
  width: 100%;

  height: 1px;

  margin-top: 28px;

  background:
    linear-gradient(
      90deg,
      rgba(116,177,145,.36),
      rgba(116,177,145,.04)
    );
}

.create-grid {
  display: grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap: 14px;
}

.create-card {
  min-height: 148px;

  padding: 23px;

  text-align: left;

  border: 1px solid var(--line);

  border-radius: 7px;

  background:
    linear-gradient(
      145deg,
      rgba(11,38,27,.86),
      rgba(6,19,13,.82)
    );

  color: white;

  transition: .18s ease;
}

.create-card:hover {
  transform: translateY(-2px);

  border-color: var(--line-strong);

  background:
    linear-gradient(
      145deg,
      rgba(15,54,37,.94),
      rgba(7,23,16,.9)
    );
}

.create-card-title {
  display: block;

  font-size: 23px;

  font-weight: 600;

  margin-bottom: 9px;
}

.create-card-description {
  display: block;

  font-size: 15px;

  color: var(--muted);
}

/* =========================================================
   TOOLBAR
========================================================= */

.editor-shell,
.slides-shell,
.sheets-shell {
  width: min(1200px,100%);

  margin: auto;
}

.editor-toolbar,
.slides-toolbar {
  min-height: 49px;

  display: flex;

  align-items: center;

  gap: 5px;

  padding-bottom: 13px;

  margin-bottom: 22px;

  border-bottom: 1px solid var(--line);
}

.toolbar-group {
  display: flex;

  align-items: center;

  gap: 3px;
}

.toolbar-divider {
  width: 1px;

  height: 23px;

  margin: 0 7px;

  background: var(--line);
}

.tool {
  border: 0;

  background: transparent;

  color: rgba(231,243,235,.68);

  padding: 7px 10px;

  border-radius: 5px;

  font-size: 15px;

  transition: .15s ease;
}

.tool:hover {
  background: rgba(55,127,90,.15);

  color: white;
}

.tool.active {
  background: rgba(55,127,90,.22);

  color: white;
}

.toolbar-select {
  height: 34px;

  padding: 0 9px;

  border: 1px solid var(--line);

  border-radius: 5px;

  outline: none;

  background: #09170f;

  color: var(--soft);

  font-size: 14px;
}

/* =========================================================
   DOCS
========================================================= */

.docs-area {
  display: flex;

  justify-content: center;

  padding-bottom: 70px;
}

.document-page {
  width: min(820px,100%);

  min-height: 1000px;

  padding: 78px 82px;

  background: var(--paper);

  color: var(--paper-text);

  box-shadow:
    0 25px 70px rgba(0,0,0,.30);

  outline: none;

  font-size: 18px;

  line-height: 1.7;

  caret-color: #176b49;
}

.document-page:empty::before {
  content: "Start writing";

  color: #a3aaa5;
}

.document-page img {
  max-width: 100%;

  height: auto;

  display: block;

  margin: 20px auto;
}

.document-page h1 {
  font-size: 40px;

  line-height: 1.15;

  margin: 0 0 20px;
}

.document-page h2 {
  font-size: 30px;

  margin: 26px 0 12px;
}

.document-page h3 {
  font-size: 23px;

  margin: 22px 0 10px;
}

/* =========================================================
   SLIDES
========================================================= */

.slides-toolbar {
  justify-content: space-between;
}

.slides-actions {
  display: flex;

  align-items: center;

  gap: 3px;
}

.slide-count {
  color: var(--muted);

  font-size: 14px;
}

.slide-layout {
  display: grid;

  grid-template-columns: 155px minmax(0,1fr);

  gap: 24px;
}

/* THUMBNAILS */

.slide-sidebar {
  display: flex;

  flex-direction: column;

  gap: 11px;

  max-height: calc(100vh - 180px);

  overflow-y: auto;
}

.slide-thumbnail {
  position: relative;

  width: 100%;

  aspect-ratio: 16 / 9;

  padding: 10px;

  border: 1px solid rgba(135,178,151,.16);

  background: #f8faf8;

  color: #161b17;

  overflow: hidden;

  text-align: left;

  font-family: "Alegreya", serif;

  transition: .16s ease;
}

.slide-thumbnail:hover {
  border-color: rgba(135,194,157,.38);

  transform: translateY(-1px);
}

.slide-thumbnail.active {
  border: 2px solid #258257;
}

.slide-thumbnail img {
  max-width: 100%;
  max-height: 100%;
}

.slide-thumbnail-number {
  position: absolute;

  left: 7px;
  bottom: 5px;

  color: #657069;

  font-family: "Alegreya", serif;

  font-size: 10px;
}

/* SLIDE CANVAS */

.slide-stage {
  display: flex;

  justify-content: center;

  padding-bottom: 60px;
}

.slide-canvas {
  width: min(100%,980px);

  aspect-ratio: 16 / 9;

  padding: 68px;

  background: #fafbf9;

  color: #131713;

  outline: none;

  box-shadow:
    0 28px 75px rgba(0,0,0,.34);

  overflow: auto;

  font-size: 34px;

  line-height: 1.25;
}

.slide-canvas:empty::before {
  content: "Untitled presentation";

  color: #a3aaa5;
}

.slide-canvas img {
  max-width: 100%;

  max-height: 75%;

  object-fit: contain;

  display: block;

  margin: 20px auto;
}

.slide-canvas h1 {
  margin: 0 0 20px;

  font-size: 55px;
}

.slide-canvas h2 {
  margin: 0 0 17px;

  font-size: 38px;
}

/* =========================================================
   PRESENTATION MODE
========================================================= */

.presentation {
  position: fixed;

  inset: 0;

  z-index: 10000;

  display: none;

  align-items: center;

  justify-content: center;

  background: #020403;
}

.presentation.active {
  display: flex;
}

.presentation-slide {
  width: min(94vw, 1500px);

  aspect-ratio: 16 / 9;

  padding: 7%;

  background: #fafbf9;

  color: #131713;

  overflow: hidden;

  font-size: clamp(22px,3vw,48px);

  line-height: 1.25;

  box-shadow:
    0 35px 100px rgba(0,0,0,.55);
}

.presentation-slide img {
  max-width: 100%;

  max-height: 80%;

  object-fit: contain;

  display: block;

  margin: auto;
}

.presentation-controls {
  position: fixed;

  left: 50%;

  bottom: 25px;

  transform: translateX(-50%);

  display: flex;

  align-items: center;

  gap: 6px;

  padding: 7px;

  background: rgba(7,19,13,.9);

  border: 1px solid rgba(141,190,160,.22);

  border-radius: 7px;

  opacity: 0;

  transition: opacity .2s ease;
}

.presentation:hover .presentation-controls {
  opacity: 1;
}

.presentation-controls button {
  border: 0;

  background: transparent;

  color: white;

  padding: 8px 13px;

  border-radius: 5px;

  font-family: "Alegreya",serif;

  font-size: 15px;
}

.presentation-controls button:hover {
  background: rgba(65,136,98,.22);
}

.presentation-number {
  color: rgba(235,245,238,.62);

  padding: 0 8px;

  font-size: 14px;
}

/* =========================================================
   SHEETS
========================================================= */

.sheet-toolbar {
  display: flex;

  align-items: center;

  gap: 7px;

  margin-bottom: 16px;

  padding-bottom: 13px;

  border-bottom: 1px solid var(--line);
}

.cell-name {
  width: 70px;

  height: 36px;

  border: 1px solid var(--line);

  background: #09170f;

  color: var(--muted);

  text-align: center;

  outline: none;
}

.formula-input {
  flex: 1;

  height: 36px;

  border: 1px solid var(--line);

  background: #09170f;

  color: white;

  padding: 0 11px;

  outline: none;
}

.sheet-frame {
  border: 1px solid var(--line);

  overflow: auto;

  max-height: calc(100vh - 180px);

  background: #edf0ed;
}

.sheet-table {
  border-collapse: collapse;

  min-width: 1100px;

  width: 100%;

  table-layout: fixed;
}

.sheet-table th,
.sheet-table td {
  height: 35px;

  border-right: 1px solid #d7ddd8;

  border-bottom: 1px solid #d7ddd8;
}

.sheet-table th {
  width: 78px;

  background: #e6eae6;

  color: #566058;

  font-size: 13px;

  text-align: center;
}

.sheet-table td {
  min-width: 115px;

  padding: 6px 9px;

  background: #fbfcfb;

  color: #171b18;

  outline: none;

  font-size: 15px;
}

.sheet-table td:hover {
  background: #f2f5f2;
}

.sheet-table td.selected {
  box-shadow:
    inset 0 0 0 2px #18724c;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;

  left: 50%;

  bottom: 24px;

  transform:
    translate(-50%,15px);

  opacity: 0;

  pointer-events: none;

  padding: 10px 17px;

  background: #0b3020;

  border: 1px solid rgba(124,192,151,.28);

  color: #eef8f1;

  border-radius: 6px;

  transition: .2s ease;

  z-index: 20000;
}

.toast.show {
  opacity: 1;

  transform:
    translate(-50%,0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px) {

  .sidebar {
    width: 205px;
  }

  .workspace {
    padding: 25px;
  }

  .slide-layout {
    grid-template-columns: 1fr;
  }

  .slide-sidebar {
    flex-direction: row;

    max-height: none;

    overflow-x: auto;
  }

  .slide-thumbnail {
    flex: 0 0 135px;
  }

  .document-page {
    padding: 55px;
  }

}

@media(max-width:650px) {

  body {
    overflow: auto;
  }

  .sidebar {
    width: 68px;

    min-height: 100vh;

    padding: 18px 7px;
  }

  .logo {
    font-size: 20px;

    padding: 0;

    text-align: center;

    margin-bottom: 25px;
  }

  .new-button {
    font-size: 0;

    text-align: center;

    padding: 11px 4px;
  }

  .new-button::after {
    content: "+";

    font-size: 22px;
  }

  .nav button {
    font-size: 0;

    text-align: center;

    padding: 12px 4px;
  }

  .workspace {
    padding: 18px;
  }

  .create-grid {
    grid-template-columns: 1fr;
  }

  .document-page {
    min-height: 700px;

    padding: 38px 25px;
  }

  .slide-canvas {
    padding: 35px;

    font-size: 23px;
  }

  .slide-canvas h1 {
    font-size: 35px;
  }

  .editor-toolbar {
    overflow-x: auto;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      Clamme.
    </div>

    <button
      id="newButton"
      class="new-button"
      onclick="createCurrent()"
    >
      + New document
    </button>

    <nav class="nav">

      <button
        id="nav-home"
        onclick="goHome()"
      >
        Home
      </button>

      <button
        id="nav-docs"
        onclick="openSection('docs')"
      >
        Docs
      </button>

      <button
        id="nav-slides"
        onclick="openSection('slides')"
      >
        Slides
      </button>

      <button
        id="nav-sheets"
        onclick="openSection('sheets')"
      >
        Sheets
      </button>

    </nav>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div
        id="pageTitle"
        class="page-title"
      >
        Home
      </div>

    </header>


    <section
      id="workspace"
      class="workspace"
    ></section>

  </main>

</div>


<!-- PRESENTATION -->

<div
  id="presentation"
  class="presentation"
>

  <div
    id="presentationSlide"
    class="presentation-slide"
  ></div>


  <div class="presentation-controls">

    <button onclick="previousPresentationSlide()">
      Previous
    </button>

    <span
      id="presentationNumber"
      class="presentation-number"
    ></span>

    <button onclick="nextPresentationSlide()">
      Next
    </button>

    <button onclick="exitPresentation()">
      Exit
    </button>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

/* =========================================================
   CORE
========================================================= */

const BASE = "/Clamme/";

let currentSection = "home";

let currentSlide = 0;

let slides = [""];


/* =========================================================
   SERVICE WORKER
========================================================= */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          BASE + "sw.js",
          {
            scope: BASE
          }
        )
        .catch(
          error => console.error(
            "Clamme service worker:",
            error
          )
        );

    }
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function setActive(section) {

  document
    .querySelectorAll(".nav button")
    .forEach(
      button =>
        button.classList.remove("active")
    );

  const button =
    document.getElementById(
      "nav-" + section
    );

  if (button) {

    button.classList.add("active");

  }

}


function updateNewButton() {

  const button =
    document.getElementById(
      "newButton"
    );

  if (currentSection === "slides") {

    button.textContent =
      "+ New presentation";

  }

  else if (currentSection === "sheets") {

    button.textContent =
      "+ New spreadsheet";

  }

  else {

    button.textContent =
      "+ New document";

  }

}


function goHome() {

  currentSection = "home";

  setActive("home");

  updateNewButton();

  document.getElementById(
    "pageTitle"
  ).textContent = "Home";

  renderHome();

}


function openSection(section) {

  currentSection = section;

  setActive(section);

  updateNewButton();

  if (section === "docs") {

    document.getElementById(
      "pageTitle"
    ).textContent = "Docs";

    renderDocs();

  }

  else if (section === "slides") {

    document.getElementById(
      "pageTitle"
    ).textContent = "Slides";

    renderSlides();

  }

  else if (section === "sheets") {

    document.getElementById(
      "pageTitle"
    ).textContent = "Sheets";

    renderSheets();

  }

}


/* =========================================================
   HOME
========================================================= */

function renderHome() {

  document.getElementById(
    "workspace"
  ).innerHTML = `

    <div class="home">

      <div class="home-header">

        <h1>Clamme.</h1>

        <div class="home-rule"></div>

      </div>


      <div class="create-grid">

        <button
          class="create-card"
          onclick="newDocument()"
        >

          <span class="create-card-title">
            Document
          </span>

          <span class="create-card-description">
            Write and refine.
          </span>

        </button>


        <button
          class="create-card"
          onclick="newPresentation()"
        >

          <span class="create-card-title">
            Presentation
          </span>

          <span class="create-card-description">
            Design and present.
          </span>

        </button>


        <button
          class="create-card"
          onclick="newSpreadsheet()"
        >

          <span class="create-card-title">
            Spreadsheet
          </span>

          <span class="create-card-description">
            Organize and calculate.
          </span>

        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   FONT OPTIONS
========================================================= */

const fontOptions = `

  <option value="Alegreya">
    Alegreya
  </option>

  <option value="Georgia">
    Georgia
  </option>

  <option value="Playfair Display">
    Playfair Display
  </option>

  <option value="Libre Baskerville">
    Libre Baskerville
  </option>

  <option value="Merriweather">
    Merriweather
  </option>

  <option value="Inter">
    Inter
  </option>

  <option value="Roboto">
    Roboto
  </option>

  <option value="Source Sans 3">
    Source Sans
  </option>

`;


const sizeOptions = `

  <option value="1">
    12
  </option>

  <option value="2">
    14
  </option>

  <option value="3">
    16
  </option>

  <option value="4">
    18
  </option>

  <option value="5">
    22
  </option>

  <option value="6">
    28
  </option>

  <option value="7">
    36
  </option>

`;


/* =========================================================
   DOCS
========================================================= */

function renderDocs() {

  const saved =
    localStorage.getItem(
      "clamme-document"
    ) || "";


  document.getElementById(
    "workspace"
  ).innerHTML = `

    <div class="editor-shell">

      <div class="editor-toolbar">

        <select
          id="docFont"
          class="toolbar-select"
          onchange="changeDocFont(this.value)"
        >

          ${fontOptions}

        </select>


        <select
          class="toolbar-select"
          onchange="changeDocSize(this.value)"
        >

          ${sizeOptions}

        </select>


        <div class="toolbar-divider"></div>


        <div class="toolbar-group">

          <button
            class="tool"
            onclick="docCommand('bold')"
          >
            Bold
          </button>

          <button
            class="tool"
            onclick="docCommand('italic')"
          >
            Italic
          </button>

          <button
            class="tool"
            onclick="docCommand('underline')"
          >
            Underline
          </button>

        </div>


        <div class="toolbar-divider"></div>


        <button
          class="tool"
          onclick="insertDocumentImage()"
        >
          Image
        </button>


        <button
          class="tool"
          onclick="docCommand('justifyLeft')"
        >
          Left
        </button>


        <button
          class="tool"
          onclick="docCommand('justifyCenter')"
        >
          Center
        </button>


        <button
          class="tool"
          onclick="docCommand('justifyRight')"
        >
          Right
        </button>


        <div class="toolbar-divider"></div>


        <button
          class="tool"
          onclick="printDocument()"
        >
          Print
        </button>

      </div>


      <div class="docs-area">

        <article
          id="documentPage"
          class="document-page"
          contenteditable="true"
          spellcheck="true"
        >${saved}</article>

      </div>

    </div>

    <input
      id="documentImageInput"
      type="file"
      accept="image/*"
      hidden
    >

  `;


  const page =
    document.getElementById(
      "documentPage"
    );


  page.addEventListener(
    "input",
    saveDocument
  );

}


function docCommand(
  command,
  value = null
) {

  document.execCommand(
    command,
    false,
    value
  );

  saveDocument();

}


function changeDocFont(font) {

  document.execCommand(
    "fontName",
    false,
    font
  );

  saveDocument();

}


function changeDocSize(size) {

  document.execCommand(
    "fontSize",
    false,
    size
  );

  saveDocument();

}


function insertDocumentImage() {

  const input =
    document.getElementById(
      "documentImageInput"
    );

  if (!input) return;

  input.click();


  input.onchange = event => {

    const file =
      event.target.files[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload = event => {

      const page =
        document.getElementById(
          "documentPage"
        );

      page.focus();

      document.execCommand(
        "insertImage",
        false,
        event.target.result
      );

      saveDocument();

    };

    reader.readAsDataURL(file);

  };

}


function saveDocument() {

  const page =
    document.getElementById(
      "documentPage"
    );

  if (!page) return;

  localStorage.setItem(
    "clamme-document",
    page.innerHTML
  );

}


function printDocument() {

  const page =
    document.getElementById(
      "documentPage"
    );

  if (!page) return;

  const printWindow =
    window.open(
      "",
      "_blank"
    );

  printWindow.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <title>Clamme Document</title>

      <style>

        body {
          font-family: Georgia, serif;
          padding: 60px;
          line-height: 1.7;
        }

        img {
          max-width: 100%;
        }

      </style>

    </head>

    <body>

      ${page.innerHTML}

    </body>

    </html>

  `);

  printWindow.document.close();

  printWindow.focus();

  printWindow.print();

}


/* =========================================================
   SLIDES
========================================================= */

function loadSlides() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          "clamme-slides"
        )
      );

    if (
      Array.isArray(saved) &&
      saved.length > 0
    ) {

      slides = saved;

    }

    else {

      slides = [""];

    }

  }

  catch {

    slides = [""];

  }

}


function saveSlides() {

  localStorage.setItem(
    "clamme-slides",
    JSON.stringify(slides)
  );

}


function renderSlides() {

  loadSlides();

  currentSlide =
    Math.min(
      currentSlide,
      slides.length - 1
    );


  document.getElementById(
    "workspace"
  ).innerHTML = `

    <div class="slides-shell">

      <div class="slides-toolbar">

        <div class="slides-actions">

          <select
            id="slideFont"
            class="toolbar-select"
            onchange="changeSlideFont(this.value)"
          >

            ${fontOptions}

          </select>


          <select
            class="toolbar-select"
            onchange="changeSlideSize(this.value)"
          >

            ${sizeOptions}

          </select>


          <div class="toolbar-divider"></div>


          <button
            class="tool"
            onclick="slideCommand('bold')"
          >
            Bold
          </button>


          <button
            class="tool"
            onclick="slideCommand('italic')"
          >
            Italic
          </button>


          <button
            class="tool"
            onclick="slideCommand('underline')"
          >
            Underline
          </button>


          <button
            class="tool"
            onclick="insertSlideImage()"
          >
            Image
          </button>


          <div class="toolbar-divider"></div>


          <button
            class="tool"
            onclick="addSlide()"
          >
            New slide
          </button>


          <button
            class="tool"
            onclick="duplicateSlide()"
          >
            Duplicate
          </button>


          <button
            class="tool"
            onclick="deleteSlide()"
          >
            Delete
          </button>


          <button
            class="tool"
            onclick="startPresentation()"
          >
            Present
          </button>

        </div>


        <div
          id="slideCount"
          class="slide-count"
        ></div>

      </div>


      <div class="slide-layout">

        <aside
          id="slideSidebar"
          class="slide-sidebar"
        ></aside>


        <div class="slide-stage">

          <article
            id="slideCanvas"
            class="slide-canvas"
            contenteditable="true"
            spellcheck="true"
          ></article>

        </div>

      </div>

    </div>


    <input
      id="slideImageInput"
      type="file"
      accept="image/*"
      hidden
    >

  `;


  renderSlideThumbnails();

  renderCurrentSlide();


  document
    .getElementById(
      "slideCanvas"
    )
    .addEventListener(
      "input",
      saveCurrentSlide
    );

}


/* =========================================================
   SLIDE EDITING
========================================================= */

function saveCurrentSlide() {

  const canvas =
    document.getElementById(
      "slideCanvas"
    );

  if (!canvas) return;

  slides[currentSlide] =
    canvas.innerHTML;

  saveSlides();

  renderSlideThumbnails();

}


function slideCommand(
  command,
  value = null
) {

  document.execCommand(
    command,
    false,
    value
  );

  saveCurrentSlide();

}


function changeSlideFont(font) {

  document.execCommand(
    "fontName",
    false,
    font
  );

  saveCurrentSlide();

}


function changeSlideSize(size) {

  document.execCommand(
    "fontSize",
    false,
    size
  );

  saveCurrentSlide();

}


function insertSlideImage() {

  const input =
    document.getElementById(
      "slideImageInput"
    );

  if (!input) return;

  input.click();


  input.onchange = event => {

    const file =
      event.target.files[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload = event => {

      const canvas =
        document.getElementById(
          "slideCanvas"
        );

      canvas.focus();

      document.execCommand(
        "insertImage",
        false,
        event.target.result
      );

      saveCurrentSlide();

    };

    reader.readAsDataURL(file);

  };

}


/* =========================================================
   SLIDE THUMBNAILS
========================================================= */

function renderSlideThumbnails() {

  const sidebar =
    document.getElementById(
      "slideSidebar"
    );

  if (!sidebar) return;

  sidebar.innerHTML = "";


  slides.forEach(
    (content,index) => {

      const thumbnail =
        document.createElement(
          "button"
        );

      thumbnail.className =
        "slide-thumbnail" +
        (
          index === currentSlide
            ? " active"
            : ""
        );


      thumbnail.innerHTML = `

        <div>
          ${content || ""}
        </div>

        <span class="slide-thumbnail-number">
          ${index + 1}
        </span>

      `;


      thumbnail.onclick = () => {

        currentSlide = index;

        renderSlides();

      };


      sidebar.appendChild(
        thumbnail
      );

    }
  );


  const count =
    document.getElementById(
      "slideCount"
    );

  if (count) {

    count.textContent =
      `${currentSlide + 1} / ${slides.length}`;

  }

}


/* =========================================================
   CURRENT SLIDE
========================================================= */

function renderCurrentSlide() {

  const canvas =
    document.getElementById(
      "slideCanvas"
    );

  if (!canvas) return;

  canvas.innerHTML =
    slides[currentSlide] || "";

}


/* =========================================================
   SLIDE ACTIONS
========================================================= */

function addSlide() {

  slides.splice(
    currentSlide + 1,
    0,
    ""
  );

  currentSlide++;

  saveSlides();

  renderSlides();

}


function duplicateSlide() {

  slides.splice(
    currentSlide + 1,
    0,
    slides[currentSlide]
  );

  currentSlide++;

  saveSlides();

  renderSlides();

}


function deleteSlide() {

  if (slides.length === 1) {

    slides[0] = "";

    currentSlide = 0;

  }

  else {

    slides.splice(
      currentSlide,
      1
    );

    currentSlide =
      Math.max(
        0,
        currentSlide - 1
      );

  }

  saveSlides();

  renderSlides();

}


/* =========================================================
   REAL PRESENTATION MODE
========================================================= */

let presentationIndex = 0;


function startPresentation() {

  saveCurrentSlide();

  presentationIndex = 0;

  renderPresentation();

  const presentation =
    document.getElementById(
      "presentation"
    );

  presentation.classList.add(
    "active"
  );


  if (
    presentation.requestFullscreen
  ) {

    presentation
      .requestFullscreen()
      .catch(() => {});

  }

}


function renderPresentation() {

  const output =
    document.getElementById(
      "presentationSlide"
    );

  const number =
    document.getElementById(
      "presentationNumber"
    );

  if (!output) return;

  output.innerHTML =
    slides[presentationIndex] || "";


  if (number) {

    number.textContent =
      `${presentationIndex + 1} / ${slides.length}`;

  }

}


function nextPresentationSlide() {

  if (
    presentationIndex <
    slides.length - 1
  ) {

    presentationIndex++;

    renderPresentation();

  }

}


function previousPresentationSlide() {

  if (
    presentationIndex > 0
  ) {

    presentationIndex--;

    renderPresentation();

  }

}


function exitPresentation() {

  const presentation =
    document.getElementById(
      "presentation"
    );

  presentation.classList.remove(
    "active"
  );


  if (
    document.fullscreenElement
  ) {

    document.exitFullscreen()
      .catch(() => {});

  }

}


document.addEventListener(
  "keydown",
  event => {

    const presentation =
      document.getElementById(
        "presentation"
      );

    if (
      !presentation.classList.contains(
        "active"
      )
    ) {

      return;

    }


    if (
      event.key === "ArrowRight" ||
      event.key === " " ||
      event.key === "Enter"
    ) {

      event.preventDefault();

      nextPresentationSlide();

    }


    if (
      event.key === "ArrowLeft"
    ) {

      event.preventDefault();

      previousPresentationSlide();

    }


    if (
      event.key === "Escape"
    ) {

      exitPresentation();

    }

  }
);


document.addEventListener(
  "dblclick",
  event => {

    const presentation =
      document.getElementById(
        "presentation"
      );

    if (
      presentation.classList.contains(
        "active"
      ) &&
      event.target ===
      presentation
    ) {

      nextPresentationSlide();

    }

  }
);


/* =========================================================
   SHEETS
========================================================= */

const SHEET_ROWS = 30;

const SHEET_COLUMNS = 12;


function columnName(index) {

  let result = "";

  let number = index + 1;

  while (number > 0) {

    const remainder =
      (number - 1) % 26;

    result =
      String.fromCharCode(
        65 + remainder
      ) + result;

    number =
      Math.floor(
        (number - 1) / 26
      );

  }

  return result;

}


function sheetKey(
  row,
  column
) {

  return `clamme-sheet-${row}-${column}`;

}


function renderSheets() {

  let html = `

    <div class="sheets-shell">

      <div class="sheet-toolbar">

        <select
          id="sheetFont"
          class="toolbar-select"
        >

          ${fontOptions}

        </select>


        <select
          id="sheetSize"
          class="toolbar-select"
        >

          ${sizeOptions}

        </select>


        <button
          class="tool"
          onclick="sheetCommand('bold')"
        >
          Bold
        </button>


        <button
          class="tool"
          onclick="sheetCommand('italic')"
        >
          Italic
        </button>


        <button
          class="tool"
          onclick="sheetAlign('left')"
        >
          Left
        </button>


        <button
          class="tool"
          onclick="sheetAlign('center')"
        >
          Center
        </button>


        <div class="toolbar-divider"></div>


        <input
          id="cellName"
          class="cell-name"
          readonly
          placeholder="A1"
        >


        <input
          id="formulaInput"
          class="formula-input"
          placeholder="Formula or value"
        >

      </div>


      <div class="sheet-frame">

        <table class="sheet-table">

          <thead>

            <tr>

              <th></th>

  `;


  for (
    let column = 0;
    column < SHEET_COLUMNS;
    column++
  ) {

    html += `
      <th>${columnName(column)}</th>
    `;

  }


  html += `

            </tr>

          </thead>

          <tbody>

  `;


  for (
    let row = 0;
    row < SHEET_ROWS;
    row++
  ) {

    html += `

      <tr>

        <th>${row + 1}</th>

    `;


    for (
      let column = 0;
      column < SHEET_COLUMNS;
      column++
    ) {

      const key =
        sheetKey(
          row,
          column
        );

      const value =
        localStorage.getItem(
          key
        ) || "";


      html += `

        <td
          contenteditable="true"
          data-row="${row}"
          data-column="${column}"
          data-key="${key}"
        >
          ${escapeHTML(value)}
        </td>

      `;

    }


    html += `

      </tr>

    `;

  }


  html += `

          </tbody>

        </table>

      </div>

    </div>

  `;


  document.getElementById(
    "workspace"
  ).innerHTML = html;


  const font =
    document.getElementById(
      "sheetFont"
    );

  const size =
    document.getElementById(
      "sheetSize"
    );


  font.onchange = () => {

    const cell =
      document.querySelector(
        ".sheet-table td.selected"
      );

    if (!cell) return;

    cell.style.fontFamily =
      font.value;

  };


  size.onchange = () => {

    const cell =
      document.querySelector(
        ".sheet-table td.selected"
      );

    if (!cell) return;

    const sizes = {
      1: "12px",
      2: "14px",
      3: "16px",
      4: "18px",
      5: "22px",
      6: "28px",
      7: "36px"
    };

    cell.style.fontSize =
      sizes[size.value];

  };


  document
    .querySelectorAll(
      ".sheet-table td"
    )
    .forEach(cell => {

      cell.addEventListener(
        "focus",
        () => {

          document
            .querySelectorAll(
              ".sheet-table td"
            )
            .forEach(
              c =>
                c.classList.remove(
                  "selected"
                )
            );


          cell.classList.add(
            "selected"
          );


          const row =
            Number(
              cell.dataset.row
            );

          const column =
            Number(
              cell.dataset.column
            );


          document.getElementById(
            "cellName"
          ).value =
            `${columnName(column)}${row + 1}`;


          document.getElementById(
            "formulaInput"
          ).value =
            cell.textContent.trim();

        }
      );


      cell.addEventListener(
        "input",
        () => {

          localStorage.setItem(
            cell.dataset.key,
            cell.textContent
          );

        }
      );


      cell.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            const row =
              Number(
                cell.dataset.row
              );

            const column =
              Number(
                cell.dataset.column
              );


            const next =
              document.querySelector(
                `td[data-row="${row + 1}"][data-column="${column}"]`
              );


            if (next) {

              next.focus();

            }

          }

        }
      );

    });


  document.getElementById(
    "formulaInput"
  ).addEventListener(
    "input",
    event => {

      const cell =
        document.querySelector(
          ".sheet-table td.selected"
        );

      if (!cell) return;

      cell.textContent =
        event.target.value;

      localStorage.setItem(
        cell.dataset.key,
        cell.textContent
      );

    }
  );

}


function sheetCommand(command) {

  const cell =
    document.querySelector(
      ".sheet-table td.selected"
    );

  if (!cell) return;

  if (command === "bold") {

    cell.style.fontWeight =
      cell.style.fontWeight === "700"
        ? "400"
        : "700";

  }

  if (command === "italic") {

    cell.style.fontStyle =
      cell.style.fontStyle === "italic"
        ? "normal"
        : "italic";

  }

}


function sheetAlign(direction) {

  const cell =
    document.querySelector(
      ".sheet-table td.selected"
    );

  if (!cell) return;

  cell.style.textAlign =
    direction;

}


function escapeHTML(value) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   NEW
========================================================= */

function createCurrent() {

  if (
    currentSection === "slides"
  ) {

    newPresentation();

    return;

  }


  if (
    currentSection === "sheets"
  ) {

    newSpreadsheet();

    return;

  }


  newDocument();

}


function newDocument() {

  currentSection = "docs";

  localStorage.removeItem(
    "clamme-document"
  );

  setActive("docs");

  updateNewButton();

  document.getElementById(
    "pageTitle"
  ).textContent = "Docs";

  renderDocs();

}


function newPresentation() {

  currentSection = "slides";

  slides = [""];

  currentSlide = 0;

  saveSlides();

  setActive("slides");

  updateNewButton();

  document.getElementById(
    "pageTitle"
  ).textContent = "Slides";

  renderSlides();

}


function newSpreadsheet() {

  currentSection = "sheets";

  setActive("sheets");

  updateNewButton();

  document.getElementById(
    "pageTitle"
  ).textContent = "Sheets";

  renderSheets();

}


/* =========================================================
   TOAST
========================================================= */

function toast(message) {

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

  clearTimeout(
    window.clammeToast
  );

  window.clammeToast =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      2400
    );

}

   START
========================================================= */

goHome();
