<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clamme</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#050b08;
  --panel:#08150f;
  --panel2:#0b1c14;
  --emerald:#08784f;
  --emerald2:#12a36c;
  --line:rgba(47,190,133,.27);
  --line2:rgba(255,255,255,.08);
  --text:#f4f7f5;
  --muted:#91a29a;
  --page:#fff;
  --ink:#111;
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  background:
    radial-gradient(circle at 5% 0%,rgba(15,133,88,.16),transparent 32%),
    radial-gradient(circle at 95% 100%,rgba(7,92,61,.13),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:"Alegreya",serif;
}

button,input,select{
  font-family:"Alegreya",serif;
}

button{cursor:pointer}

/* APP */

.app{
  width:100%;
  height:100%;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:225px;
  flex-shrink:0;
  padding:24px 16px;
  border-right:1px solid var(--line);
  background:rgba(3,12,8,.94);
}

.brand{
  margin:0 9px 30px;
  font-size:31px;
  font-weight:600;
  letter-spacing:-1.5px;
}

.brand span{
  color:#36c58c;
}

.new{
  width:100%;
  height:42px;
  border:1px solid rgba(53,197,140,.45);
  border-radius:7px;
  background:#0b3223;
  color:white;
  font-size:17px;
}

.new:hover{
  background:#0e432e;
  border-color:#36c58c;
}

.nav{
  margin-top:25px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.nav button{
  width:100%;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:#91a29a;
  text-align:left;
  font-size:17px;
}

.nav button:hover,
.nav button.active{
  background:rgba(19,120,82,.25);
  color:white;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  flex-shrink:0;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(5,17,11,.78);
  backdrop-filter:blur(18px);
}

.title{
  font-size:22px;
  font-weight:600;
}

.command-button{
  border:1px solid transparent;
  border-radius:5px;
  padding:7px 11px;
  background:transparent;
  color:#9eafa7;
}

.command-button:hover{
  border-color:var(--line);
  color:white;
}

.workspace{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:34px;
}

/* HOME */

.home{
  max-width:1050px;
  margin:auto;
}

.home h1{
  margin:0 0 7px;
  font-size:43px;
  font-weight:500;
  letter-spacing:-1px;
}

.subtitle{
  color:var(--muted);
  font-size:17px;
  margin-bottom:35px;
}

.create{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.create-card{
  min-height:125px;
  padding:23px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(9,33,23,.62);
  transition:.18s;
}

.create-card:hover{
  transform:translateY(-2px);
  background:#0c2b1e;
  border-color:rgba(53,197,140,.65);
}

.create-card h3{
  margin:0 0 7px;
  font-size:21px;
}

.create-card p{
  margin:0;
  color:var(--muted);
}

/* FILE LIST */

.file-list{
  max-width:1050px;
  margin:auto;
}

.file-row{
  min-height:67px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid var(--line2);
  gap:15px;
}

.file-name{
  font-size:18px;
}

.file-type{
  color:var(--muted);
  font-size:14px;
}

.file-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.small{
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:5px;
  background:transparent;
  color:#bac8c2;
}

.small:hover{
  color:white;
  border-color:#36c58c;
}

/* TOOLBAR */

.editor-shell{
  max-width:1250px;
  min-height:calc(100vh - 130px);
  margin:auto;
}

.toolbar{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  padding:9px;
  margin-bottom:18px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#081810;
}

.toolbar button{
  height:32px;
  min-width:34px;
  padding:0 9px;
  border:1px solid transparent;
  border-radius:5px;
  background:transparent;
  color:#bac7c1;
}

.toolbar button:hover{
  border-color:var(--line);
  background:#0d291d;
  color:white;
}

/* FONT PICKER */

.font-picker{
  position:relative;
}

.font-search{
  width:195px;
  height:32px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:5px;
  outline:none;
  background:#091a12;
  color:white;
  font-size:15px;
}

.font-search::placeholder{
  color:#71847b;
}

.font-menu{
  position:absolute;
  z-index:300;
  top:38px;
  left:0;
  width:300px;
  max-height:420px;
  overflow:auto;
  padding:5px;
  display:none;
  border:1px solid var(--line);
  border-radius:7px;
  background:#091a12;
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.font-menu.open{
  display:block;
}

.font-option{
  width:100%;
  display:block;
  padding:9px 10px;
  border:0;
  border-radius:4px;
  background:transparent;
  color:#e2e8e5;
  text-align:left;
  font-size:17px;
}

.font-option:hover{
  background:#123a29;
  color:white;
}

/* SIZE */

.size{
  height:32px;
  width:78px;
  padding:0 7px;
  border:1px solid var(--line);
  border-radius:5px;
  outline:none;
  background:#091a12;
  color:#d8e1dc;
}

/* COLOR */

.color{
  height:32px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:3px 7px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#091a12;
  color:#aebdb5;
  font-size:14px;
}

.color input{
  width:24px;
  height:24px;
  padding:0;
  border:0;
  background:none;
}

/* DOC */

.doc-page{
  width:min(850px,100%);
  min-height:1050px;
  margin:auto;
  padding:80px 85px;
  outline:none;
  background:white;
  color:#111;
  font-family:"Alegreya",serif;
  font-size:18px;
  line-height:1.65;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.doc-page:focus{
  box-shadow:
    0 30px 80px rgba(0,0,0,.45),
    0 0 0 1px rgba(24,165,111,.45);
}

.doc-page img{
  max-width:100%;
  height:auto;
  display:block;
  margin:20px auto;
}

/* SLIDES */

.slides{
  min-height:calc(100vh - 130px);
  display:grid;
  grid-template-columns:185px 1fr;
  gap:20px;
}

.thumbs{
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#081710;
  overflow:auto;
}

.thumb{
  width:100%;
  aspect-ratio:16/9;
  margin-bottom:10px;
  padding:4px;
  overflow:hidden;
  border:2px solid transparent;
  background:white;
  color:#111;
}

.thumb.active{
  border-color:#36c58c;
}

.thumb-inner{
  width:100%;
  height:100%;
  overflow:hidden;
  font-size:8px;
}

.slide-center{
  min-width:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.slide-editor{
  width:min(100%,1050px);
  aspect-ratio:16/9;
  padding:70px;
  overflow:hidden;
  outline:none;
  background:white;
  color:#111;
  font-family:"Alegreya",serif;
  font-size:25px;
  line-height:1.4;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.slide-editor:focus{
  box-shadow:
    0 30px 80px rgba(0,0,0,.45),
    0 0 0 1px rgba(24,165,111,.45);
}

.slide-editor img{
  display:block;
  max-width:100%;
  max-height:60%;
  margin:15px auto;
}

/* SHEETS */

.sheet-shell{
  max-width:1250px;
  margin:auto;
}

.formula{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.cell-name{
  width:70px;
  padding:8px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#081710;
  color:#aebdb5;
  text-align:center;
}

.formula-input{
  flex:1;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:5px;
  outline:none;
  background:#081710;
  color:white;
}

.sheet-wrap{
  overflow:auto;
  border:1px solid var(--line);
}

table{
  min-width:1100px;
  border-collapse:collapse;
  background:#07110d;
}

th,td{
  min-width:105px;
  height:35px;
  padding:6px 8px;
  border-right:1px solid rgba(80,125,105,.18);
  border-bottom:1px solid rgba(80,125,105,.18);
}

th{
  background:#0b2017;
  color:#91a59b;
  font-weight:500;
  text-align:center;
}

td{
  outline:none;
  color:#dce5e0;
  background:#07120e;
}

td:focus{
  background:#0a1d15;
  box-shadow:inset 0 0 0 1px #36c58c;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:800;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(7px);
}

.modal{
  width:min(430px,90%);
  padding:25px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0a1c14;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.modal h2{
  margin:0 0 16px;
}

.modal input{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:6px;
  outline:none;
  background:#07120e;
  color:white;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* PRESENTATION */

.presentation{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  background:#000;
}

.presentation-slide{
  width:100%;
  height:100%;
  padding:7vw;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
  background:white;
  color:#111;
  font-family:"Alegreya",serif;
}

.presentation-controls{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:7px;
  background:rgba(15,15,15,.85);
}

.presentation-controls button{
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:5px;
  background:transparent;
  color:white;
}

.counter{
  padding:8px 10px;
  color:#aaa;
}

/* COMMAND */

.command-bg{
  position:fixed;
  inset:0;
  z-index:900;
  display:none;
  justify-content:center;
  align-items:flex-start;
  padding-top:100px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(7px);
}

.command{
  width:min(600px,90%);
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:8px;
  background:#091a12;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.command input{
  width:100%;
  padding:15px;
  border:0;
  border-bottom:1px solid var(--line);
  outline:none;
  background:transparent;
  color:white;
  font-size:17px;
}

.command-list button{
  width:100%;
  padding:12px 15px;
  border:0;
  background:transparent;
  color:#c5d0ca;
  text-align:left;
  font-size:16px;
}

.command-list button:hover{
  background:#123426;
  color:white;
}

/* TOAST */

.toast{
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:2000;
  padding:10px 15px;
  border:1px solid #287b58;
  border-radius:6px;
  background:#102b20;
  color:white;
  opacity:0;
  transform:translateY(8px);
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    width:70px;
    padding:18px 8px;
  }

  .brand{
    margin:0 0 25px;
    font-size:20px;
    text-align:center;
  }

  .new{
    font-size:0;
  }

  .new::after{
    content:"+";
    font-size:22px;
  }

  .nav button{
    padding:11px 4px;
    text-align:center;
    font-size:0;
  }

  .workspace{
    padding:18px;
  }

  .create{
    grid-template-columns:1fr;
  }

  .doc-page{
    padding:40px 25px;
  }

  .slides{
    grid-template-columns:100px 1fr;
    gap:10px;
  }

  .slide-editor{
    padding:30px;
    font-size:18px;
  }

}
</style>
</head>

let files=

/* =========================================================
   WEB FONT LOADER
========================================================= */

const loadedFonts=new Set();

async function loadFont(font){

  if(loadedFonts.has(font))
    return;

  const safe=
    font
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,"-");

  const existing=
    document.getElementById(
      "font-"+safe
    );

  if(existing){

    loadedFonts.add(font);

    return;

  }

  const link=
    document.createElement("link");

  link.id="font-"+safe;

  link.rel="stylesheet";

  link.href=
    "https://fonts.googleapis.com/css2?family="+
    encodeURIComponent(font).replace(/%20/g,"+")+
    ":ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700"+
    "&display=swap";

  document.head.appendChild(link);

  try{

    await document.fonts.load(
      `16px "${font}"`
    );

  }catch{}

  loadedFonts.add(font);

}


/* =========================================================
   BASIC HELPERS
========================================================= */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(files)
  );

}

function id(){

  return Date.now().toString(36)+
    Math.random()
      .toString(36)
      .slice(2);

}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function getFile(fileId){

  return files.find(
    f=>f.id===fileId
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function activeNav(section){

  document
    .querySelectorAll(".nav button")
    .forEach(button=>{
      button.classList.remove("active");
    });

  if(section==="home")
    homeNav.classList.add("active");

  if(section==="docs")
    docsNav.classList.add("active");

  if(section==="slides")
    slidesNav.classList.add("active");

  if(section==="sheets")
    sheetsNav.classList.add("active");

}

function updateNewButton(){

  if(currentSection==="slides"){

  }else if(currentSection==="sheets"){

    newButton.textContent=
      "+ New spreadsheet";

  }else{

      "+ New document";

  }

}

function goHome(){

  currentSection="home";
  currentFileId=null;

  title.textContent="Home";

}

/* =========================================================
   CREATE
========================================================= */

function newCurrent(){

  if(currentSection==="slides")
    newPresentation();
  else if(currentSection==="sheets")
    newSpreadsheet();
  else
    newDocument();

}

function createFile(type,name){

  const file={
    id:id(),
    name:name,
    type:type,
    content:
      type==="docs"
        ?""
        :type==="slides"
          ?[{content:""}]
          :Array.from(
              {length:20},
              ()=>Array(10).fill("")
            ),
    updated:Date.now()
  };

  files.push(file);

  save();

  openFile(file.id);

}

function newDocument(){

  openModal(
    "New document",
    "Document name",
    name=>{
      createFile(
        "docs",
        name||"Untitled document"
      );
    }
  );

}

function newPresentation(){

  openModal(
    "New presentation",
    "Presentation name",
    name=>{
      createFile(
        "slides",
        name||"Untitled presentation"
      );
    }
  );

}

      );

}


/* =========================================================
   MODAL
========================================================= */

function openModal(
  heading,
  placeholder,
  callback
){

  modalCallback=callback;

  modalTitle.textContent=heading;

  modalInput.placeholder=
    placeholder;

  modalInput.value="";

  modalBg.style.display="flex";

  setTimeout(
    ()=>modalInput.focus(),
    40
  );

}

function closeModal(){

  modalBg.style.display="none";

  modalCallback=null;

}

function confirmModal(){

  if(!modalCallback)
    return;

  const callback=
    modalCallback;

  const value=
    modalInput.value.trim();

  closeModal();

  callback(value);

}

modalInput.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter")
      confirmModal();

    if(event.key==="Escape")
      closeModal();

  }
);


/* =========================================================
   FILE ACTIONS
========================================================= */

function openFile(fileId){

  const file=
    getFile(fileId);

  if(!file)
    return;

  currentFileId=fileId;
  currentSection=file.type;

  title.textContent=
    file.name;

  activeNav(file.type);
  updateNewButton();

  if(file.type==="docs")
    renderDocs(file);

  if(file.type==="slides")
    renderSlides(file);

  if(file.type==="sheets")
    renderSheets(file);

}

function renameFile(fileId){

  const file=
    getFile(fileId);

  if(!file)
    return;

  openModal(
    "Rename",
    "New name",
    name=>{

      if(!name)
        return;

      file.name=name;

      save();

      openFile(fileId);

    }
  );

}

function duplicateFile(fileId){

  const file=
    getFile(fileId);

  if(!file)
    return;

  const copy=
    JSON.parse(
      JSON.stringify(file)
    );

  copy.id=id();

  copy.name=
    file.name+" copy";

  files.push(copy);

  save();

  showToast(
    "Duplicated"
  );

  renderFiles(file.type);

}

function deleteFile(fileId){

  if(!confirm("Delete this file?"))
    return;

  files=
    files.filter(
      file=>file.id!==fileId
    );

  save();

  showToast("Deleted");

  if(currentSection==="home")
    renderHome();
  else
    renderFiles(currentSection);

}


/* =========================================================
   FONT PICKER
========================================================= */

function fontPicker(target){

  return `

  <div class="font-picker">

    <input
      class="font-search"
      id="${target}FontSearch"
      placeholder="Choose font..."
      autocomplete="off"
      onclick="openFontMenu('${target}')"
      oninput="searchFonts('${target}')"
    >

    <div
      class="font-menu"
      id="${target}FontMenu"
    >

      ${fonts.map(font=>`

        <button
          class="font-option"
          data-font="${escapeHTML(font)}"
          style="font-family:${JSON.stringify(font)},sans-serif"
          onclick="chooseFont('${target}',${JSON.stringify(font)})"
        >
          ${escapeHTML(font)}
        </button>

      `).join("")}

    </div>

  </div>

  `;

}

function openFontMenu(target){

  const menu=
    document.getElementById(
      target+"FontMenu"
    );

  if(menu)
    menu.classList.add("open");

}

function searchFonts(target){

  const input=
    document.getElementById(
      target+"FontSearch"
    );

  const menu=
    document.getElementById(
      target+"FontMenu"
    );

  if(!input || !menu)
    return;

  menu.classList.add("open");

  const query=
    input.value
      .toLowerCase()
      .trim();

  menu
    .querySelectorAll(
      ".font-option"
    )
    .forEach(button=>{

      const font=
        button.dataset.font
          .toLowerCase();

      button.style.display=
        font.includes(query)
          ?"block"
          :"none";

    });

}

function closeFontMenus(){

  document
    .querySelectorAll(".font-menu")
    .forEach(menu=>{
      menu.classList.remove("open");
    });

}

async function chooseFont(
  target,
  font
){

  await loadFont(font);

  const search=
    document.getElementById(
      target+"FontSearch"
    );

  if(search){

    search.value=font;

    search.style.fontFamily=
      `"${font}",sans-serif`;

  }

  closeFontMenus();

  if(target==="doc")
    applyDocFont(font);

  if(target==="slide")
    applySlideFont(font);

}

document.addEventListener(
  "click",
  event=>{

    if(
      !event.target.closest(
        ".font-picker"
      )
    ){

      closeFontMenus();

    }

  }
);

function renderDocs(file){

  workspace.innerHTML=`

  <div class="editor-shell">

    <div class="toolbar">

      ${fontPicker("doc")}

      <select
        class="size"
        onchange="docCommand('fontSize',this.value)"
      >

        <option value="2">12</option>
        <option value="3" selected>16</option>
        <option value="4">18</option>
        <option value="5">24</option>
        <option value="6">32</option>
        <option value="7">40</option>

      </select>

      <div class="color">

        Text

        <input
          id="docColor"
          type="color"
          value="#111111"
          onchange="docCommand('foreColor',this.value)"
        >

      </div>

      <button onclick="docCommand('bold')">
        <b>B</b>
      </button>

      <button onclick="docCommand('italic')">
        <i>I</i>
      </button>

      <button onclick="docCommand('underline')">
        <u>U</u>
      </button>

      <button onclick="docCommand('justifyLeft')">
        Left
      </button>

      <button onclick="docCommand('justifyCenter')">
        Center
      </button>

      <button onclick="docCommand('justifyRight')">
        Right
      </button>

      <button onclick="document.getElementById('docImage').click()">
        Image
      </button>

      <input
        id="docImage"
        type="file"
        accept="image/*"
        hidden
        onchange="insertDocImage(event)"
      >

      <button onclick="window.print()">
        Print
      </button>

    </div>

    <div
      class="doc-page"
      id="docEditor"
      contenteditable="true"
      spellcheck="true"
    >
      ${file.content}
    </div>

function docCommand(
  command,
  value=null
){

  const editor=
    document.getElementById(
      "docEditor"
    );

  if(!editor)
    return;

  editor.focus();

  if(command==="fontSize"){

    document.execCommand(
      "fontSize",
      false,
      value
    );

  }else{

    document.execCommand(
      command,
      false,
      value
    );

  }

  saveDoc();

}

async function applyDocFont(font){

  await loadFont(font);

  const editor=
    document.getElementById(
      "docEditor"
    );

  if(!editor)
    return;

  editor.focus();

  const selection=
    window.getSelection();

  if(
    selection &&
    selection.rangeCount &&
    !selection
      .getRangeAt(0)
      .collapsed
  ){

    const range=
      selection.getRangeAt(0);

    const span=
      document.createElement(
        "span"
      );

    span.style.fontFamily=
      `"${font}",sans-serif`;

    span.appendChild(
      range.extractContents()
    );

    range.insertNode(span);

  }else{

    editor.style.fontFamily=
      `"${font}",sans-serif`;

  }

  saveDoc();

}

function saveDoc(){

  const file=
    getFile(currentFileId);

  const editor=
    document.getElementById(
      "docEditor"
    );

  if(!file || !editor)
    return;

  file.content=
    editor.innerHTML;

  file.updated=
    Date.now();

  save();

}

function insertDocImage(event){

  const selected=
    event.target.files[0];

  if(!selected)
    return;

  const reader=
    new FileReader();

  reader.onload=
    event=>{

      const editor=
        document.getElementById(
          "docEditor"
        );

      editor.focus();

      document.execCommand(
        "insertHTML",
        false,
        `<img src="${event.target.result}" alt="Image">`
      );

      saveDoc();

    };

  reader.readAsDataURL(
    selected
  );

}

   SLIDES
========================================================= */

function renderSlides(file){

  if(
    !Array.isArray(file.content) ||
    !file.content.length
  ){

    file.content=[
      {content:""}
    ];

    save();

  }

  workspace.innerHTML=`

  <div class="editor-shell">

    <div class="toolbar">

      ${fontPicker("slide")}

      <select
        class="size"
        onchange="slideCommand('fontSize',this.value)"
      >

        <option value="2">12</option>
        <option value="3">16</option>
        <option value="4" selected>18</option>
        <option value="5">24</option>
        <option value="6">32</option>
        <option value="7">40</option>

      </select>

      <div class="color">

        Text

        <input
          id="slideColor"
          type="color"
          value="#111111"
          onchange="slideCommand('foreColor',this.value)"
        >

      </div>

      <button onclick="slideCommand('bold')">
        <b>B</b>
      </button>

      <button onclick="slideCommand('italic')">
        <i>I</i>
      </button>

      <button onclick="slideCommand('underline')">
        <u>U</u>
      </button>

      <button onclick="slideCommand('justifyLeft')">
        Left
      </button>

      <button onclick="slideCommand('justifyCenter')">
        Center
      </button>

      <button onclick="slideCommand('justifyRight')">
        Right
      </button>

      <button onclick="addSlide()">
        New slide
      </button>

      <button onclick="duplicateSlide()">
        Duplicate
      </button>

      <button onclick="removeSlide()">
        Delete
      </button>

      <button onclick="document.getElementById('slideImage').click()">
        Image
      </button>

      <input
        id="slideImage"
        type="file"
        accept="image/*"
        hidden
        onchange="insertSlideImage(event)"
      >

      <button onclick="startPresentation()">
        Present
      </button>

    </div>

    <div class="slides">

      <div
        class="thumbs"
        id="thumbs"
      ></div>

      <div class="slide-center">

        <div
          class="slide-editor"
          id="slideEditor"
          contenteditable="true"
          spellcheck="true"
        ></div>

      </div>

    </div>

  </div>

  `;

  window.slideState={
    file:file,
    active:0
  };

  refreshSlide();

}

function refreshSlide(){

  const state=
    window.slideState;

  if(!state)
    return;

  const editor=
    document.getElementById(
      "slideEditor"
    );

  editor.innerHTML=
    state.file.content[
      state.active
    ].content||"";

  editor.oninput=()=>{

    state.file.content[
      state.active
    ].content=
      editor.innerHTML;

    save();

    renderThumbs();

  };

  renderThumbs();

}

function renderThumbs(){

  const state=
    window.slideState;

  if(!state)
    return;

  thumbs.innerHTML=
    state.file.content
      .map(
        (slide,index)=>`

        <div
          class="thumb ${
            index===state.active
              ?"active"
              :""
          }"
          onclick="selectSlide(${index})"
        >

          <div class="thumb-inner">
            ${slide.content||""}
          </div>

        </div>

      `
      )
      .join("");

}

function selectSlide(index){

  const state=
    window.slideState;

  if(!state)
    return;

  state.active=index;

  refreshSlide();

}

function slideCommand(
  command,
  value=null
){

  const editor=
    document.getElementById(
      "slideEditor"
    );

  if(!editor)
    return;

  editor.focus();

  document.execCommand(
    command,
    false,
    value
  );

  const state=
    window.slideState;

  if(state){

    state.file.content[
      state.active
    ].content=
      editor.innerHTML;

    save();

  }

}

async function applySlideFont(font){

  await loadFont(font);

  const editor=
    document.getElementById(
      "slideEditor"
    );

  const state=
    window.slideState;

  if(!editor || !state)
    return;

  editor.focus();

  const selection=
    window.getSelection();

  if(
    selection &&
    selection.rangeCount &&
    !selection
      .getRangeAt(0)
      .collapsed
  ){

    const range=
      selection.getRangeAt(0);

    const span=
      document.createElement(
        "span"
      );

    span.style.fontFamily=
      `"${font}",sans-serif`;

    span.appendChild(
      range.extractContents()
    );

    range.insertNode(span);

  }else{

    editor.style.fontFamily=
      `"${font}",sans-serif`;

  }

  state.file.content[
    state.active
  ].content=
    editor.innerHTML;

  save();

}

function addSlide(){

  const state=
    window.slideState;

  if(!state)
    return;

  const index=
    state.active+1;

  state.file.content.splice(
    index,
    0,
    {content:""}
  );

  save();

  state.active=index;

  refreshSlide();

}

function duplicateSlide(){

  const state=
    window.slideState;

  if(!state)
    return;

  const copy=
    JSON.parse(
      JSON.stringify(
        state.file.content[
          state.active
        ]
      )
    );

  const index=
    state.active+1;

  state.file.content.splice(
    index,
    0,
    copy
  );

  save();

  state.active=index;

  refreshSlide();

}

function removeSlide(){

  const state=
    window.slideState;

  if(!state)
    return;

  if(
    state.file.content.length<=1
  ){

    showToast(
      "Keep at least one slide"
    );

    return;

  }

  state.file.content.splice(
    state.active,
    1
  );

  state.active=
    Math.max(
      0,
      state.active-1
    );

  save();

  refreshSlide();

}

function insertSlideImage(event){

  const selected=
    event.target.files[0];

  if(!selected)
    return;

  const reader=
    new FileReader();

  reader.onload=
    event=>{

      const editor=
        document.getElementById(
          "slideEditor"
        );

      editor.focus();

      document.execCommand(
        "insertHTML",
        false,
        `<img src="${event.target.result}" alt="Image">`
      );

      const state=
        window.slideState;

      state.file.content[
        state.active
      ].content=
        editor.innerHTML;

      save();

    };

  reader.readAsDataURL(
    selected
  );

}


/* =========================================================
   PRESENTATION
========================================================= */

function startPresentation(){

  const state=
    window.slideState;

  if(!state)
    return;

  presentationIndex=0;

  presentation.style.display=
    "flex";

  renderPresentation();

  if(
    presentation.requestFullscreen
  ){

    presentation
      .requestFullscreen()
      .catch(()=>{});

  }

}

function renderPresentation(){

  const state=
    window.slideState;

  if(!state)
    return;

  presentationSlide.innerHTML=
    state.file.content[
      presentationIndex
    ].content||"";

  counter.textContent=
    `${presentationIndex+1} / ${state.file.content.length}`;

}

function nextPresentation(){

  const state=
    window.slideState;

  if(!state)
    return;

  if(
    presentationIndex<
    state.file.content.length-1
  ){

    presentationIndex++;

    renderPresentation();

  }

}

function previousPresentation(){

  if(presentationIndex>0){

    presentationIndex--;

    renderPresentation();

  }

}

function exitPresentation(){

  presentation.style.display=
    "none";

  if(document.fullscreenElement){

    document
      .exitFullscreen()
      .catch(()=>{});

  }

}

document.addEventListener(
  "keydown",
  event=>{

    if(
      presentation.style.display==="flex"
    ){

      if(
        event.key==="ArrowRight" ||
        event.key===" " ||
        event.key==="Enter"
      ){

        event.preventDefault();

        nextPresentation();

      }

      if(event.key==="ArrowLeft"){

        event.preventDefault();

        previousPresentation();

      }

      if(event.key==="Escape"){

        exitPresentation();

      }

    }

  }
);


/* =========================================================
   SHEETS
========================================================= */

function renderSheets(file){

  const rows=20;
  const cols=10;

  while(
    file.content.length<rows
  ){

    file.content.push(
      Array(cols).fill("")
    );

  }

  file.content=
    file.content.map(row=>{

      while(row.length<cols)
        row.push("");

      return row;

    });

  let html=`

  <div class="sheet-shell">

    <div class="toolbar">

      <button onclick="setSheetFont('Alegreya')">
        Alegreya
      </button>

      <button onclick="sheetStyle('fontWeight','bold')">
        <b>B</b>
      </button>

      <button onclick="sheetStyle('fontStyle','italic')">
        <i>I</i>
      </button>

      <button onclick="addSheetRow()">
        Add row
      </button>

      <button onclick="addSheetColumn()">
        Add column
      </button>

    </div>

    <div class="formula">

      <div
        class="cell-name"
        id="cellName"
      >
        A1
      </div>

      <input
        class="formula-input"
        id="formulaInput"
        placeholder="Value or formula"
      >

    </div>

    <div class="sheet-wrap">

      <table>

        <thead>

          <tr>

            <th></th>

  `;

  for(
    let c=0;
    c<cols;
    c++
  ){

    html+=`
      <th>${columnName(c)}</th>
    `;

  }

  html+=`

          </tr>

        </thead>

        <tbody>

  `;

  for(
    let r=0;
    r<rows;
    r++
  ){

    html+=`

      <tr>

        <th>${r+1}</th>

    `;

    for(
      let c=0;
      c<cols;
      c++
    ){

      html+=`

        <td
          contenteditable="true"
          data-row="${r}"
          data-col="${c}"
        >
          ${escapeHTML(
            file.content[r][c]||""
          )}
        </td>

      `;

    }

    html+=`

      </tr>

    `;

  }

  html+=`

        </tbody>

      </table>

    </div>

  </div>

  `;

  workspace.innerHTML=html;

  document
    .querySelectorAll("td")
    .forEach(cell=>{

      cell.addEventListener(
        "focus",
        ()=>{

          const r=
            Number(
              cell.dataset.row
            );

          const c=
            Number(
              cell.dataset.col
            );

          cellName.textContent=
            columnName(c)+(r+1);

          formulaInput.value=
            file.content[r][c]||"";

        }
      );

      cell.addEventListener(
        "input",
        ()=>{

          const r=
            Number(
              cell.dataset.row
            );

          const c=
            Number(
              cell.dataset.col
            );

          file.content[r][c]=
            cell.innerText;

          save();

        }
      );

    });

  formulaInput.addEventListener(
    "change",
    ()=>{

      const parsed=
        parseCell(cellName.textContent);

      if(!parsed)
        return;

      file.content[
        parsed.row
      ][
        parsed.col
      ]=
        formulaInput.value;

      save();

      renderSheets(file);

    }
  );

}

function columnName(number){

  let result="";

  number++;

  while(number>0){

    const remainder=
      (number-1)%26;

    result=
      String.fromCharCode(
        65+remainder
      )+result;

    number=
      Math.floor(
        (number-1)/26
      );

  }

  return result;

}

function parseCell(name){

  const match=
    name.match(
      /^([A-Z]+)(\d+)$/
    );

  if(!match)
    return null;

  let col=0;

  for(
    const char of match[1]
  ){

    col=
      col*26+
      char.charCodeAt(0)-64;

  }

  return{
    col:col-1,
    row:Number(match[2])-1
  };

}

function addSheetRow(){

  const file=
    getFile(currentFileId);

  if(!file)
    return;

  const cols=
    file.content[0]?.length||10;

  file.content.push(
    Array(cols).fill("")
  );

  save();

  renderSheets(file);

}

function addSheetColumn(){

  const file=
    getFile(currentFileId);

  if(!file)
    return;

  file.content.forEach(
    row=>row.push("")
  );

  save();

  renderSheets(file);

}

function sheetStyle(
  property,
  value
){

  const active=
    document.activeElement;

  if(
    active &&
    active.tagName==="TD"
  ){

    active.style[property]=value;

  }

}

function setSheetFont(font){

  loadFont(font);

  const active=
    document.activeElement;

  if(
    active &&
    active.tagName==="TD"
  ){

    active.style.fontFamily=
      `"${font}",sans-serif`;

  }

}


/* =========================================================
   COMMAND PALETTE
========================================================= */

function openCommand(){

  commandBg.style.display=
    "flex";

  commandInput.value="";

  commandInput.focus();

}

function closeCommand(event){

  if(
    event &&
    event.target!==commandBg
  )
    return;

  commandBg.style.display=
    "none";

}

function filterCommands(){

  const query=
    commandInput.value
      .toLowerCase();

  document
    .querySelectorAll(
      "#commandList button"
    )
    .forEach(button=>{

      button.style.display=
        button.textContent
          .toLowerCase()
          .includes(query)
          ?"block"
          :"none";

    });

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

  toast.textContent=
    message;

  toast.classList.add("show");

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer=
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      1800
    );

}


/* =========================================================
   SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase()==="k"
    ){

      event.preventDefault();

      openCommand();

    }

    if(event.key==="Escape"){

      closeFontMenus();

      commandBg.style.display=
        "none";

    }

  }
);


/* =========================================================
   INITIAL FONT
========================================================= */

loadFont("Alegreya");


/* =========================================================
   START
========================================================= */

goHome();

</script>
