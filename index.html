<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Clamme.</title>

<meta
  name="description"
  content="Clamme — Smart Premium Workspace."
>

<meta name="theme-color" content="#0b3d2e">

<link
  rel="manifest"
  href="/Clamme/manifest.json"
>

<style>

@import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&display=swap');

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: "Alegreya", serif;
  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(10, 74, 52, .42),
      transparent 34%
    ),
    #050806;
  color: #edf4ef;
}

button,
input,
textarea,
select {
  font-family: "Alegreya", serif;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  width: 100%;
  height: 100vh;
}

/* SIDEBAR */

.sidebar {
  width: 225px;
  flex-shrink: 0;

  background:
    linear-gradient(
      180deg,
      rgba(8, 38, 28, .96),
      rgba(4, 13, 9, .98)
    );

  border-right: 1px solid rgba(98, 157, 127, .16);

  padding: 25px 17px;

  display: flex;
  flex-direction: column;
}

.logo {
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -1px;
  margin: 2px 9px 30px;
}

.new-button {
  width: 100%;

  border: 1px solid rgba(105, 181, 143, .30);

  background:
    linear-gradient(
      180deg,
      rgba(18, 82, 59, .92),
      rgba(8, 47, 32, .92)
    );

  color: #f0f8f3;

  padding: 12px 15px;

  font-size: 16px;

  border-radius: 8px;

  transition: .18s ease;
}

.new-button:hover {
  background:
    linear-gradient(
      180deg,
      rgba(25, 103, 73, .98),
      rgba(10, 59, 40, .98)
    );

  border-color: rgba(124, 207, 163, .42);
}

.nav {
  margin-top: 25px;

  display: flex;
  flex-direction: column;

  gap: 3px;
}

.nav button {
  border: 0;
  background: transparent;

  color: rgba(226, 239, 231, .65);

  text-align: left;

  padding: 10px 11px;

  border-radius: 6px;

  font-size: 16px;

  transition: .15s ease;
}

.nav button:hover {
  background: rgba(38, 104, 75, .18);
  color: #eef7f1;
}

.nav button.active {
  background: rgba(37, 108, 76, .25);
  color: #ffffff;
}

.sidebar-bottom {
  margin-top: auto;
}

.install-button {
  width: 100%;

  border: 1px solid rgba(103, 184, 143, .35);

  background: rgba(10, 53, 37, .72);

  color: #eaf7ef;

  padding: 11px 13px;

  border-radius: 7px;

  font-size: 15px;

  transition: .18s ease;
}

.install-button:hover {
  background: rgba(21, 88, 61, .88);
}

/* MAIN */

.main {
  flex: 1;
  min-width: 0;

  display: flex;
  flex-direction: column;
}

.topbar {
  height: 64px;

  flex-shrink: 0;

  display: flex;
  align-items: center;

  justify-content: space-between;

  padding: 0 28px;

  border-bottom: 1px solid rgba(104, 155, 127, .12);

  background: rgba(4, 10, 7, .74);

  backdrop-filter: blur(20px);
}

.page-title {
  font-size: 21px;
}

.status {
  font-size: 14px;
  color: rgba(219, 237, 225, .48);
}

.workspace {
  flex: 1;

  overflow: auto;

  padding: 45px;
}

/* HOME */

.home {
  max-width: 1050px;
  margin: auto;
}

.hero {
  padding: 20px 0 35px;
}

.hero h1 {
  margin: 0;

  font-size: clamp(40px, 6vw, 72px);

  line-height: .95;

  font-weight: 500;

  letter-spacing: -2px;
}

.hero p {
  margin-top: 18px;

  font-size: 19px;

  color: rgba(225, 239, 230, .55);
}

.create-row {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 15px;

  margin-top: 15px;
}

.create-card {
  min-height: 130px;

  border: 1px solid rgba(104, 163, 130, .18);

  background: rgba(9, 29, 21, .58);

  padding: 20px;

  border-radius: 8px;

  text-align: left;

  color: #eef7f1;

  transition: .18s ease;
}

.create-card:hover {
  background: rgba(16, 55, 39, .72);

  border-color: rgba(105, 181, 143, .35);

  transform: translateY(-1px);
}

.create-card strong {
  display: block;

  font-size: 22px;

  margin-bottom: 7px;
}

.create-card span {
  color: rgba(221, 238, 226, .46);

  font-size: 15px;
}

/* EDITORS */

.editor {
  max-width: 1050px;
  margin: auto;
}

.editor-toolbar {
  display: flex;

  align-items: center;

  gap: 5px;

  margin-bottom: 15px;

  padding-bottom: 13px;

  border-bottom: 1px solid rgba(105, 160, 128, .14);
}

.tool {
  border: 0;

  background: transparent;

  color: rgba(231, 244, 235, .66);

  padding: 7px 10px;

  border-radius: 5px;

  font-size: 15px;
}

.tool:hover {
  background: rgba(37, 104, 73, .2);

  color: white;
}

.document {
  max-width: 820px;

  min-height: 900px;

  margin: auto;

  padding: 70px;

  background: #f7f8f6;

  color: #101511;

  outline: none;

  box-shadow: 0 18px 60px rgba(0,0,0,.25);

  border-radius: 2px;

  font-size: 18px;

  line-height: 1.65;
}

/* SLIDES */

.slides {
  max-width: 1100px;

  margin: auto;
}

.slide-toolbar {
  display: flex;

  gap: 7px;

  margin-bottom: 20px;
}

.slide {
  width: min(960px, 100%);

  aspect-ratio: 16 / 9;

  margin: auto;

  background: #f7f8f6;

  color: #101511;

  border-radius: 2px;

  box-shadow: 0 18px 60px rgba(0,0,0,.27);

  padding: 60px;

  outline: none;

  font-size: 32px;
}

/* SHEETS */

.sheet {
  max-width: 1100px;

  margin: auto;

  overflow: auto;

  border: 1px solid rgba(108, 167, 133, .18);
}

.formula {
  width: 100%;

  height: 42px;

  border: 0;

  border-bottom: 1px solid rgba(108, 167, 133, .18);

  background: #09150f;

  color: #eef7f1;

  outline: none;

  padding: 0 13px;

  font-size: 15px;
}

table {
  border-collapse: collapse;

  min-width: 900px;

  width: 100%;
}

th,
td {
  border-right: 1px solid #d8ddd9;

  border-bottom: 1px solid #d8ddd9;

  min-width: 110px;

  height: 36px;

  padding: 6px 8px;
}

th {
  background: #e9ece9;

  color: #1b211d;

  font-weight: 600;
}

td {
  background: #fbfcfb;

  color: #151915;

  outline: none;
}

td:focus {
  box-shadow: inset 0 0 0 2px #176b48;
}

/* EMPTY */

.empty {
  text-align: center;

  padding: 100px 20px;

  color: rgba(225, 239, 230, .46);

  font-size: 18px;
}

/* TOAST */

.toast {
  position: fixed;

  left: 50%;

  bottom: 25px;

  transform: translate(-50%, 20px);

  opacity: 0;

  pointer-events: none;

  background: #0b2e20;

  border: 1px solid rgba(103, 181, 142, .3);

  color: #e9f7ee;

  padding: 11px 17px;

  border-radius: 7px;

  transition: .2s ease;

  z-index: 9999;
}

.toast.show {
  opacity: 1;

  transform: translate(-50%, 0);
}

/* MOBILE */

@media(max-width: 750px) {

  .sidebar {
    width: 70px;

    padding: 18px 8px;
  }

  .logo {
    font-size: 21px;

    text-align: center;

    margin: 5px 0 25px;
  }

  .new-button {
    font-size: 0;

    padding: 12px 4px;
  }

  .new-button::after {
    content: "+";

    font-size: 21px;
  }

  .nav button {
    font-size: 0;

    text-align: center;

    padding: 12px 4px;
  }

  .nav button::first-letter {
    font-size: 18px;
  }

  .install-button {
    font-size: 0;

    padding: 12px 3px;
  }

  .install-button::after {
    content: "↥";

    font-size: 20px;
  }

  .workspace {
    padding: 25px 15px;
  }

  .topbar {
    padding: 0 15px;
  }

  .create-row {
    grid-template-columns: 1fr;
  }

  .document {
    padding: 35px 25px;
  }
}

</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">Clamme.</div>

    <button
      class="new-button"
      id="newButton"
      onclick="createCurrent()"
    >
      + New document
    </button>

    <nav class="nav">

      <button
        id="nav-home"
        onclick="goHome()"
      >
        Home
      </button>

      <button
        id="nav-docs"
        onclick="openSection('docs')"
      >
        Docs
      </button>

      <button
        id="nav-slides"
        onclick="openSection('slides')"
      >
        Slides
      </button>

      <button
        id="nav-sheets"
        onclick="openSection('sheets')"
      >
        Sheets
      </button>

    </nav>

    <div class="sidebar-bottom">

      <button
        class="install-button"
        id="installButton"
        onclick="installClamme()"
      >
        Install Clamme
      </button>

    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div
        class="page-title"
        id="pageTitle"
      >
        Home
      </div>

      <div
        class="status"
        id="status"
      >
        Ready
      </div>

    </header>

    <section
      class="workspace"
      id="workspace"
    ></section>

  </main>

</div>

<div
  class="toast"
  id="toast"
></div>


<script>

const BASE = "/Clamme/";

let currentSection = "home";

let deferredPrompt = null;

let installed = false;


/* --------------------------------
   PWA INSTALL PROMPT
-------------------------------- */

window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredPrompt = event;

    updateInstallButton();

  }
);


window.addEventListener(
  "appinstalled",
  () => {

    installed = true;

    deferredPrompt = null;

    updateInstallButton();

    toast("Clamme installed.");

  }
);


function updateInstallButton() {

  const button =
    document.getElementById("installButton");

  if (!button) return;

  if (installed) {

    button.textContent = "Installed";

    button.disabled = true;

    return;

  }

  button.textContent = "Install Clamme";

  button.disabled = false;

}


/*
   THIS IS THE REAL INSTALL ACTION.
*/

async function installClamme() {

  if (installed) {

    toast("Clamme is already installed.");

    return;

  }

  if (deferredPrompt) {

    deferredPrompt.prompt();

    const result =
      await deferredPrompt.userChoice;

    if (result.outcome === "accepted") {

      toast("Installing Clamme...");

    }

    deferredPrompt = null;

    return;

  }

  /*
    If Chrome has not supplied the native
    install prompt yet, don't fake it.
  */

  toast(
    "Clamme isn't install-ready yet. Refresh the page once."
  );

}


/* --------------------------------
   SERVICE WORKER
-------------------------------- */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    async () => {

      try {

        const registration =
          await navigator.serviceWorker.register(
            BASE + "sw.js",
            {
              scope: BASE
            }
          );

        console.log(
          "Clamme service worker registered:",
          registration.scope
        );

      } catch (error) {

        console.error(
          "Clamme service worker failed:",
          error
        );

      }

    }
  );

}


/* --------------------------------
   NAVIGATION
-------------------------------- */

function setActive(section) {

  document
    .querySelectorAll(".nav button")
    .forEach(button => {
      button.classList.remove("active");
    });

  const active =
    document.getElementById(
      "nav-" + section
    );

  if (active) {
    active.classList.add("active");
  }

}


function updateNewButton() {

  const button =
    document.getElementById("newButton");

  if (currentSection === "slides") {

    button.textContent =
      "+ New presentation";

  }

  else if (currentSection === "sheets") {

    button.textContent =
      "+ New spreadsheet";

  }

  else {

    button.textContent =
      "+ New document";

  }

}


function goHome() {

  currentSection = "home";

  setActive("home");

  updateNewButton();

  document.getElementById("pageTitle").textContent =
    "Home";

  renderHome();

}


function openSection(section) {

  currentSection = section;

  setActive(section);

  updateNewButton();

  const names = {

    docs: "Docs",

    slides: "Slides",

    sheets: "Sheets"

  };

  document.getElementById("pageTitle").textContent =
    names[section];

  if (section === "docs") {
    renderDocs();
  }

  else if (section === "slides") {
    renderSlides();
  }

  else if (section === "sheets") {
    renderSheets();
  }

}


/* --------------------------------
   HOME
-------------------------------- */

function renderHome() {

  document.getElementById("workspace").innerHTML = `

    <div class="home">

      <div class="hero">

        <h1>Clamme.</h1>

        <p>
          Smart Premium Workspace
        </p>

      </div>

      <div class="create-row">

        <button
          class="create-card"
          onclick="openSection('docs')"
        >
          <strong>Document</strong>

          <span>
            Write with Clamme Docs.
          </span>

        </button>

        <button
          class="create-card"
          onclick="openSection('slides')"
        >
          <strong>Presentation</strong>

          <span>
            Build with Clamme Slides.
          </span>

        </button>

        <button
          class="create-card"
          onclick="openSection('sheets')"
        >
          <strong>Spreadsheet</strong>

          <span>
            Calculate with Clamme Sheets.
          </span>

        </button>

      </div>

    </div>

  `;

}


/* --------------------------------
   DOCS
-------------------------------- */

function renderDocs() {

  document.getElementById("workspace").innerHTML = `

    <div class="editor">

      <div class="editor-toolbar">

        <button
          class="tool"
          onclick="format('bold')"
        >
          Bold
        </button>

        <button
          class="tool"
          onclick="format('italic')"
        >
          Italic
        </button>

        <button
          class="tool"
          onclick="format('underline')"
        >
          Underline
        </button>

        <button
          class="tool"
          onclick="format('formatBlock','h1')"
        >
          Heading
        </button>

      </div>

      <div
        id="document"
        class="document"
        contenteditable="true"
        spellcheck="true"
      ></div>

    </div>

  `;

  const saved =
    localStorage.getItem("clamme-document");

  document.getElementById("document").innerHTML =
    saved || "";

  document
    .getElementById("document")
    .addEventListener(
      "input",
      saveDocument
    );

}


function saveDocument() {

  localStorage.setItem(
    "clamme-document",
    document.getElementById("document").innerHTML
  );

  document.getElementById("status").textContent =
    "Saved";

}


function format(command, value = null) {

  document.execCommand(
    command,
    false,
    value
  );

  saveDocument();

}


/* --------------------------------
   SLIDES
-------------------------------- */

function renderSlides() {

  document.getElementById("workspace").innerHTML = `

    <div class="slides">

      <div class="slide-toolbar">

        <button
          class="tool"
          onclick="clearSlide()"
        >
          New slide
        </button>

        <button
          class="tool"
          onclick="presentSlide()"
        >
          Present
        </button>

      </div>

      <div
        id="slide"
        class="slide"
        contenteditable="true"
      ></div>

    </div>

  `;

  const saved =
    localStorage.getItem("clamme-slide");

  document.getElementById("slide").innerHTML =
    saved || "";

  document
    .getElementById("slide")
    .addEventListener(
      "input",
      () => {

        localStorage.setItem(
          "clamme-slide",
          document.getElementById("slide").innerHTML
        );

        document.getElementById("status").textContent =
          "Saved";

      }
    );

}


function clearSlide() {

  const slide =
    document.getElementById("slide");

  slide.innerHTML = "";

  slide.focus();

  localStorage.removeItem(
    "clamme-slide"
  );

}


function presentSlide() {

  const slide =
    document.getElementById("slide");

  if (slide.requestFullscreen) {

    slide.requestFullscreen();

  }

}


/* --------------------------------
   SHEETS
-------------------------------- */

function renderSheets() {

  let html = `

    <div class="sheet">

      <input
        class="formula"
        id="formula"
        placeholder="Formula or value"
      >

      <table>

        <thead>

          <tr>

            <th></th>

  `;

  for (
    let column = 0;
    column < 10;
    column++
  ) {

    html += `
      <th>${columnLetter(column)}</th>
    `;

  }

  html += `
          </tr>
        </thead>

        <tbody>
  `;

  for (
    let row = 0;
    row < 25;
    row++
  ) {

    html += `<tr>`;

    html += `
      <th>${row + 1}</th>
    `;

    for (
      let column = 0;
      column < 10;
      column++
    ) {

      const key =
        `clamme-${row}-${column}`;

      const value =
        localStorage.getItem(key) || "";

      html += `
        <td
          contenteditable="true"
          data-key="${key}"
          data-row="${row}"
          data-column="${column}"
        >${escapeHTML(value)}</td>
      `;

    }

    html += `</tr>`;

  }

  html += `

        </tbody>

      </table>

    </div>

  `;

  document.getElementById("workspace").innerHTML =
    html;

  document
    .querySelectorAll("td")
    .forEach(cell => {

      cell.addEventListener(
        "input",
        () => {

          localStorage.setItem(
            cell.dataset.key,
            cell.textContent
          );

          document.getElementById("status").textContent =
            "Saved";

        }
      );

      cell.addEventListener(
        "focus",
        () => {

          document.getElementById("formula").value =
            cell.textContent;

        }
      );

    });

}


function columnLetter(index) {

  return String.fromCharCode(
    65 + index
  );

}


function escapeHTML(value) {

  return value
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* --------------------------------
   NEW BUTTON
-------------------------------- */

function createCurrent() {

  if (currentSection === "slides") {

    openSection("slides");

    setTimeout(
      () => clearSlide(),
      0
    );

    return;

  }

  if (currentSection === "sheets") {

    openSection("sheets");

    return;

  }

  openSection("docs");

}


/* --------------------------------
   TOAST
-------------------------------- */

let toastTimer;

function toast(message) {

  const element =
    document.getElementById("toast");

  element.textContent = message;

  element.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(
    () => {
      element.classList.remove("show");
    },
    2800
  );

}


/* --------------------------------
   START
-------------------------------- */

goHome();

updateInstallButton();

</script>

</body>
</html>
