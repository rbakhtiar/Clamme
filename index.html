<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b261b">
  <meta name="background-color" content="#07100c">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Clamme</title>

  <!-- IMPORTANT: GitHub Pages repository path -->
  <link
    rel="manifest"
    href="/Clamme/manifest.json"
  >

  <link
    rel="canonical"
    href="https://rbakhtiar.github.io/Clamme/"
  >

  <link
    rel="icon"
    href="/Clamme/icons/icon-192.png"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="/Clamme/icons/icon-192.png"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #07100c;
      --panel: #0a1711;
      --panel-2: #0d1d15;
      --emerald: #123f2d;
      --emerald-bright: #1c6344;
      --text: #f1f5f2;
      --muted: #91a49a;
      --line: rgba(130, 190, 160, .14);
      --line-strong: rgba(130, 190, 160, .25);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Alegreya", serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #08120d;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      font-size: 28px;
      letter-spacing: -.5px;
      margin: 0 10px 30px;
    }

    .new-button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(95, 185, 135, .35);
      background: #103b29;
      border-radius: 9px;
      text-align: left;
      font-weight: 600;
      transition: .18s ease;
    }

    .new-button:hover {
      background: #155137;
      border-color: rgba(120, 210, 160, .55);
    }

    .nav {
      margin-top: 26px;
      display: grid;
      gap: 4px;
    }

    .nav button {
      border: 0;
      background: transparent;
      text-align: left;
      padding: 10px;
      border-radius: 7px;
      color: var(--muted);
    }

    .nav button:hover,
    .nav button.active {
      color: var(--text);
      background: rgba(40, 100, 70, .25);
    }

    .sidebar-footer {
      margin-top: auto;
      color: #60746a;
      font-size: 14px;
      padding: 10px;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 66px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .page-title {
      font-size: 22px;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .workspace {
      flex: 1;
      overflow: auto;
      padding: 34px;
    }

    .home {
      max-width: 1050px;
      margin: auto;
    }

    .hero {
      padding: 40px 0;
    }

    .hero h1 {
      font-size: clamp(38px, 6vw, 68px);
      line-height: .95;
      margin: 0 0 14px;
      font-weight: 500;
      letter-spacing: -2px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 19px;
    }

    .create-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .create {
      min-height: 130px;
      background: #0a1811;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      text-align: left;
      transition: .18s ease;
    }

    .create:hover {
      border-color: var(--line-strong);
      background: #0d2117;
    }

    .create strong {
      display: block;
      font-size: 21px;
      margin-bottom: 7px;
    }

    .create span {
      color: var(--muted);
    }

    .editor {
      max-width: 900px;
      margin: auto;
    }

    .document {
      min-height: 750px;
      background: #f7f8f6;
      color: #172019;
      padding: 65px;
      outline: none;
      border-radius: 3px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, .22);
      font-size: 18px;
      line-height: 1.65;
    }

    .slide {
      aspect-ratio: 16 / 9;
      background: #f7f8f6;
      color: #172019;
      padding: 7%;
      outline: none;
      border-radius: 3px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, .22);
      font-size: 28px;
    }

    .sheet-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      background: #09150f;
    }

    .sheet {
      border-collapse: collapse;
      min-width: 850px;
      width: 100%;
    }

    .sheet th,
    .sheet td {
      border: 1px solid var(--line);
      min-width: 110px;
      height: 42px;
      padding: 8px;
    }

    .sheet th {
      color: var(--muted);
      background: #0d1c14;
      font-weight: 500;
    }

    .sheet td {
      outline: none;
    }

    .sheet td:focus {
      box-shadow: inset 0 0 0 1px var(--emerald-bright);
      background: #0c2117;
    }

    .install {
      position: fixed;
      right: 22px;
      bottom: 22px;
      display: none;
      border: 1px solid rgba(110, 210, 155, .4);
      background: #123f2d;
      padding: 11px 17px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 100;
    }

    .install.visible {
      display: block;
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .workspace {
        padding: 18px;
      }

      .create-grid {
        grid-template-columns: 1fr;
      }

      .document {
        padding: 35px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <aside class="sidebar">
      <div class="brand">Clamme.</div>

      <button class="new-button" id="newButton">
        + <span id="newText">New document</span>
      </button>

      <nav class="nav">
        <button data-page="home" class="active">Home</button>
        <button data-page="docs">Docs</button>
        <button data-page="slides">Slides</button>
        <button data-page="sheets">Sheets</button>
      </nav>

      <div class="sidebar-footer">
        Smart Premium Workspace
      </div>
    </aside>

    <main class="main">

      <header class="topbar">
        <div class="page-title" id="pageTitle">Home</div>
        <div class="status" id="status">Ready</div>
      </header>

      <section class="workspace" id="workspace"></section>

    </main>
  </div>

  <button class="install" id="installButton">
    Install Clamme
  </button>

  <script>
    const BASE = "/Clamme/";
    const workspace = document.getElementById("workspace");
    const pageTitle = document.getElementById("pageTitle");
    const status = document.getElementById("status");
    const newText = document.getElementById("newText");
    const installButton = document.getElementById("installButton");

    let currentPage = "home";
    let deferredPrompt = null;

    const labels = {
      home: "New document",
      docs: "New document",
      slides: "New presentation",
      sheets: "New spreadsheet"
    };

    function setPage(page) {
      currentPage = page;

      document.querySelectorAll(".nav button").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.page === page
        );
      });

      pageTitle.textContent =
        page.charAt(0).toUpperCase() + page.slice(1);

      newText.textContent = labels[page];

      renderPage();
    }

    function renderPage() {
      if (currentPage === "home") {
        workspace.innerHTML = `
          <div class="home">
            <div class="hero">
              <h1>Clamme.</h1>
              <p>Documents. Presentations. Spreadsheets.</p>
            </div>

            <div class="create-grid">
              <button class="create" data-create="docs">
                <strong>Document</strong>
                <span>Create a new document</span>
              </button>

              <button class="create" data-create="slides">
                <strong>Presentation</strong>
                <span>Create a new presentation</span>
              </button>

              <button class="create" data-create="sheets">
                <strong>Spreadsheet</strong>
                <span>Create a new spreadsheet</span>
              </button>
            </div>
          </div>
        `;
      }

      if (currentPage === "docs") {
        workspace.innerHTML = `
          <div class="editor">
            <div
              class="document"
              contenteditable="true"
              spellcheck="true"
              id="documentEditor"
            ></div>
          </div>
        `;

        const editor = document.getElementById("documentEditor");

        editor.innerHTML =
          localStorage.getItem("clamme-document") || "";

        editor.addEventListener("input", () => {
          localStorage.setItem(
            "clamme-document",
            editor.innerHTML
          );

          status.textContent = "Saved";
        });
      }

      if (currentPage === "slides") {
        workspace.innerHTML = `
          <div class="editor">
            <div
              class="slide"
              contenteditable="true"
              spellcheck="true"
              id="slideEditor"
            ></div>
          </div>
        `;

        const editor = document.getElementById("slideEditor");

        editor.innerHTML =
          localStorage.getItem("clamme-slide") || "";

        editor.addEventListener("input", () => {
          localStorage.setItem(
            "clamme-slide",
            editor.innerHTML
          );

          status.textContent = "Saved";
        });
      }

      if (currentPage === "sheets") {
        renderSheet();
      }
    }

    function renderSheet() {
      let html = `
        <div class="sheet-wrap">
          <table class="sheet">
            <thead>
              <tr>
                <th></th>
      `;

      for (let col = 1; col <= 10; col++) {
        html += `<th>${columnName(col)}</th>`;
      }

      html += `
              </tr>
            </thead>
            <tbody>
      `;

      for (let row = 1; row <= 20; row++) {
        html += `<tr><th>${row}</th>`;

        for (let col = 1; col <= 10; col++) {
          const key = `clamme-${columnName(col)}${row}`;

          html += `
            <td
              contenteditable="true"
              data-cell="${key}"
            >${escapeHTML(localStorage.getItem(key) || "")}</td>
          `;
        }

        html += `</tr>`;
      }

      html += `
            </tbody>
          </table>
        </div>
      `;

      workspace.innerHTML = html;

      workspace.querySelectorAll("[data-cell]").forEach(cell => {
        cell.addEventListener("input", () => {
          localStorage.setItem(
            cell.dataset.cell,
            cell.innerText
          );

          status.textContent = "Saved";
        });
      });
    }

    function columnName(number) {
      let result = "";

      while (number > 0) {
        const remainder = (number - 1) % 26;

        result =
          String.fromCharCode(65 + remainder) + result;

        number =
          Math.floor((number - 1) / 26);
      }

      return result;
    }

    function escapeHTML(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createNew() {
      if (currentPage === "home") {
        setPage("docs");
        return;
      }

      if (currentPage === "docs") {
        localStorage.removeItem("clamme-document");
        setPage("docs");
        return;
      }

      if (currentPage === "slides") {
        localStorage.removeItem("clamme-slide");
        setPage("slides");
        return;
      }

      if (currentPage === "sheets") {
        for (let row = 1; row <= 20; row++) {
          for (let col = 1; col <= 10; col++) {
            localStorage.removeItem(
              `clamme-${columnName(col)}${row}`
            );
          }
        }

        setPage("sheets");
      }
    }

    document
      .querySelectorAll(".nav button")
      .forEach(button => {
        button.addEventListener("click", () => {
          setPage(button.dataset.page);
        });
      });

    document
      .getElementById("newButton")
      .addEventListener("click", createNew);

    workspace.addEventListener("click", event => {
      const create = event.target.closest("[data-create]");

      if (!create) return;

      setPage(create.dataset.create);
    });

    /*
      PWA INSTALL PROMPT
    */

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();

      deferredPrompt = event;

      installButton.classList.add("visible");
    });

    installButton.addEventListener("click", async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      const result =
        await deferredPrompt.userChoice;

      if (result.outcome === "accepted") {
        status.textContent = "Clamme installed";
      }

      deferredPrompt = null;

      installButton.classList.remove("visible");
    });

    window.addEventListener("appinstalled", () => {
      installButton.classList.remove("visible");
      status.textContent = "Clamme installed";
    });

    /*
      SERVICE WORKER
      GitHub Pages repository path is /Clamme/
    */

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registration =
            await navigator.serviceWorker.register(
              BASE + "sw.js",
              {
                scope: BASE
              }
            );

          console.log(
            "Clamme service worker registered:",
            registration.scope
          );

        } catch (error) {
          console.error(
            "Clamme service worker registration failed:",
            error
          );
        }
      });
    }

    renderPage();
  </script>

</body>
</html>
