<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clamme.</title>

<meta
  name="description"
  content="Clamme — Docs, Slides and Sheets."
>

<meta name="theme-color" content="#08291d">

<link rel="manifest" href="/Clamme/manifest.json">

<style>
@import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&display=swap');

:root {
  --bg: #050806;
  --panel: #08130e;
  --panel-2: #0a1912;
  --emerald: #0c4b34;
  --emerald-2: #116043;
  --line: rgba(147, 190, 166, 0.14);
  --line-strong: rgba(147, 190, 166, 0.24);
  --text: #edf5ef;
  --muted: rgba(225, 239, 229, 0.55);
  --soft: rgba(225, 239, 229, 0.72);
  --paper: #fafbf9;
  --paper-text: #141815;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: "Alegreya", serif;
  background:
    radial-gradient(
      circle at 18% -10%,
      rgba(17, 91, 61, 0.38),
      transparent 34%
    ),
    radial-gradient(
      circle at 90% 100%,
      rgba(8, 57, 39, 0.18),
      transparent 35%
    ),
    var(--bg);
  color: var(--text);
  overflow: hidden;
}

button,
input,
textarea,
select {
  font-family: "Alegreya", serif;
}

button {
  color: inherit;
}

/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  height: 100vh;
  display: flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
  width: 238px;
  flex-shrink: 0;

  padding: 27px 18px 20px;

  display: flex;
  flex-direction: column;

  background:
    linear-gradient(
      180deg,
      rgba(8, 31, 22, 0.98),
      rgba(4, 12, 8, 0.99)
    );

  border-right: 1px solid var(--line);
}

.logo {
  padding: 0 11px;

  font-size: 31px;
  font-weight: 600;
  letter-spacing: -1.4px;

  color: #f2f7f3;

  margin-bottom: 29px;
}

/* =========================================================
   NEW BUTTON
========================================================= */

.new-button {
  width: 100%;

  border: 1px solid rgba(131, 190, 158, 0.28);

  background:
    linear-gradient(
      180deg,
      rgba(16, 82, 56, 0.88),
      rgba(8, 54, 37, 0.88)
    );

  border-radius: 7px;

  padding: 11px 15px;

  font-size: 16px;

  text-align: left;

  cursor: pointer;

  transition:
    background 180ms ease,
    border-color 180ms ease,
    transform 180ms ease;
}

.new-button:hover {
  background:
    linear-gradient(
      180deg,
      rgba(22, 101, 69, 0.95),
      rgba(10, 64, 43, 0.95)
    );

  border-color: rgba(145, 211, 174, 0.4);
}

.new-button:active {
  transform: translateY(1px);
}

/* =========================================================
   NAVIGATION
========================================================= */

.nav {
  display: flex;
  flex-direction: column;
  gap: 3px;

  margin-top: 24px;
}

.nav button {
  width: 100%;

  border: 0;

  background: transparent;

  color: rgba(225, 239, 229, 0.57);

  text-align: left;

  padding: 10px 12px;

  border-radius: 6px;

  font-size: 16px;

  cursor: pointer;

  transition:
    background 160ms ease,
    color 160ms ease;
}

.nav button:hover {
  background: rgba(57, 127, 93, 0.13);
  color: #f0f6f2;
}

.nav button.active {
  background: rgba(43, 117, 81, 0.21);
  color: #ffffff;
}

/* =========================================================
   MAIN
========================================================= */

.main {
  flex: 1;
  min-width: 0;
  height: 100%;

  display: flex;
  flex-direction: column;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
  height: 66px;
  flex-shrink: 0;

  padding: 0 30px;

  display: flex;
  align-items: center;

  border-bottom: 1px solid var(--line);

  background: rgba(4, 10, 7, 0.72);

  backdrop-filter: blur(22px);
}

.page-title {
  font-size: 21px;
  font-weight: 500;

  letter-spacing: -0.2px;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
  flex: 1;
  min-height: 0;

  overflow: auto;

  padding: 38px;
}

/* =========================================================
   HOME
========================================================= */

.home {
  width: min(1100px, 100%);
  margin: 0 auto;
}

.home-header {
  padding: 22px 2px 35px;
}

.home-header h1 {
  margin: 0;

  font-size: clamp(46px, 6vw, 76px);

  line-height: 0.92;

  font-weight: 500;

  letter-spacing: -2.7px;
}

.home-rule {
  width: 100%;
  height: 1px;

  margin-top: 28px;

  background:
    linear-gradient(
      90deg,
      rgba(116, 177, 145, 0.36),
      rgba(116, 177, 145, 0.04)
    );
}

.create-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 14px;
}

.create-card {
  min-height: 148px;

  padding: 23px;

  text-align: left;

  border: 1px solid var(--line);

  border-radius: 7px;

  background:
    linear-gradient(
      145deg,
      rgba(11, 38, 27, 0.86),
      rgba(6, 19, 13, 0.82)
    );

  cursor: pointer;

  transition:
    transform 180ms ease,
    border-color 180ms ease,
    background 180ms ease;
}

.create-card:hover {
  transform: translateY(-2px);

  border-color: var(--line-strong);

  background:
    linear-gradient(
      145deg,
      rgba(15, 54, 37, 0.94),
      rgba(7, 23, 16, 0.9)
    );
}

.create-card-title {
  display: block;

  font-size: 23px;
  font-weight: 600;

  margin-bottom: 9px;
}

.create-card-description {
  display: block;

  font-size: 15px;

  color: var(--muted);
}

/* =========================================================
   EDITOR COMMON
========================================================= */

.editor-shell {
  width: min(1100px, 100%);
  margin: 0 auto;
}

.editor-toolbar {
  min-height: 48px;

  display: flex;
  align-items: center;
  gap: 3px;

  padding-bottom: 13px;

  margin-bottom: 22px;

  border-bottom: 1px solid var(--line);
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
}

.toolbar-divider {
  width: 1px;
  height: 22px;

  margin: 0 8px;

  background: var(--line);
}

.tool {
  border: 0;

  background: transparent;

  color: rgba(231, 243, 235, 0.66);

  padding: 7px 10px;

  border-radius: 5px;

  font-size: 15px;

  cursor: pointer;

  transition:
    background 150ms ease,
    color 150ms ease;
}

.tool:hover {
  background: rgba(55, 127, 90, 0.15);
  color: #ffffff;
}

.tool:active {
  background: rgba(55, 127, 90, 0.23);
}

/* =========================================================
   DOCS
========================================================= */

.docs-area {
  display: flex;
  justify-content: center;

  padding-bottom: 60px;
}

.document-page {
  width: min(820px, 100%);

  min-height: 980px;

  padding: 78px 82px;

  background: var(--paper);

  color: var(--paper-text);

  box-shadow:
    0 22px 65px rgba(0, 0, 0, 0.30);

  outline: none;

  font-size: 18px;

  line-height: 1.7;

  caret-color: #145d40;
}

.document-page:empty::before {
  content: "Start writing";

  color: #a3aaa5;

  pointer-events: none;
}

.document-page h1 {
  font-size: 38px;
  line-height: 1.15;

  margin: 0 0 20px;
}

.document-page h2 {
  font-size: 29px;

  margin: 25px 0 12px;
}

.document-page h3 {
  font-size: 23px;

  margin: 22px 0 10px;
}

.document-page p {
  margin: 0 0 13px;
}

/* =========================================================
   SLIDES
========================================================= */

.slides-shell {
  width: min(1200px, 100%);
  margin: 0 auto;
}

.slides-toolbar {
  display: flex;
  align-items: center;

  justify-content: space-between;

  padding-bottom: 13px;

  margin-bottom: 22px;

  border-bottom: 1px solid var(--line);
}

.slides-actions {
  display: flex;
  gap: 4px;
}

.slide-count {
  color: var(--muted);
  font-size: 14px;
}

.slide-layout {
  display: grid;

  grid-template-columns: 150px minmax(0, 1fr);

  gap: 22px;
}

/* THUMBNAILS */

.slide-sidebar {
  display: flex;
  flex-direction: column;

  gap: 11px;

  max-height: calc(100vh - 185px);

  overflow-y: auto;
}

.slide-thumbnail {
  position: relative;

  width: 100%;

  aspect-ratio: 16 / 9;

  background: #f7f9f7;

  border: 1px solid rgba(135, 178, 151, 0.15);

  color: #171c18;

  cursor: pointer;

  padding: 10px;

  font-size: 11px;

  text-align: left;

  transition:
    border-color 160ms ease,
    transform 160ms ease;
}

.slide-thumbnail:hover {
  transform: translateY(-1px);

  border-color: rgba(135, 194, 157, 0.35);
}

.slide-thumbnail.active {
  border: 2px solid #31835c;
}

.thumbnail-number {
  position: absolute;

  left: 7px;
  bottom: 5px;

  font-size: 10px;

  color: #67736b;
}

/* SLIDE STAGE */

.slide-stage {
  display: flex;

  align-items: flex-start;
  justify-content: center;

  padding-bottom: 50px;
}

.slide-canvas {
  width: min(100%, 980px);

  aspect-ratio: 16 / 9;

  background: #fafbf9;

  color: #131713;

  box-shadow:
    0 25px 70px rgba(0, 0, 0, 0.34);

  outline: none;

  padding: 68px;

  font-size: 34px;

  line-height: 1.25;

  overflow: auto;
}

.slide-canvas:empty::before {
  content: "Untitled presentation";

  color: #a3aaa5;
}

.slide-canvas h1 {
  font-size: 54px;
  margin: 0 0 20px;
}

.slide-canvas h2 {
  font-size: 37px;
  margin: 0 0 16px;
}

/* =========================================================
   SHEETS
========================================================= */

.sheets-shell {
  width: min(1250px, 100%);
  margin: 0 auto;
}

.sheet-toolbar {
  display: flex;
  align-items: center;

  gap: 10px;

  margin-bottom: 16px;
}

.cell-name {
  width: 78px;
  height: 38px;

  padding: 0 10px;

  border: 1px solid var(--line);

  background: rgba(7, 23, 16, 0.85);

  color: var(--soft);

  outline: none;

  text-align: center;

  font-size: 14px;
}

.formula-input {
  flex: 1;

  min-width: 0;

  height: 38px;

  padding: 0 13px;

  border: 1px solid var(--line);

  background: rgba(7, 23, 16, 0.85);

  color: var(--text);

  outline: none;

  font-size: 15px;
}

.formula-input:focus,
.cell-name:focus {
  border-color: rgba(104, 177, 136, 0.4);
}

.sheet-frame {
  border: 1px solid var(--line);

  overflow: auto;

  max-height: calc(100vh - 180px);

  background: #edf0ed;
}

.sheet-table {
  border-collapse: collapse;

  min-width: 1050px;

  width: 100%;

  table-layout: fixed;
}

.sheet-table th,
.sheet-table td {
  height: 34px;

  border-right: 1px solid #d7ddd8;

  border-bottom: 1px solid #d7ddd8;
}

.sheet-table th {
  width: 88px;

  background: #e6eae6;

  color: #566058;

  font-size: 13px;

  font-weight: 600;

  text-align: center;
}

.sheet-table td {
  min-width: 115px;

  padding: 6px 9px;

  background: #fbfcfb;

  color: #171b18;

  outline: none;

  font-family: "Alegreya", serif;

  font-size: 15px;

  cursor: cell;
}

.sheet-table td:hover {
  background: #f2f5f2;
}

.sheet-table td.selected {
  box-shadow:
    inset 0 0 0 2px #18724c;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;

  left: 50%;
  bottom: 25px;

  transform:
    translate(-50%, 16px);

  opacity: 0;

  pointer-events: none;

  padding: 10px 17px;

  background: #0b3020;

  border: 1px solid rgba(124, 192, 151, 0.28);

  color: #eef8f1;

  border-radius: 6px;

  font-size: 14px;

  transition:
    opacity 180ms ease,
    transform 180ms ease;

  z-index: 9999;
}

.toast.show {
  opacity: 1;

  transform:
    translate(-50%, 0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

  .sidebar {
    width: 205px;
  }

  .workspace {
    padding: 25px;
  }

  .slide-layout {
    grid-template-columns: 1fr;
  }

  .slide-sidebar {
    flex-direction: row;

    max-height: none;

    overflow-x: auto;
  }

  .slide-thumbnail {
    flex: 0 0 130px;
  }

  .document-page {
    padding: 55px;
  }
}

@media (max-width: 650px) {

  body {
    overflow: auto;
  }

  .app {
    min-height: 100vh;
    height: auto;
  }

  .sidebar {
    width: 68px;

    min-height: 100vh;

    padding: 18px 7px;
  }

  .logo {
    font-size: 20px;

    text-align: center;

    padding: 0;

    margin-bottom: 25px;
  }

  .new-button {
    font-size: 0;

    text-align: center;

    padding: 11px 4px;
  }

  .new-button::after {
    content: "+";

    font-size: 22px;
  }

  .nav button {
    font-size: 0;

    text-align: center;

    padding: 12px 4px;
  }

  .nav button::first-letter {
    font-size: 18px;
  }

  .topbar {
    padding: 0 17px;
  }

  .workspace {
    padding: 18px;
  }

  .create-grid {
    grid-template-columns: 1fr;
  }

  .document-page {
    min-height: 700px;

    padding: 38px 25px;
  }

  .slide-canvas {
    padding: 35px;

    font-size: 23px;
  }

  .slide-canvas h1 {
    font-size: 35px;
  }

  .editor-toolbar {
    overflow-x: auto;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      Clamme.
    </div>

    <button
      class="new-button"
      id="newButton"
      onclick="createCurrent()"
    >
      + New document
    </button>

    <nav class="nav">

      <button
        id="nav-home"
        onclick="goHome()"
      >
        Home
      </button>

      <button
        id="nav-docs"
        onclick="openSection('docs')"
      >
        Docs
      </button>

      <button
        id="nav-slides"
        onclick="openSection('slides')"
      >
        Slides
      </button>

      <button
        id="nav-sheets"
        onclick="openSection('sheets')"
      >
        Sheets
      </button>

    </nav>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div
        class="page-title"
        id="pageTitle"
      >
        Home
      </div>

    </header>


    <section
      class="workspace"
      id="workspace"
    ></section>

  </main>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================================
   CORE
========================================================= */

const BASE = "/Clamme/";

let currentSection = "home";

let currentSlide = 0;

let slides = [];


/* =========================================================
   SERVICE WORKER
========================================================= */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register(BASE + "sw.js", {
        scope: BASE
      })
      .catch(error => {
        console.error(
          "Clamme service worker:",
          error
        );
      });

  });

}


/* =========================================================
   NAVIGATION
========================================================= */

function setActive(section) {

  document
    .querySelectorAll(".nav button")
    .forEach(button => {
      button.classList.remove("active");
    });

  const button =
    document.getElementById(
      "nav-" + section
    );

  if (button) {
    button.classList.add("active");
  }

}


function updateNewButton() {

  const button =
    document.getElementById("newButton");

  if (currentSection === "slides") {

    button.textContent =
      "+ New presentation";

  }

  else if (currentSection === "sheets") {

    button.textContent =
      "+ New spreadsheet";

  }

  else {

    button.textContent =
      "+ New document";

  }

}


function goHome() {

  currentSection = "home";

  setActive("home");

  updateNewButton();

  document.getElementById("pageTitle").textContent =
    "Home";

  renderHome();

}


function openSection(section) {

  currentSection = section;

  setActive(section);

  updateNewButton();

  if (section === "docs") {

    document.getElementById("pageTitle").textContent =
      "Docs";

    renderDocs();

  }

  else if (section === "slides") {

    document.getElementById("pageTitle").textContent =
      "Slides";

    renderSlides();

  }

  else if (section === "sheets") {

    document.getElementById("pageTitle").textContent =
      "Sheets";

    renderSheets();

  }

}


/* =========================================================
   HOME
========================================================= */

function renderHome() {

  document.getElementById("workspace").innerHTML = `

    <div class="home">

      <div class="home-header">

        <h1>Clamme.</h1>

        <div class="home-rule"></div>

      </div>


      <div class="create-grid">

        <button
          class="create-card"
          onclick="newDocument()"
        >

          <span class="create-card-title">
            Document
          </span>

          <span class="create-card-description">
            Write, edit and format.
          </span>

        </button>


        <button
          class="create-card"
          onclick="newPresentation()"
        >

          <span class="create-card-title">
            Presentation
          </span>

          <span class="create-card-description">
            Build polished presentations.
          </span>

        </button>


        <button
          class="create-card"
          onclick="newSpreadsheet()"
        >

          <span class="create-card-title">
            Spreadsheet
          </span>

          <span class="create-card-description">
            Organize and calculate.
          </span>

        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   DOCS
========================================================= */

function renderDocs() {

  const saved =
    localStorage.getItem(
      "clamme-document"
    ) || "";

  document.getElementById("workspace").innerHTML = `

    <div class="editor-shell">

      <div class="editor-toolbar">

        <div class="toolbar-group">

          <button
            class="tool"
            onclick="docCommand('bold')"
          >
            Bold
          </button>

          <button
            class="tool"
            onclick="docCommand('italic')"
          >
            Italic
          </button>

          <button
            class="tool"
            onclick="docCommand('underline')"
          >
            Underline
          </button>

        </div>


        <div class="toolbar-divider"></div>


        <div class="toolbar-group">

          <button
            class="tool"
            onclick="docCommand('formatBlock','h1')"
          >
            Title
          </button>

          <button
            class="tool"
            onclick="docCommand('formatBlock','h2')"
          >
            Heading
          </button>

          <button
            class="tool"
            onclick="docCommand('formatBlock','p')"
          >
            Text
          </button>

        </div>


        <div class="toolbar-divider"></div>


        <button
          class="tool"
          onclick="printDocument()"
        >
          Print
        </button>

      </div>


      <div class="docs-area">

        <article
          id="documentPage"
          class="document-page"
          contenteditable="true"
          spellcheck="true"
        >${saved}</article>

      </div>

    </div>

  `;


  const page =
    document.getElementById(
      "documentPage"
    );

  page.addEventListener(
    "input",
    saveDocument
  );

}


function docCommand(
  command,
  value = null
) {

  document.execCommand(
    command,
    false,
    value
  );

  saveDocument();

}


function saveDocument() {

  const page =
    document.getElementById(
      "documentPage"
    );

  if (!page) return;

  localStorage.setItem(
    "clamme-document",
    page.innerHTML
  );

}


function printDocument() {

  const page =
    document.getElementById(
      "documentPage"
    );

  if (!page) return;

  const windowPrint =
    window.open(
      "",
      "_blank"
    );

  windowPrint.document.write(`

    <!DOCTYPE html>

    <html>

      <head>

        <title>Clamme Document</title>

        <style>

          body {
            font-family: Georgia, serif;
            padding: 60px;
            line-height: 1.7;
          }

        </style>

      </head>

      <body>

        ${page.innerHTML}

      </body>

    </html>

  `);

  windowPrint.document.close();

  windowPrint.focus();

  windowPrint.print();

}


/* =========================================================
   SLIDES
========================================================= */

function loadSlides() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          "clamme-slides"
        )
      );

    if (
      Array.isArray(saved) &&
      saved.length
    ) {

      slides = saved;

    }

    else {

      slides = [""];

    }

  }

  catch {

    slides = [""];

  }

}


function saveSlides() {

  localStorage.setItem(
    "clamme-slides",
    JSON.stringify(slides)
  );

}


function renderSlides() {

  loadSlides();

  if (
    currentSlide >= slides.length
  ) {

    currentSlide =
      slides.length - 1;

  }

  document.getElementById("workspace").innerHTML = `

    <div class="slides-shell">

      <div class="slides-toolbar">

        <div class="slides-actions">

          <button
            class="tool"
            onclick="addSlide()"
          >
            New slide
          </button>

          <button
            class="tool"
            onclick="duplicateSlide()"
          >
            Duplicate
          </button>

          <button
            class="tool"
            onclick="deleteSlide()"
          >
            Delete
          </button>

          <button
            class="tool"
            onclick="presentSlides()"
          >
            Present
          </button>

        </div>


        <div
          class="slide-count"
          id="slideCount"
        ></div>

      </div>


      <div class="slide-layout">

        <aside
          class="slide-sidebar"
          id="slideSidebar"
        ></aside>


        <div class="slide-stage">

          <article
            id="slideCanvas"
            class="slide-canvas"
            contenteditable="true"
            spellcheck="true"
          ></article>

        </div>

      </div>

    </div>

  `;


  renderSlideThumbnails();

  renderCurrentSlide();


  document
    .getElementById("slideCanvas")
    .addEventListener(
      "input",
      () => {

        slides[currentSlide] =
          document.getElementById(
            "slideCanvas"
          ).innerHTML;

        saveSlides();

        renderSlideThumbnails();

      }
    );

}


function renderSlideThumbnails() {

  const sidebar =
    document.getElementById(
      "slideSidebar"
    );

  if (!sidebar) return;

  sidebar.innerHTML = "";

  slides.forEach(
    (content, index) => {

      const thumbnail =
        document.createElement(
          "button"
        );

      thumbnail.className =
        "slide-thumbnail" +
        (
          index === currentSlide
            ? " active"
            : ""
        );

      thumbnail.innerHTML = `

        <div>
          ${content || " "}
        </div>

        <span class="thumbnail-number">
          ${index + 1}
        </span>

      `;

      thumbnail.onclick = () => {

        currentSlide = index;

        renderSlides();

      };

      sidebar.appendChild(
        thumbnail
      );

    }
  );


  const counter =
    document.getElementById(
      "slideCount"
    );

  if (counter) {

    counter.textContent =
      `${currentSlide + 1} / ${slides.length}`;

  }

}


function renderCurrentSlide() {

  const canvas =
    document.getElementById(
      "slideCanvas"
    );

  if (!canvas) return;

  canvas.innerHTML =
    slides[currentSlide] || "";

}


function addSlide() {

  slides.splice(
    currentSlide + 1,
    0,
    ""
  );

  currentSlide++;

  saveSlides();

  renderSlides();

}


function duplicateSlide() {

  slides.splice(
    currentSlide + 1,
    0,
    slides[currentSlide]
  );

  currentSlide++;

  saveSlides();

  renderSlides();

}


function deleteSlide() {

  if (slides.length === 1) {

    slides[0] = "";

    currentSlide = 0;

  }

  else {

    slides.splice(
      currentSlide,
      1
    );

    currentSlide =
      Math.max(
        0,
        currentSlide - 1
      );

  }

  saveSlides();

  renderSlides();

}


function presentSlides() {

  const canvas =
    document.getElementById(
      "slideCanvas"
    );

  if (!canvas) return;

  canvas.requestFullscreen?.();

}


/* =========================================================
   SHEETS
========================================================= */

const SHEET_ROWS = 30;

const SHEET_COLUMNS = 12;


function columnName(index) {

  let name = "";

  let number = index + 1;

  while (number > 0) {

    const remainder =
      (number - 1) % 26;

    name =
      String.fromCharCode(
        65 + remainder
      ) + name;

    number =
      Math.floor(
        (number - 1) / 26
      );

  }

  return name;

}


function sheetKey(
  row,
  column
) {

  return `clamme-sheet-${row}-${column}`;

}


function renderSheets() {

  let table = `

    <div class="sheets-shell">

      <div class="sheet-toolbar">

        <input
          id="cellName"
          class="cell-name"
          readonly
          placeholder="A1"
        >

        <input
          id="formulaInput"
          class="formula-input"
          placeholder="Formula or value"
        >

      </div>


      <div class="sheet-frame">

        <table class="sheet-table">

          <thead>

            <tr>

              <th></th>

  `;


  for (
    let column = 0;
    column < SHEET_COLUMNS;
    column++
  ) {

    table += `
      <th>
        ${columnName(column)}
      </th>
    `;

  }


  table += `

            </tr>

          </thead>

          <tbody>

  `;


  for (
    let row = 0;
    row < SHEET_ROWS;
    row++
  ) {

    table += `

      <tr>

        <th>
          ${row + 1}
        </th>

    `;


    for (
      let column = 0;
      column < SHEET_COLUMNS;
      column++
    ) {

      const key =
        sheetKey(
          row,
          column
        );

      const value =
        localStorage.getItem(
          key
        ) || "";

      table += `

        <td
          contenteditable="true"
          data-row="${row}"
          data-column="${column}"
          data-key="${key}"
        >${escapeHTML(value)}</td>

      `;

    }


    table += `

      </tr>

    `;

  }


  table += `

          </tbody>

        </table>

      </div>

    </div>

  `;


  document.getElementById("workspace").innerHTML =
    table;


  document
    .querySelectorAll(
      ".sheet-table td"
    )
    .forEach(cell => {

      cell.addEventListener(
        "focus",
        () => {

          document
            .querySelectorAll(
              ".sheet-table td"
            )
            .forEach(c =>
              c.classList.remove(
                "selected"
              )
            );

          cell.classList.add(
            "selected"
          );

          const row =
            Number(
              cell.dataset.row
            );

          const column =
            Number(
              cell.dataset.column
            );

          document.getElementById(
            "cellName"
          ).value =
            `${columnName(column)}${row + 1}`;

          document.getElementById(
            "formulaInput"
          ).value =
            cell.textContent;

        }
      );


      cell.addEventListener(
        "input",
        () => {

          localStorage.setItem(
            cell.dataset.key,
            cell.textContent
          );

        }
      );


      cell.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            const row =
              Number(
                cell.dataset.row
              );

            const column =
              Number(
                cell.dataset.column
              );

            const next =
              document.querySelector(
                `td[data-row="${row + 1}"][data-column="${column}"]`
              );

            if (next) {

              next.focus();

            }

          }

        }
      );

    });


  document
    .getElementById(
      "formulaInput"
    )
    .addEventListener(
      "input",
      event => {

        const active =
          document.querySelector(
            ".sheet-table td.selected"
          );

        if (!active) return;

        active.textContent =
          event.target.value;

        localStorage.setItem(
          active.dataset.key,
          active.textContent
        );

      }
    );

}


function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   NEW ACTIONS
========================================================= */

function createCurrent() {

  if (
    currentSection === "slides"
  ) {

    newPresentation();

    return;

  }


  if (
    currentSection === "sheets"
  ) {

    newSpreadsheet();

    return;

  }


  newDocument();

}


function newDocument() {

  currentSection = "docs";

  localStorage.removeItem(
    "clamme-document"
  );

  setActive("docs");

  updateNewButton();

  document.getElementById(
    "pageTitle"
  ).textContent = "Docs";

  renderDocs();

}


function newPresentation() {

  currentSection = "slides";

  slides = [""];

  currentSlide = 0;

  saveSlides();

  setActive("slides");

  updateNewButton();

  document.getElementById(
    "pageTitle"
  ).textContent = "Slides";

  renderSlides();

}


function newSpreadsheet() {

  currentSection = "sheets";

  setActive("sheets");

  updateNewButton();

  document.getElementById(
    "pageTitle"
  ).textContent = "Sheets";

  renderSheets();

}


/* =========================================================
   TOAST
========================================================= */

function toast(message) {

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

  clearTimeout(
    window.clammeToast
  );

  window.clammeToast =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      2400
    );

}
