<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clamme</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --black:#030705;
  --deep:#06100b;
  --surface:#091811;
  --surface2:#0d2117;
  --surface3:#112d20;

  --emerald:#185c3b;
  --emerald2:#20764b;
  --emerald3:#2b9561;
  --emerald-soft:#5ec38a;

  --line:#173a28;
  --line-bright:#27563d;

  --text:#f2f8f4;
  --muted:#91aa9c;
  --dim:#5f7569;

  --paper:#fbfdfb;
  --ink:#152019;
}

*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:"Alegreya",serif;
  background:var(--black);
  color:var(--text);
  overflow:hidden;
}

button,
input,
select,
textarea{
  font-family:"Alegreya",serif;
}

button{
  cursor:pointer;
}

/* ================================
   APP
================================ */

.app{
  width:100%;
  height:100vh;
  display:flex;
  background:var(--black);
}

/* ================================
   SIDEBAR
================================ */

.sidebar{
  width:225px;
  flex-shrink:0;

  padding:24px 14px;

  background:
    linear-gradient(
      180deg,
      #091a11 0%,
      #06100b 100%
    );

  border-right:1px solid var(--line);

  display:flex;
  flex-direction:column;
}

.brand{
  padding:0 12px 28px;

  font-size:30px;
  font-weight:600;
  letter-spacing:-.7px;
}

.brand span{
  color:var(--emerald-soft);
}

.new-button{
  height:42px;
  width:100%;

  border:1px solid var(--emerald2);

  background:
    linear-gradient(
      180deg,
      var(--emerald2),
      var(--emerald)
    );

  color:white;

  border-radius:6px;

  font-size:17px;

  box-shadow:
    0 5px 18px rgba(0,80,45,.18);
}

.new-button:hover{
  background:var(--emerald3);
  border-color:var(--emerald-soft);
}

.nav{
  margin-top:24px;

  display:flex;
  flex-direction:column;
  gap:3px;
}

.nav button{
  width:100%;

  padding:10px 13px;

  background:transparent;
  border:0;

  color:var(--muted);

  text-align:left;

  font-size:17px;

  border-left:2px solid transparent;

  transition:.15s;
}

.nav button:hover{
  color:var(--text);
  background:rgba(30,105,65,.13);
}

.nav button.active{
  color:white;

  background:
    linear-gradient(
      90deg,
      rgba(31,111,69,.34),
      rgba(31,111,69,.06)
    );

  border-left-color:var(--emerald-soft);
}

.sidebar-footer{
  margin-top:auto;

  padding:12px;

  color:var(--dim);

  font-size:14px;
}

/* ================================
   MAIN
================================ */

.main{
  min-width:0;
  flex:1;

  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  flex-shrink:0;

  padding:0 20px;

  display:flex;
  align-items:center;

  background:#07130d;

  border-bottom:1px solid var(--line);
}

.title{
  font-size:21px;
  font-weight:500;
}

.top-actions{
  margin-left:auto;

  display:flex;
  gap:5px;
}

.top-button{
  padding:6px 10px;

  background:transparent;

  border:1px solid var(--line);

  color:var(--muted);

  border-radius:4px;
}

.top-button:hover{
  color:white;
  border-color:var(--line-bright);
  background:var(--surface2);
}

/* ================================
   WORKSPACE
================================ */

.workspace{
  min-height:0;
  flex:1;
  overflow:auto;

  background:
    radial-gradient(
      circle at 85% 0%,
      rgba(38,125,78,.11),
      transparent 35%
    ),
    var(--deep);
}

/* ================================
   HOME
================================ */

.home{
  width:min(1050px,100%);
  margin:auto;

  padding:70px 45px;
}

.hero{
  margin-bottom:55px;
}

.hero h1{
  margin:0;

  font-size:52px;
  font-weight:500;

  letter-spacing:-1.7px;
}

.hero h1 span{
  color:var(--emerald-soft);
}

.hero p{
  margin:6px 0 0;

  color:var(--muted);

  font-size:20px;
}

.create-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.create-card{
  min-height:165px;

  padding:25px;

  background:
    linear-gradient(
      145deg,
      rgba(23,92,59,.20),
      rgba(8,24,16,.10)
    );

  color:white;

  border:0;

  text-align:left;

  transition:.18s;
}

.create-card + .create-card{
  border-left:1px solid var(--line);
}

.create-card:hover{
  background:
    linear-gradient(
      145deg,
      rgba(29,118,74,.30),
      rgba(8,24,16,.15)
    );
}

.create-card-title{
  font-size:27px;
}

.create-card-desc{
  margin-top:4px;
  color:var(--muted);
  font-size:16px;
}

.workspace-heading{
  margin-top:55px;
  margin-bottom:14px;

  font-size:23px;
}

/* ================================
   FILES
================================ */

.file-list{
  border-top:1px solid var(--line);
}

.file-row{
  display:grid;
  grid-template-columns:1fr 150px 130px;

  align-items:center;

  min-height:48px;

  padding:7px 10px;

  border-bottom:1px solid var(--line);
}

.file-name{
  font-size:18px;
  cursor:pointer;
}

.file-name:hover{
  color:var(--emerald-soft);
}

.file-type{
  color:var(--muted);
}

.file-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.file-actions button{
  border:0;
  background:transparent;
  color:var(--muted);
}

.file-actions button:hover{
  color:white;
}

/* ================================
   EMPTY
================================ */

.empty{
  min-height:300px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:var(--muted);

  text-align:center;
}

.empty h2{
  margin:0 0 4px;

  color:white;

  font-size:29px;
  font-weight:500;
}

/* ================================
   EDITOR SHELL
================================ */

.editor{
  height:100%;

  display:flex;
  flex-direction:column;
}

.toolbar{
  min-height:50px;
  flex-shrink:0;

  display:flex;
  align-items:center;

  gap:2px;

  padding:7px 12px;

  background:#08150e;

  border-bottom:1px solid var(--line);

  overflow-x:auto;
}

.tool{
  height:32px;
  min-width:34px;

  padding:0 9px;

  border:1px solid transparent;

  background:transparent;

  color:var(--muted);

  border-radius:4px;

  font-size:15px;
}

.tool:hover{
  color:white;

  border-color:var(--line);

  background:var(--surface2);
}

.tool.primary{
  color:white;

  background:var(--emerald);

  border-color:var(--emerald2);
}

.tool.primary:hover{
  background:var(--emerald2);
}

.select{
  height:32px;

  background:var(--surface);

  border:1px solid var(--line);

  color:var(--text);

  border-radius:4px;

  padding:0 9px;
}

/* ================================
   DOCUMENT
================================ */

.document-space{
  flex:1;
  overflow:auto;

  padding:50px;

  background:
    linear-gradient(
      135deg,
      rgba(23,92,59,.04),
      transparent 40%
    );
}

.document{
  width:794px;
  min-height:1123px;

  margin:auto;

  padding:76px 82px;

  background:var(--paper);

  color:var(--ink);

  outline:none;

  box-shadow:
    0 25px 80px rgba(0,0,0,.42);
}

.document:empty:before{
  content:"Start writing…";
  color:#a3ada7;
}

.document p{
  margin:0 0 12px;

  font-size:18px;
  line-height:1.7;
}

.document h1{
  font-size:40px;
}

.document h2{
  font-size:29px;
}

.document h3{
  font-size:23px;
}

/* ================================
   SLIDES
================================ */

.slides-layout{
  min-height:0;
  flex:1;

  display:flex;
}

.slide-sidebar{
  width:175px;
  flex-shrink:0;

  padding:13px;

  background:#07130d;

  border-right:1px solid var(--line);

  overflow:auto;
}

.slide-sidebar-top{
  display:flex;
  gap:4px;

  margin-bottom:13px;
}

.slide-sidebar-top button{
  flex:1;

  height:32px;

  background:transparent;

  border:1px solid var(--line);

  color:var(--muted);

  border-radius:4px;
}

.slide-sidebar-top button:hover{
  color:white;
  background:var(--surface2);
}

.thumbnail{
  width:100%;

  aspect-ratio:16/9;

  margin-bottom:10px;

  padding:7px;

  background:var(--paper);

  color:var(--ink);

  border:2px solid transparent;

  overflow:hidden;

  text-align:left;

  font-size:10px;

  font-family:"Alegreya",serif;
}

.thumbnail.active{
  border-color:var(--emerald-soft);

  box-shadow:
    0 0 0 1px var(--emerald);
}

.slide-stage{
  min-width:0;
  flex:1;

  overflow:auto;

  padding:45px;

  display:flex;
  align-items:flex-start;
  justify-content:center;
}

.slide{
  width:min(1000px,85vw);

  aspect-ratio:16/9;

  padding:70px;

  background:var(--paper);

  color:var(--ink);

  outline:none;

  font-size:30px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.42);
}

.slide:empty:before{
  content:"Start your presentation…";
  color:#a3ada7;
}

/* ================================
   SHEETS
================================ */

.sheet{
  height:100%;

  display:flex;
  flex-direction:column;
}

.sheet-toolbar{
  min-height:48px;

  display:flex;
  align-items:center;

  padding:7px 12px;

  border-bottom:1px solid var(--line);

  background:#08150e;
}

.formula-bar{
  height:42px;
  flex-shrink:0;

  display:flex;

  border-bottom:1px solid var(--line);

  background:#06100b;
}

.cell-reference{
  width:75px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--emerald-soft);

  border-right:1px solid var(--line);

  font-size:16px;
}

.formula-input{
  min-width:0;
  flex:1;

  padding:0 12px;

  background:transparent;

  border:0;
  outline:none;

  color:white;

  font-size:16px;
}

.sheet-scroll{
  min-height:0;
  flex:1;

  overflow:auto;
}

.sheet-table{
  border-collapse:collapse;

  min-width:100%;
}

.sheet-table th,
.sheet-table td{
  height:32px;

  min-width:110px;

  padding:4px 8px;

  border-right:1px solid #183324;
  border-bottom:1px solid #183324;
}

.sheet-table th{
  position:sticky;
  top:0;
  z-index:3;

  background:#0b1b12;

  color:var(--muted);

  font-weight:500;

  text-align:center;
}

.sheet-table .row-number{
  position:sticky;
  left:0;
  z-index:4;

  width:48px;
  min-width:48px;

  background:#0b1b12;
}

.sheet-table td{
  background:#050b07;

  color:white;

  outline:none;
}

.sheet-table td:focus{
  background:#0c2116;

  box-shadow:
    inset 0 0 0 1px var(--emerald-soft);
}

.sheet-table td.formula-result{
  color:var(--emerald-soft);
}

/* ================================
   MODALS
================================ */

.overlay{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.76);

  z-index:100;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(440px,90vw);

  padding:25px;

  background:
    linear-gradient(
      145deg,
      #0c2116,
      #07100b
    );

  border:1px solid var(--line-bright);

  box-shadow:
    0 30px 90px rgba(0,0,0,.55);
}

.modal h2{
  margin:0 0 18px;

  font-size:25px;
  font-weight:500;
}

.modal-input{
  width:100%;
  height:42px;

  padding:0 11px;

  background:#040906;

  border:1px solid var(--line-bright);

  color:white;

  outline:none;

  font-size:17px;
}

.modal-input:focus{
  border-color:var(--emerald-soft);
}

.modal-actions{
  margin-top:18px;

  display:flex;
  justify-content:flex-end;

  gap:6px;
}

.modal-actions button{
  padding:7px 13px;

  border:0;

  background:transparent;

  color:var(--muted);
}

.modal-actions button:hover{
  color:white;
}

.modal-actions .primary{
  color:white;
  background:var(--emerald);
  border:1px solid var(--emerald2);
}

/* ================================
   COMMAND
================================ */

.command{
  width:min(620px,90vw);
}

.command-list{
  max-height:330px;
  overflow:auto;

  margin-top:8px;
}

.command-item{
  padding:10px;

  color:var(--muted);

  cursor:pointer;
}

.command-item:hover{
  color:white;
  background:var(--surface2);
}

/* ================================
   TOAST
================================ */

.toast{
  position:fixed;

  left:50%;
  bottom:22px;

  transform:translate(-50%,12px);

  padding:8px 14px;

  background:#0b2116;

  border:1px solid var(--line-bright);

  color:white;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================================
   RESPONSIVE
================================ */

@media(max-width:760px){

  .sidebar{
    width:64px;
    padding:18px 7px;
  }

  .brand{
    padding:0 0 25px;
    text-align:center;
    font-size:0;
  }

  .brand span{
    font-size:27px;
  }

  .new-button{
    font-size:0;
  }

  .new-button:after{
    content:"+";
    font-size:24px;
  }

  .nav button{
    font-size:0;
    text-align:center;
    border-left:0;
  }

  .nav button:first-letter{
    font-size:20px;
  }

  .sidebar-footer{
    display:none;
  }

  .home{
    padding:45px 20px;
  }

  .hero h1{
    font-size:39px;
  }

  .create-grid{
    grid-template-columns:1fr;
  }

  .create-card{
    min-height:110px;
  }

  .create-card + .create-card{
    border-left:0;
    border-top:1px solid var(--line);
  }

  .document-space{
    padding:20px;
  }

  .document{
    width:100%;
    min-height:900px;
    padding:45px 30px;
  }

  .slide-sidebar{
    width:110px;
  }

  .slide-stage{
    padding:20px;
  }

  .slide{
    width:95vw;
    padding:35px;
  }

  .file-row{
    grid-template-columns:1fr 90px;
  }

  .file-type{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

  <div class="brand">
    clamme<span>.</span>
  </div>

  <button
    class="new-button"
    onclick="newDocument()"
  >
    New
  </button>

  <nav class="nav">

    <button
      id="navHome"
      class="active"
      onclick="goHome()"
    >
      Home
    </button>

    <button
      id="navDocs"
      onclick="showFiles('doc')"
    >
      Docs
    </button>

    <button
      id="navSlides"
      onclick="showFiles('slide')"
    >
      Slides
    </button>

    <button
      id="navSheets"
      onclick="showFiles('sheet')"
    >
      Sheets
    </button>

  </nav>

  <div class="sidebar-footer">
    Clamme
  </div>

</aside>

<!-- MAIN -->

<main class="main">

  <header class="topbar">

    <div
      id="pageTitle"
      class="title"
    >
      Home
    </div>

    <div class="top-actions">

      <button
        class="top-button"
        onclick="openCommands()"
      >
        Ctrl K
      </button>

    </div>

  </header>

  <section
    id="workspace"
    class="workspace"
  ></section>

</main>

</div>

<!-- FILE MODAL -->

<div
  id="fileModal"
  class="overlay"
>

  <div class="modal">

    <h2 id="modalHeading">
      New document
    </h2>

    <input
      id="fileInput"
      class="modal-input"
      autocomplete="off"
    >

    <div class="modal-actions">

      <button onclick="closeFileModal()">
        Cancel
      </button>

      <button
        class="primary"
        onclick="confirmFileModal()"
      >
        Create
      </button>

    </div>

  </div>

</div>

<!-- COMMAND MODAL -->

<div
  id="commandModal"
  class="overlay"
>

  <div class="modal command">

    <input
      id="commandInput"
      class="modal-input"
      placeholder="Search commands..."
      oninput="filterCommands()"
    >

    <div
      id="commandList"
      class="command-list"
    ></div>

  </div>

</div>

<div
  id="toast"
  class="toast"
></div>

<script>
/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY="clamme_smart_luxury_v2";

let state=
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || {
    files:[]
  };

let currentFile=null;

let pendingType="doc";
let pendingAction="create";
let pendingRename=null;

let activeSlide=0;

let selectedCell=null;

let rowCount=30;
let columnCount=10;

function saveState(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );
}

function toast(message){

  const el=
    document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=
    setTimeout(
      ()=>el.classList.remove("show"),
      1400
    );
}

/* =========================================================
   NAV
========================================================= */

function setNav(id){

  document
    .querySelectorAll(".nav button")
    .forEach(
      b=>b.classList.remove("active")
    );

  document
    .getElementById(id)
    ?.classList.add("active");
}

/* =========================================================
   HOME
========================================================= */

function goHome(){

  currentFile=null;

  setNav("navHome");

  pageTitle.textContent="Home";

  workspace.innerHTML=`

    <div class="home">

      <div class="hero">

        <h1>
          Clamme<span>.</span>
        </h1>

        <p>
          A focused workspace for ideas, presentations and data.
        </p>

      </div>

      <div class="create-grid">

        <button
          class="create-card"
          onclick="createFile('doc')"
        >

          <div class="create-card-title">
            Document
          </div>

          <div class="create-card-desc">
            Write
          </div>

        </button>

        <button
          class="create-card"
          onclick="createFile('slide')"
        >

          <div class="create-card-title">
            Presentation
          </div>

          <div class="create-card-desc">
            Present
          </div>

        </button>

        <button
          class="create-card"
          onclick="createFile('sheet')"
        >

          <div class="create-card-title">
            Spreadsheet
          </div>

          <div class="create-card-desc">
            Calculate
          </div>

        </button>

      </div>

      <div class="workspace-heading">
        Workspace
      </div>

      ${
        state.files.length
        ?
        `
          <div class="file-list">
            ${
              state.files
                .slice()
                .reverse()
                .map(fileRow)
                .join("")
            }
          </div>
        `
        :
        `
          <div class="empty">
            <h2>Nothing here.</h2>
            <div>Your workspace is empty.</div>
          </div>
        `
      }

    </div>

  `;
}

/* =========================================================
   FILE LIST
========================================================= */

function typeName(type){

  return type==="doc"
    ?"Document"
    :type==="slide"
      ?"Presentation"
      :"Spreadsheet";
}

function fileRow(file){

  return`

    <div class="file-row">

      <div
        class="file-name"
        onclick="openFile('${file.id}')"
      >
        ${escapeHTML(file.name)}
      </div>

      <div class="file-type">
        ${typeName(file.type)}
      </div>

      <div class="file-actions">

        <button
          onclick="renameFile('${file.id}')"
        >
          Rename
        </button>

        <button
          onclick="deleteFile('${file.id}')"
        >
          Delete
        </button>

      </div>

    </div>

  `;
}

function showFiles(type){

  currentFile=null;

  setNav(
    type==="doc"
      ?"navDocs"
      :type==="slide"
        ?"navSlides"
        :"navSheets"
  );

  pageTitle.textContent=
    typeName(type)+"s";

  const files=
    state.files.filter(
      f=>f.type===type
    );

  workspace.innerHTML=`

    <div class="home">

      <div
        class="workspace-heading"
        style="margin-top:0;font-size:34px"
      >
        ${typeName(type)}s
      </div>

      <div class="file-list">

        ${
          files.length
          ?
          files.map(fileRow).join("")
          :
          `
            <div class="empty">
              <h2>Nothing here.</h2>
              <div>
                Create your first ${typeName(type).toLowerCase()}.
              </div>
            </div>
          `
        }

      </div>

    </div>

  `;
}

/* =========================================================
   CREATE / RENAME
========================================================= */

function newDocument(){
  createFile("doc");
}

function createFile(type){

  pendingType=type;
  pendingAction="create";

  const names={
    doc:"Untitled document",
    slide:"Untitled presentation",
    sheet:"Untitled spreadsheet"
  };

  modalHeading.textContent=
    "New "+typeName(type).toLowerCase();

  fileInput.value=names[type];

  fileModal.classList.add("show");

  setTimeout(
    ()=>fileInput.select(),
    30
  );
}

function renameFile(id){

  const file=
    state.files.find(
      f=>f.id===id
    );

  if(!file)return;

  pendingAction="rename";
  pendingRename=id;

  modalHeading.textContent="Rename";

  fileInput.value=file.name;

  fileModal.classList.add("show");

  setTimeout(
    ()=>fileInput.select(),
    30
  );
}

function confirmFileModal(){

  const name=
    fileInput.value.trim()
    ||"Untitled";

  if(pendingAction==="rename"){

    const file=
      state.files.find(
        f=>f.id===pendingRename
      );

    if(file){
      file.name=name;
      file.updated=Date.now();
    }

    saveState();
    closeFileModal();

    if(currentFile)
      openFile(currentFile.id);
    else
      goHome();

    return;
  }

  const file={
    id:crypto.randomUUID(),
    name,
    type:pendingType,
    created:Date.now(),
    updated:Date.now()
  };

  if(pendingType==="doc"){
    file.content="";
  }

  if(pendingType==="slide"){

    file.slides=[
      {
        id:crypto.randomUUID(),
        content:""
      }
    ];

  }

  if(pendingType==="sheet"){
    file.cells={};
  }

  state.files.push(file);

  saveState();

  closeFileModal();

  openFile(file.id);
}

function closeFileModal(){

  fileModal.classList.remove("show");
}

/* =========================================================
   DELETE
========================================================= */

function deleteFile(id){

  const file=
    state.files.find(
      f=>f.id===id
    );

  if(!file)return;

  if(
    !confirm(
      `Delete "${file.name}"?`
    )
  )return;

  state.files=
    state.files.filter(
      f=>f.id!==id
    );

  saveState();

  showFiles(file.type);
}

/* =========================================================
   OPEN
========================================================= */

function openFile(id){

  currentFile=
    state.files.find(
      f=>f.id===id
    );

  if(!currentFile)return;

  pageTitle.textContent=
    currentFile.name;

  if(currentFile.type==="doc")
    renderDocument();

  if(currentFile.type==="slide")
    renderSlides();

  if(currentFile.type==="sheet")
    renderSpreadsheet();
}

/* =========================================================
   DOCUMENT EDITOR
========================================================= */

function renderDocument(){

  workspace.innerHTML=`

    <div class="editor">

      <div class="toolbar">

        <button
          class="tool"
          onclick="docFormat('bold')"
        >
          <b>B</b>
        </button>

        <button
          class="tool"
          onclick="docFormat('italic')"
        >
          <i>I</i>
        </button>

        <button
          class="tool"
          onclick="docFormat('underline')"
        >
          <u>U</u>
        </button>

        <select
          class="select"
          onchange="docFormat('formatBlock',this.value)"
        >

          <option value="p">
            Text
          </option>

          <option value="h1">
            Heading 1
          </option>

          </option>

        </select>

        <button
          class="tool"

        >
          Left
        </button>

        <button
          class="tool"
          onclick="docFormat('justifyCenter')"
        >
          Center
        </button>

        <button
          class="tool"
          onclick="docFormat('justifyRight')"
        >
          Right
        </button>

        <button
          class="tool"
          onclick="docFormat('insertUnorderedList')"
        >

        </button>

          class="tool"

          spellcheck="true"
        >${currentFile.content}</article>

      </div>

    </div>

  `;

  document
    .getElementById("documentEditor")
    .addEventListener(
      "input",
      saveDocument
    );
}

function docFormat(command,value=null){

  document.execCommand(
    command,
    false,
    value
  );

  document
    .getElementById(
      "documentEditor"
    )
    ?.focus();

  saveDocument();
}

function saveDocument(){

  const editor=
    document.getElementById(
      "documentEditor"
    );

  if(!editor||!currentFile)return;

  currentFile.content=
    editor.innerHTML;

  currentFile.updated=
    Date.now();

  saveState();
}

function printDocument(){

  const content=
    document.getElementById(
      "documentEditor"
    ).innerHTML;

  const win=
    window.open(
      "",
      "_blank"
    );

  win.document.write(`

    <!DOCTYPE html>

    <html>

      <title>${escapeHTML(currentFile.name)}</title>

        rel="stylesheet"
      >

          max-width:794px;
          margin:70px auto;
          color:#152019;
        }

      </style>

    </head>

    <body>
      ${content}
    </body>

    </html>

  `);

  win.print();
}

/* =========================================================
   SLIDES
========================================================= */

function renderSlides(){

  activeSlide=0;

  workspace.innerHTML=`

    <div class="editor">

      <div class="toolbar">

        <button
          class="tool primary"
          onclick="addSlide()"
        >
          + Slide
        </button>

        <button
          class="tool"
          onclick="duplicateSlide()"
        >
          Duplicate
        </button>

        <button
          class="tool"
          onclick="deleteSlide()"
        >
          Delete
        </button>

        <div style="flex:1"></div>

        <button
          class="tool"
          onclick="presentSlides()"
        >
          Present
        </button>

      </div>

      <div class="slides-layout">

        <aside class="slide-sidebar">

          <div class="slide-sidebar-top">

            <button onclick="addSlide()">
              +
            </button>

            <button onclick="duplicateSlide()">
              Copy
            </button>

          </div>

          <div id="thumbnails"></div>

        </aside>

        <main class="slide-stage">

          <article
            id="slideEditor"
            class="slide"
            contenteditable="true"
            spellcheck="true"
          ></article>

        </main>

      </div>

    </div>

  `;

  renderThumbnails();
  loadActiveSlide();

  document
    .getElementById("slideEditor")
    .addEventListener(
      "input",
      saveSlide
    );
}

function renderThumbnails(){

  thumbnails.innerHTML=
    currentFile.slides
      .map(
        (slide,index)=>`

          <button
            class="thumbnail ${
              index===activeSlide
                ?"active"
                :""
            }"
            onclick="selectSlide(${index})"
          >
            ${slide.content||""}
          </button>

        `
      )
      .join("");
}

function loadActiveSlide(){

  slideEditor.innerHTML=
    currentFile.slides[
      activeSlide
    ].content||"";
}

function saveSlide(){

  if(!currentFile)return;

  currentFile.slides[
    activeSlide
  ].content=
    slideEditor.innerHTML;

  currentFile.updated=
    Date.now();

  saveState();

  renderThumbnails();
}

function selectSlide(index){

  saveSlide();

  activeSlide=index;

  renderThumbnails();

  loadActiveSlide();
}

function addSlide(){

  saveSlide();

  currentFile.slides.push({
    id:crypto.randomUUID(),
    content:""
  });

  activeSlide=
    currentFile.slides.length-1;

  saveState();

  renderThumbnails();
  loadActiveSlide();
}

function duplicateSlide(){

  saveSlide();

  const copy=
    JSON.parse(
      JSON.stringify(
        currentFile.slides[
          activeSlide
        ]
      )
    );

  copy.id=crypto.randomUUID();

  currentFile.slides.splice(
    activeSlide+1,
    0,
    copy
  );

  activeSlide++;

  saveState();

  renderThumbnails();
  loadActiveSlide();
}

function deleteSlide(){

  if(
    currentFile.slides.length<=1
  ){

    toast("A presentation needs one slide");

    return;
  }

  currentFile.slides.splice(
    activeSlide,
    1
  );

  activeSlide=
    Math.max(
      0,
      activeSlide-1
    );

  saveState();

  renderThumbnails();
  loadActiveSlide();
}

function presentSlides(){

  saveSlide();

  const slides=
    currentFile.slides
      .map(
        s=>`
          <section class="presentation-slide">
            ${s.content}
          </section>
        `
      )
      .join("");

  const win=
    window.open(
      "",
      "_blank"
    );

  win.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <title>
        ${escapeHTML(currentFile.name)}
      </title>

      <link
        href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      >

      <style>

        *{
          box-sizing:border-box;
        }

        body{
          margin:0;
          background:#000;

          font-family:Alegreya,serif;
        }

        .presentation-slide{
          width:100vw;
          height:100vh;

          display:none;

          padding:8vw;

          background:#fbfdfb;
          color:#152019;

          font-size:3vw;
        }

        .presentation-slide:first-child{
          display:block;
        }

      </style>

    </head>

    <body>

      ${slides}

      <script>

        let i=0;

        const slides=
          document.querySelectorAll(
            ".presentation-slide"
          );

        function show(){

          slides.forEach(
            s=>s.style.display="none"
          );

          slides[i].style.display="block";

        }

        document.addEventListener(
          "keydown",
          e=>{

            if(e.key==="ArrowRight"){
              i=Math.min(
                i+1,
                slides.length-1
              );
              show();
            }

            if(e.key==="ArrowLeft"){
              i=Math.max(i-1,0);
              show();
            }

          }
        );

      <\/script>

    </body>

    </html>

  `);
}

/* =========================================================
   SPREADSHEET
========================================================= */

function columnName(number){

  let result="";

  while(number>=0){

    result=
      String.fromCharCode(
        (number%26)+65
      )+result;

    number=
      Math.floor(number/26)-1;
  }

  return result;
}

function renderSpreadsheet(){

  workspace.innerHTML=`

    <div class="sheet">

      <div class="sheet-toolbar">

        <button
          class="tool primary"
          onclick="addSheetRow()"
        >
          + Row
        </button>

        <button
          class="tool"
          onclick="addSheetColumn()"
        >
          + Column
        </button>

        <div style="flex:1"></div>

        <button
          class="tool"
          onclick="insertFormula('SUM')"
        >
          SUM
        </button>

        <button
          class="tool"
          onclick="insertFormula('AVERAGE')"
        >
          AVG
        </button>

      </div>

      <div class="formula-bar">

        <div
          id="cellReference"
          class="cell-reference"
        >
          A1
        </div>

        <input
          id="formulaInput"
          class="formula-input"
          placeholder="Value or formula..."
        >

      </div>

      <div class="sheet-scroll">

        <table class="sheet-table">

          <thead>

            <tr>

              <th class="row-number"></th>

              ${
                Array.from(
                  {length:columnCount},
                  (_,i)=>
                    `<th>${columnName(i)}</th>`
                ).join("")
              }

            </tr>

          </thead>

          <tbody
            id="sheetBody"
          ></tbody>

        </table>

      </div>

    </div>

  `;

  buildSheet();

  formulaInput.addEventListener(
    "keydown",
    formulaKey
  );
}

function buildSheet(){

  sheetBody.innerHTML="";

  for(
    let row=1;
    row<=rowCount;
    row++
  ){

    let html=`

      <tr>

        <th class="row-number">
          ${row}
        </th>

    `;

    for(
      let col=0;
      col<columnCount;
      col++
    ){

      const ref=
        columnName(col)+row;

      const raw=
        currentFile.cells[ref]??"";

      const display=
        calculateValue(raw);

      html+=`

        <td
          contenteditable="true"
          data-cell="${ref}"
        >${escapeHTML(String(display))}</td>

      `;

    }

    html+="</tr>";

    sheetBody.insertAdjacentHTML(
      "beforeend",
      html
    );
  }

  document
    .querySelectorAll(
      "[data-cell]"
    )
    .forEach(cell=>{

      cell.addEventListener(
        "focus",
        ()=>{
          selectCell(
            cell.dataset.cell
          );
        }
      );

      cell.addEventListener(
        "input",
        ()=>{
          currentFile.cells[
            cell.dataset.cell
          ]=cell.innerText;

          currentFile.updated=
            Date.now();

          saveState();
        }
      );

      cell.addEventListener(
        "blur",
        ()=>{
          buildSheet();
        }
      );

    });
}

function selectCell(ref){

  selectedCell=ref;

  cellReference.textContent=ref;

  formulaInput.value=
    currentFile.cells[ref]??"";
}

function formulaKey(event){

  if(event.key!=="Enter")
    return;

  if(!selectedCell)
    return;

  currentFile.cells[
    selectedCell
  ]=formulaInput.value;

  saveState();

  buildSheet();

  const cell=
    document.querySelector(
      `[data-cell="${selectedCell}"]`
    );

  cell?.focus();
}

function calculateValue(raw){

  if(
    typeof raw!=="string"
    ||!raw.startsWith("=")
  ){
    return raw;
  }

  return evaluateFormula(
    raw.substring(1)
  );
}

function evaluateFormula(formula){

  const range=
    formula.match(
      /^(SUM|AVERAGE|MIN|MAX)\(([A-Z]+)(\d+):([A-Z]+)(\d+)\)$/i
    );

  if(range){

    const fn=
      range[1].toUpperCase();

    const startCol=
      columnIndex(range[2]);

    const endCol=
      columnIndex(range[4]);

    const startRow=
      Number(range[3]);

    const endRow=
      Number(range[5]);

    let values=[];

    for(
      let row=startRow;
      row<=endRow;
      row++
    ){

      for(
        let col=startCol;
        col<=endCol;
        col++
      ){

        values.push(
          numericCell(
            columnName(col)+row
          )
        );

      }

    }

    if(fn==="SUM")
      return values.reduce(
        (a,b)=>a+b,
        0
      );

    if(fn==="AVERAGE")
      return values.length
        ?values.reduce(
          (a,b)=>a+b,
          0
        )/values.length
        :0;

    if(fn==="MIN")
      return Math.min(...values);

    if(fn==="MAX")
      return Math.max(...values);
  }

  try{

    let expression=
      formula.replace(
        /([A-Z]+)(\d+)/g,
        (_,col,row)=>
          numericCell(
            col+row
          )
      );

    if(
      !/^[0-9+\-*/().\s]+$/
        .test(expression)
    ){
      return "";
    }

    return Function(
      `"use strict";return (${expression})`
    )();

  }catch{

    return "";
  }
}

function numericCell(ref){

  const raw=
    currentFile.cells[ref];

  if(raw===undefined||raw==="")
    return 0;

  if(
    typeof raw==="string"
    &&raw.startsWith("=")
  ){
    const result=
      calculateValue(raw);

    return Number(result)||0;
  }

  return Number(raw)||0;
}

function columnIndex(value){

  let result=0;

  for(const char of value){

    result=
      result*26+
      char.charCodeAt(0)-64;

  }

  return result-1;
}

function insertFormula(type){

  if(!selectedCell){

    toast("Select a cell first");

    return;
  }

  currentFile.cells[
    selectedCell
  ]=
    `=${type}(A1:${columnName(columnCount-1)}${rowCount})`;

  saveState();

  buildSheet();

  toast("Formula added");
}

function addSheetRow(){

  rowCount++;

  buildSheet();
}

function addSheetColumn(){

  columnCount++;

  buildSheet();
}

/* =========================================================
   COMMAND PALETTE
========================================================= */

const commandsData=[

  [
    "New Document",
    ()=>createFile("doc")
  ],

  [
    "New Presentation",
    ()=>createFile("slide")
  ],

  [
    "New Spreadsheet",
    ()=>createFile("sheet")
  ],

  [
    "Home",
    goHome
  ],

  [
    "Docs",
    ()=>showFiles("doc")
  ],

  [
    "Slides",
    ()=>showFiles("slide")
  ],

  [
    "Sheets",
    ()=>showFiles("sheet")
  ]

];

function openCommands(){

  commandModal.classList.add("show");

  commandInput.value="";

  renderCommands();

  setTimeout(
    ()=>commandInput.focus(),
    20
  );
}

function renderCommands(filter=""){

  const visible=
    commandsData.filter(
      command=>
        command[0]
          .toLowerCase()
          .includes(
            filter.toLowerCase()
          )
    );

  commandList.innerHTML=
    visible.map(
      (command,index)=>`

        <div
          class="command-item"
          onclick="runCommand(${index})"
        >
          ${command[0]}
        </div>

      `
    ).join("");
}

function filterCommands(){

  renderCommands(
    commandInput.value
  );
}

function runCommand(index){

  const filter=
    commandInput.value
      .toLowerCase();

  const visible=
    commandsData.filter(
      command=>
        command[0]
          .toLowerCase()
          .includes(filter)
    );

  commandModal.classList.remove(
    "show"
  );

  visible[index]?.[1]();
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      (event.ctrlKey||event.metaKey)
      &&
      event.key.toLowerCase()==="k"
    ){

      event.preventDefault();

      openCommands();

    }

    if(
      (event.ctrlKey||event.metaKey)
      &&
      event.key.toLowerCase()==="s"
    ){

      event.preventDefault();

      saveState();

      toast("Saved");

    }

    if(event.key==="Escape"){

      fileModal.classList.remove(
        "show"
      );

      commandModal.classList.remove(
        "show"
      );

    }

  }
);

/* =========================================================
   FULLSCREEN
========================================================= */

function fullscreen(){

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen?.();

  }else{

    document
      .exitFullscreen?.();

  }
}

/* =========================================================
   UTILITIES
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================================================
   MODAL CLICK
========================================================= */

fileModal.addEventListener(
  "click",
  event=>{

    if(
      event.target===fileModal
    ){
      closeFileModal();
    }

  }
);

commandModal.addEventListener(
  "click",
  event=>{

    if(
      event.target===commandModal
    ){

      commandModal.classList.remove(
        "show"
      );

    }

  }
);

/* =========================================================
   START
========================================================= */

goHome();

</script>
