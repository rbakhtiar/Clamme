<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07100b">
<title>Clamme Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme:dark;
  --bg:#070c09;
  --panel:#0c1510;
  --panel2:#111d15;
  --panel3:#17271b;
  --line:#263b2c;
  --text:#edf5ee;
  --muted:#91a194;
  --green:#48bb76;
  --light:#a0e8b2;
  --gold:#c6aa72;
  --font:'Alegreya',serif;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 15% -15%,#1b563044,transparent 45%),
    radial-gradient(ellipse at 100% 100%,#173b2220,transparent 40%),
    var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
}

button,input,textarea,select{
  font-family:var(--font)!important;
  font-size:inherit;
}

button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible{
  outline:2px solid var(--green);
  outline-offset:2px;
}

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:235px minmax(0,1fr);
}

.sidebar{
  height:100vh;
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  padding:23px 14px 15px;
  background:#09100df2;
  border-right:1px solid var(--line);
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:5px 8px 28px;
}

.brand-star{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border:1px solid #438456;
  border-radius:13px;
  background:linear-gradient(145deg,#205a35,#0c2114);
  color:var(--light);
  font-size:27px;
  box-shadow:0 8px 25px #0006;
}

.brand-name{
  font-size:27px;
  font-weight:600;
  letter-spacing:.2px;
}

.brand-sub{
  color:#83a28a;
  font-size:11px;
  letter-spacing:2px;
}

.section-label{
  color:#75897a;
  font-size:12px;
  letter-spacing:2px;
  padding:12px;
}

.nav{display:grid;gap:5px}

.nav button,.side-button{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 13px;
  border-radius:10px;
  border:1px solid transparent;
  background:transparent;
  color:#a9b9ad;
  text-align:left;
  transition:.18s;
}

.nav button:hover,.side-button:hover{
  background:#ffffff0a;
  color:white;
}

.nav button.active{
  color:white;
  background:linear-gradient(100deg,#17452b,#102017);
  border-color:#376047;
}

.nav-icon{
  width:20px;
  text-align:center;
  color:#8ac69a;
  font-size:19px;
}

.push{flex:1}

.side-note{
  padding:16px;
  margin:15px 2px;
  border:1px solid #304a35;
  border-radius:14px;
  background:linear-gradient(145deg,#14291a,#0c1510);
}

.side-note .star{
  color:var(--light);
  font-size:21px;
}

.side-note h3{
  font-size:21px;
  font-weight:500;
  margin:8px 0 5px;
}

.side-note p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:0;
}

.status{
  border-top:1px solid var(--line);
  padding:15px 8px 3px;
  color:#91a294;
  font-size:12px;
}

.status span{color:var(--green)}

main{min-width:0}

.topbar{
  height:68px;
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 27px;
  border-bottom:1px solid #203126;
  background:#080f0bf2;
  backdrop-filter:blur(18px);
}

.crumb{color:#91a294}
.crumb strong{color:white;font-weight:600}

.actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.save-state{
  color:#9bac9f;
  font-size:12px;
  margin-right:8px;
}

.save-state:before{
  content:"●";
  color:var(--green);
  margin-right:7px;
}

.btn,.icon-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:9px 13px;
  border-radius:9px;
  color:#dce8de;
  background:#111d15;
  border:1px solid #304735;
  transition:.18s;
  white-space:nowrap;
}

.btn:hover,.icon-btn:hover{
  border-color:#5b9569;
  background:#192a1d;
}

.btn.primary{
  color:#f5fff6;
  border-color:#469b5e;
  background:linear-gradient(135deg,#318d50,#185c32);
}

.btn.primary:hover{
  background:linear-gradient(135deg,#3aa560,#21733e);
}

.btn.quiet{
  background:transparent;
  border-color:transparent;
  color:#a3b5a7;
}

.btn.danger{color:#e8a0a0}

.icon-btn{
  width:37px;
  height:37px;
  padding:0;
}

.content{
  max-width:1500px;
  margin:auto;
  padding:32px;
}

.eyebrow{
  color:#86d39a;
  font-size:12px;
  letter-spacing:2.5px;
  margin-bottom:10px;
}

.page-title{
  font-size:clamp(32px,4vw,47px);
  line-height:1.08;
  font-weight:500;
  margin:0;
}

.subtitle{
  color:#9aab9d;
  line-height:1.8;
  font-size:15px;
  max-width:650px;
  margin:10px 0 0;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin-bottom:26px;
}

.head-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.hero{
  position:relative;
  overflow:hidden;
  min-height:230px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  padding:36px;
  border:1px solid #345d3e;
  border-radius:20px;
  background:
    radial-gradient(ellipse at 85% 40%,#348c5038,transparent 42%),
    linear-gradient(120deg,#112b1b,#0b1510 70%);
  box-shadow:0 18px 55px #0002;
}

.hero h2{
  font-size:clamp(37px,4.5vw,54px);
  line-height:1.04;
  font-weight:500;
  margin:0;
}

.hero h2 em{
  color:var(--light);
  font-style:normal;
}

.hero p{
  color:#a5b6a8;
  max-width:500px;
  line-height:1.8;
  margin:14px 0 20px;
  font-size:15px;
}

.hero-mark{
  font-size:clamp(90px,13vw,155px);
  color:#91e5aa;
  text-shadow:0 0 50px #3eb16b55;
  padding:0 22px;
}

.hero-copy{z-index:1}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:30px 0 14px;
}

.section-title{
  font-size:25px;
  font-weight:500;
}

.muted{color:var(--muted);font-size:13px}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.quick-card{
  min-height:145px;
  padding:19px;
  text-align:left;
  color:var(--text);
  border:1px solid #2b4030;
  border-radius:15px;
  background:linear-gradient(145deg,#111d15,#0b120d);
  transition:.2s;
}

.quick-card:hover{
  transform:translateY(-3px);
  border-color:#568464;
  box-shadow:0 12px 30px #0003;
}

.quick-icon{
  display:grid;
  place-items:center;
  width:39px;
  height:39px;
  margin-bottom:14px;
  border-radius:11px;
  border:1px solid #376047;
  background:#153522;
  color:var(--light);
  font-size:20px;
}

.quick-card strong{
  display:block;
  font-size:23px;
  font-weight:500;
}

.quick-card small{
  display:block;
  color:#9aaa9d;
  margin-top:5px;
  line-height:1.6;
  font-size:13px;
}

.file-list{
  border:1px solid #2b4030;
  border-radius:14px;
  overflow:hidden;
}

.file-row{
  display:grid;
  grid-template-columns:40px minmax(0,1fr) auto auto;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  border-bottom:1px solid #203126;
  background:#0d1510;
}

.file-row:last-child{border-bottom:0}
.file-row:hover{background:#132019}

.file-icon{
  display:grid;
  place-items:center;
  width:37px;
  height:37px;
  border:1px solid #35513a;
  border-radius:10px;
  background:#13251a;
  color:#a0e8b2;
  font-size:18px;
}

.file-title{font-size:15px;font-weight:600}
.file-info{font-size:12px;color:#91a294;margin-top:3px}

.file-type{
  font-size:12px;
  color:#a4b6a8;
  border:1px solid #304333;
  padding:5px 8px;
  border-radius:6px;
}

.empty{
  padding:32px;
  color:#91a294;
  text-align:center;
  font-size:15px;
}

.editor{
  display:grid;
  grid-template-columns:210px minmax(0,1fr);
  min-height:520px;
  overflow:hidden;
  border:1px solid #2b4030;
  border-radius:16px;
  background:#0b120d;
}

.rail{
  padding:15px;
  border-right:1px solid #203126;
  background:#0c1510;
}

.rail-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#91a294;
  font-size:13px;
  margin-bottom:13px;
}

.rail-item{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  padding:10px;
  border:1px solid transparent;
  border-radius:9px;
  text-align:left;
  background:transparent;
  color:#b8c7ba;
  margin-bottom:5px;
}

.rail-item:hover{background:#142219}

.rail-item.active{
  background:#173322;
  border-color:#3b6546;
  color:white;
}

.rail-item .remove{
  margin-left:auto;
  color:#879789;
  padding:0 3px;
}

.editor-main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  padding:12px;
  border-bottom:1px solid #213126;
  background:#0d1711;
}

.toolbar .btn{padding:8px 11px}
.toolbar-spacer{flex:1}

select,.input{
  min-width:0;
  background:#111d15;
  color:#e1ebe2;
  border:1px solid #304735;
  border-radius:8px;
  padding:9px 11px;
}

.workspace{
  flex:1;
  min-width:0;
  padding:24px;
  overflow:auto;
}

.doc-paper{
  width:min(800px,100%);
  min-height:460px;
  margin:0 auto;
  padding:38px clamp(20px,5vw,68px) 50px;
  background:#f4f5ef;
  color:#263027;
  border:1px solid #e2e7de;
  box-shadow:0 20px 50px #0004;
}

.doc-title{
  width:100%;
  padding:0;
  margin-bottom:18px;
  background:transparent;
  border:0;
  outline:none;
  color:#1b2b20;
  font-size:36px;
  font-weight:600;
}

.doc-title:focus{outline:none}

.doc-body{
  min-height:320px;
  outline:none;
  font-size:18px;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.doc-body h1,.doc-body h2,.doc-body h3{line-height:1.2}
.doc-body:empty:before{
  content:"Start writing something worth keeping…";
  color:#a0a89f;
}

.slide-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:3px 3px 15px;
}

.slide-thumb{
  flex:0 0 130px;
  height:80px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:9px;
  border:1px solid #34483a;
  border-radius:8px;
  text-align:left;
  color:#203326;
  background:#e8eee5;
}

.slide-thumb.active{
  outline:2px solid #57c57b;
  outline-offset:1px;
}

.slide-thumb strong{
  font-size:16px;
  position:relative;
  z-index:1;
}

.slide-thumb small{
  margin-top:5px;
  position:relative;
  z-index:1;
  opacity:.7;
}

.slide-thumb img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.slide-thumb.has-image{color:white}

.slide-stage{
  position:relative;
  overflow:hidden;
  width:min(100%,1000px);
  margin:0 auto;
  aspect-ratio:16/9;
  background:#edf2e9;
  color:#1c3022;
  box-shadow:0 20px 55px #0005;
}

.slide-stage.has-image{color:white}

.slide-stage .slide-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.slide-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,#06130bd9,#06130b66);
}

.slide-copy{
  position:absolute;
  z-index:1;
  inset:0;
  padding:8%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.slide-heading{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:inherit;
  font-size:clamp(25px,4.5vw,55px);
  line-height:1.08;
  font-weight:600;
  resize:vertical;
  overflow:hidden;
}

.slide-body{
  width:100%;
  min-height:90px;
  margin-top:17px;
  padding:0;
  border:0;
  outline:0;
  background:transparent;
  color:inherit;
  font-size:clamp(15px,1.8vw,20px);
  line-height:1.65;
  resize:vertical;
}

.slide-body::placeholder{color:currentColor;opacity:.6}
.slide-hint{color:#91a294;font-size:12px;text-align:center;margin-top:14px}

.sheet-wrap{
  overflow:auto;
  border:1px solid #2b4030;
  border-radius:10px;
}

.sheet{
  border-collapse:collapse;
  min-width:750px;
  width:100%;
  table-layout:fixed;
  background:#0d1510;
}

.sheet th{
  height:35px;
  background:#15251a;
  color:#a4b9a8;
  font-size:13px;
  font-weight:600;
  border:1px solid #304333;
}

.sheet td{padding:0;border:1px solid #26382a}

.sheet td input{
  width:100%;
  height:36px;
  padding:6px 8px;
  border:0;
  border-radius:0;
  outline:none;
  background:transparent;
  color:#e0e9e1;
  font-size:14px;
}

.sheet td input:focus{
  outline:1px solid #53b875;
  outline-offset:-1px;
  background:#16271b;
}

.sheet td input.formula{color:#a0e5b4}

.sheet td input.header-cell{
  background:#101e14;
  color:#a6d9b0;
  font-weight:700;
}

.formula-bar{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}

.formula-bar label{color:#a7b9aa;min-width:35px}
.formula-bar input{flex:1;min-width:0}

.search-input{
  width:100%;
  max-width:600px;
  padding:13px;
}

.notice{
  padding:13px;
  border:1px solid #304633;
  background:#112017;
  border-radius:10px;
  color:#c2d2c5;
}

.toast{
  position:fixed;
  z-index:30;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:#183323;
  border:1px solid #477b53;
  color:#e5f8e9;
  border-radius:10px;
  padding:12px 18px;
  box-shadow:0 12px 35px #0008;
  font-size:15px;
}

.hidden{display:none!important}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;
    left:-260px;
    width:245px;
    transition:left .2s;
    box-shadow:15px 0 45px #0007;
  }
  .sidebar.open{left:0}
  .topbar{padding:0 16px}
  .content{padding:22px 16px}
  .editor{grid-template-columns:1fr}
  .rail{
    border-right:0;
    border-bottom:1px solid #203126;
  }
  .rail-items{
    display:flex;
    overflow-x:auto;
    gap:5px;
  }
  .rail-item{width:auto;white-space:nowrap}
}

@media(max-width:600px){
  .save-state{display:none}
  .topbar{height:61px}
  .hero{padding:23px}
  .hero-mark{display:none}
  .quick-grid{grid-template-columns:1fr}
  .quick-card{min-height:115px}
  .page-head{align-items:flex-start;flex-direction:column}
  .file-row{grid-template-columns:38px minmax(0,1fr) auto}
  .file-type{display:none}
  .workspace{padding:14px}
  .doc-paper{padding:25px 20px}
  .toolbar{gap:5px}
  .toolbar .btn{padding:8px}
  .actions{gap:5px}
  #topSearch{display:none}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-star">✦</div>
    <div>
      <div class="brand-name">Studio</div>
      <div class="brand-sub">A SPACE TO CREATE</div>
    </div>
  </div>

  <div class="section-label">WORKSPACE</div>

  <nav class="nav">
    <button data-page="home" class="active"><span class="nav-icon">⌂</span>Overview</button>
    <button data-page="documents"><span class="nav-icon">▤</span>Documents</button>
    <button data-page="slides"><span class="nav-icon">▧</span>Presentations</button>
    <button data-page="sheets"><span class="nav-icon">▦</span>Spreadsheets</button>
    <button data-page="files"><span class="nav-icon">◇</span>Your files</button>
  </nav>

  <div class="section-label" style="margin-top:18px">TOOLS</div>

  <button class="side-button" id="searchButton"><span class="nav-icon">⌕</span>Find anything</button>
  <button class="side-button" id="backupButton"><span class="nav-icon">↧</span>Export backup</button>
  <button class="side-button" id="importButton"><span class="nav-icon">↥</span>Import backup</button>

  <input id="backupInput" type="file" accept=".json,application/json" hidden>

  <div class="push"></div>

  <div class="side-note">
    <div class="star">✦</div>
    <h3>Make room for ideas.</h3>
    <p>A calm, focused workspace for writing, presenting and making sense of things.</p>
  </div>

  <div class="status"><span>●</span> Saved on this device</div>
</aside>

<main>
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="icon-btn" id="menuButton" aria-label="Open menu">☰</button>
      <div class="crumb">Workspace <span style="color:#425647">/</span> <strong id="breadcrumb">Overview</strong></div>
    </div>

    <div class="actions">
      <span class="save-state" id="saveState">Autosaved</span>
      <button class="btn" id="topSearch">⌕ Search</button>
      <button class="btn primary" id="newButton">＋ New</button>
    </div>
  </header>

  <div class="content" id="content"></div>
</main>
</div>

<div id="toastHost"></div>

<script>
(()=>{
'use strict';

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

const KEY='clamme-studio-workspace-v2';
const FONT_OPTIONS=['Alegreya'];

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const blankGrid=()=>Array.from({length:15},()=>Array(10).fill(''));

function initialState(){
  return{
    documents:[],
    presentations:[],
    spreadsheets:[],
    page:'home',
    activeDocument:null,
    activePresentation:null,
    activeSpreadsheet:null
  };
}

function loadState(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    if(saved&&Array.isArray(saved.documents)&&Array.isArray(saved.presentations)&&Array.isArray(saved.spreadsheets)){
      return{...initialState(),...saved};
    }
  }catch(e){}
  return initialState();
}

let state=loadState();
let selectedSlide=0;
let selectedCell='A1';
let searchTerm='';
let saveTimer;
let toastTimer;

const pageNames={
  home:'Overview',
  documents:'Documents',
  slides:'Presentations',
  sheets:'Spreadsheets',
  files:'Your files',
  search:'Search'
};

function escapeHTML(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}

function safeName(value){
  return(String(value||'untitled').trim()
    .replace(/[^a-z0-9-_]+/gi,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,60))||'untitled';
}

function toast(message){

function saveNow(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    $('#saveState').textContent='Autosaved';

    toast('Storage is full. Export a backup or remove large images.');

function saveSoon(){
  $('#saveState').textContent='Saving…';

  saveTimer=setTimeout(saveNow,300);
}

function downloadFile(name,data,type){
  const blob=new Blob([data],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function colName(n){
  let s='';
  while(n>=0){
    s=String.fromCharCode(n%26+65)+s;
    n=Math.floor(n/26)-1;
  }
  return s;
}

function parseAddress(addr){
  const m=/^([A-Z]+)(\d+)$/i.exec(addr);
  if(!m)return{r:0,c:0};
  let c=0;
  for(const ch of m[1].toUpperCase()){
    c=c*26+ch.charCodeAt(0)-64;
  }
  return{
    r:Math.max(0,Number(m[2])-1),
    c:Math.max(0,c-1)
  };
}

function cellRaw(sheet,r,c){
  return sheet.cells[r]?.[c]??'';
}

/* Safe, limited spreadsheet formula evaluator.
   Supports arithmetic, cell references and SUM ranges. */

function numericCell(sheet,r,c,seen=new Set()){
  const raw=String(cellRaw(sheet,r,c));

  if(!raw.startsWith('=')){
    const n=Number(raw);
    return raw.trim()!==''&&Number.isFinite(n)?n:0;
  }

  const key=`${r},${c}`;
  if(seen.has(key))return'#CYCLE!';
  seen.add(key);

  let formula=raw.slice(1).toUpperCase();

  formula=formula.replace(/SUM\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(match,start,end)=>{
    const a=parseAddress(start);
    const b=parseAddress(end);
    let total=0;

    for(let y=Math.min(a.r,b.r);y<=Math.max(a.r,b.r);y++){
      for(let x=Math.min(a.c,b.c);x<=Math.max(a.c,b.c);x++){
        const value=numericCell(sheet,y,x,new Set(seen));
        if(typeof value==='number')total+=value;
      }
    }
    return String(total);
  });

  formula=formula.replace(/\b([A-Z]+\d+)\b/g,ref=>{
    const p=parseAddress(ref);
    return String(numericCell(sheet,p.r,p.c,new Set(seen)));
  });

  if(!/^[\d\s()+\-*/.,%]+$/.test(formula))return'#ERROR';

  try{
    const result=Function('"use strict";return ('+formula+')')();
    return Number.isFinite(result)?result:'#ERROR';
  }catch(e){
    return'#ERROR';
  }
}

function cellValue(sheet,r,c){
  const raw=String(cellRaw(sheet,r,c));
  return raw.startsWith('=')?numericCell(sheet,r,c):raw;
}

function spreadsheetHTML(){
  const sh=activeSpreadsheet();

  if(!sh){
    return`
      ${pageHead(
        'NUMBERS',
        'Spreadsheets',
        'A simple grid for your data and calculations.',
        '<button class="btn primary" data-create="sheets">＋ New spreadsheet</button>'
      )}
      ${fileRows(allFiles().filter(f=>f.kind==='Spreadsheet'))}`;
  }

  if(!Array.isArray(sh.cells))sh.cells=blankGrid();

  while(sh.cells.length<15)sh.cells.push(Array(10).fill(''));
  sh.cells=sh.cells.map(row=>Array.from({length:10},(_,i)=>row[i]??''));

  const columns=10,rows=15;

  let html=`
    ${pageHead(
      'SPREADSHEET',
      'Make the numbers make sense.',
      'Enter values or formulas such as =SUM(A1:A5).',
      '<button class="btn" id="exportCSV">Export CSV</button><button class="btn primary" id="newSheet">＋ New</button>'
    )}

    <div style="display:flex;gap:10px;margin-bottom:13px">
      <input class="input" id="sheetTitle" value="${escapeHTML(sh.title)}" style="flex:1;font-size:22px" aria-label="Spreadsheet title">
      <button class="btn" id="clearSheet">Clear cells</button>
    </div>

    <div class="formula-bar">
      <label id="cellName">${selectedCell}</label>
      <input class="input" id="formulaInput" placeholder="Value or formula, e.g. =A1+B1">
      <button class="btn primary" id="applyFormula">Apply</button>
    </div>

    <div class="sheet-wrap">
      <table class="sheet">
        <thead><tr><th style="width:40px">#</th>`;

  for(let c=0;c<columns;c++)html+=`<th>${colName(c)}</th>`;

  html+='</tr></thead><tbody>';

  for(let r=0;r<rows;r++){
    html+=`<tr><th>${r+1}</th>`;

    for(let c=0;c<columns;c++){
      const addr=colName(c)+(r+1);
      const raw=cellRaw(sh,r,c);
      const value=String(raw).startsWith('=')?cellValue(sh,r,c):raw;

      html+=`
        <td>
          <input
            data-cell="${addr}"
            class="${String(raw).startsWith('=')?'formula':''} ${r===0?'header-cell':''}"
            value="${escapeHTML(value)}"
            aria-label="${addr}"
            title="${escapeHTML(raw)}"
          >
        </td>`;
    }
    html+='</tr>';
  }

  html+=`
      </tbody>
      </table>
    </div>
    <p class="muted" style="margin-top:10px">15 rows · 10 columns · Formulas begin with =</p>`;

  return html;
}

  $$('.nav button').forEach(b=>{
    b.classList.toggle('active',b.dataset.page===page);
  });

  const content=$('#content');

  if(page==='home')content.innerHTML=homeHTML();
  else if(page==='documents')content.innerHTML=documentHTML();
  else if(page==='slides')content.innerHTML=presentationHTML();
  else if(page==='sheets')content.innerHTML=spreadsheetHTML();
  else if(page==='files')content.innerHTML=filesHTML();
  else if(page==='search')content.innerHTML=searchHTML();
  else content.innerHTML=homeHTML();

  bindCommon();

  if(page==='documents')bindDocument();
  if(page==='slides')bindPresentation();

function bindPresentation(){
  const d=activePresentation();
  if(!d)return;

  $('#deckTitle').oninput=e=>{
    d.title=e.target.value;
    d.updated=Date.now();
    saveSoon();
  };

  $('#newDeck').onclick=addPresentation;

  $$('[data-slide]').forEach(b=>{
    b.onclick=()=>{
      selectedSlide=Number(b.dataset.slide);
      render();
    };
  });

  $('#addSlide').onclick=()=>{
    d.slides.push({
      title:'New slide',
      body:'Add your ideas here.',
      image:'',
      font:'Alegreya'
    });

    selectedSlide=d.slides.length-1;
    d.updated=Date.now();
    saveNow();
    render();
  };

  $('#duplicateSlide').onclick=()=>{
    const clone={
      ...d.slides[selectedSlide],
      title:(d.slides[selectedSlide].title||'Slide')+' copy'
    };

    d.slides.splice(selectedSlide+1,0,clone);
    selectedSlide++;
    saveNow();
    render();
  };

  $('#deleteSlide').onclick=()=>{
    if(d.slides.length===1){
      d.slides[0]={
        title:'New slide',
        body:'',
        image:'',
        font:'Alegreya'
      };
      selectedSlide=0;
    }else{
      d.slides.splice(selectedSlide,1);
      selectedSlide=Math.max(0,selectedSlide-1);
    }

    saveNow();
    render();
  };

  const s=d.slides[selectedSlide];

  $('#slideHeading').oninput=e=>{
    s.title=e.target.value;
    d.updated=Date.now();
    updateSlideRail(d);
    saveSoon();
  };

  $('#slideBody').oninput=e=>{
    s.body=e.target.value;
    d.updated=Date.now();
    saveSoon();
  };

  $('#addImage').onclick=()=>$('#slideImageInput').click();

  $('#removeImage').onclick=()=>{
    s.image='';
    d.updated=Date.now();
    saveNow();
    render();
  };

  $('#slideImageInput').onchange=e=>{
    const file=e.target.files?.[0];
    e.target.value='';

    if(!file)return;

    if(!file.type.startsWith('image/')){
      toast('Choose an image file.');
      return;
    }

    if(file.size>2*1024*1024){
      toast('Choose an image smaller than 2 MB.');
      return;
    }

    const reader=new FileReader();

    reader.onerror=()=>toast('Could not read that image.');

    reader.onload=()=>{
      s.image=reader.result;
      d.updated=Date.now();
      saveNow();
      render();
    };

    reader.readAsDataURL(file);
  };

  $('#presentDeck').onclick=()=>openPresentation(d);
  $('#exportDeck').onclick=()=>exportPresentation(d);
}

function updateSlideRail(d){
  $$('[data-slide]').forEach((b,i)=>{
    const label=d.slides[i]?.title||'Untitled slide';

    b.innerHTML=`
      <span>${String(i+1).padStart(2,'0')}</span>
      ${escapeHTML(label).slice(0,18)}`;
  });
}

function presentationDocument(deck){
  const slides=deck.slides.map(s=>`
    <section class="slide" style="font-family:'Alegreya',serif">
      ${s.image?`<img src="${s.image}" alt="">`:''}
      ${s.image?'<div class="shade"></div>':''}
      <div class="text">
        <h1>${escapeHTML(s.title||'')}</h1>
        <p>${escapeHTML(s.body||'')}</p>
      </div>
    </section>
  `).join('');

  return`
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>${escapeHTML(deck.title)}</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

      <style>
        *{box-sizing:border-box}
        body{
          margin:0;
          background:#07100b;
          color:#eff6ef;
          font-family:'Alegreya',serif;
        }
        .slide{
          display:none;
          position:absolute;
          left:50%;
          top:50%;
          transform:translate(-50%,-50%);
          width:min(92vw,1200px);
          aspect-ratio:16/9;
          overflow:hidden;
          background:#edf2e9;
          color:#182b1e;
          padding:7%;
          justify-content:center;
          flex-direction:column;
        }
        .slide.active{display:flex}
        .slide img{
          position:absolute;
          inset:0;
          width:100%;
          height:100%;
          object-fit:cover;
        }
        .shade{
          position:absolute;
          inset:0;
          background:linear-gradient(90deg,#07150bdd,#07150b66);
        }
        .text{
          position:relative;
          z-index:1;
          max-width:85%;
        }
        h1{
          font-size:clamp(30px,5vw,68px);
          line-height:1.05;
          margin:0 0 20px;
          font-weight:600;
        }
        p{
          font-size:clamp(16px,2vw,25px);
          line-height:1.6;
          white-space:pre-wrap;
        }
        .controls{
          position:fixed;
          bottom:18px;
          left:0;
          right:0;
          display:flex;
          justify-content:center;
          gap:16px;
          align-items:center;
          color:#a8b6aa;
          font-size:17px;
        }
        .controls button{
          border:1px solid #304536;
          border-radius:8px;
          background:#132019;
          color:#e0ece2;
          padding:9px 15px;
          font-family:'Alegreya',serif;
          font-size:16px;
        }
      </style>
    </head>
    <body>
      ${slides}

      <div class="controls">
        <button id="prev">← Previous</button>
        <span id="count"></span>
        <button id="next">Next →</button>
      </div>

      <script>
        const slides=[...document.querySelectorAll('.slide')];
        let i=0;

        function draw(){
          slides.forEach((s,n)=>s.classList.toggle('active',n===i));
          document.querySelector('#count').textContent=(i+1)+' / '+slides.length;
        }

        document.querySelector('#prev').onclick=()=>{
          i=Math.max(0,i-1);
          draw();
        };

        document.querySelector('#next').onclick=()=>{
          i=Math.min(slides.length-1,i+1);
          draw();
        };

        document.addEventListener('keydown',e=>{
          if(e.key==='ArrowRight')i=Math.min(slides.length-1,i+1);
          if(e.key==='ArrowLeft')i=Math.max(0,i-1);
          draw();
        });

        draw();
      <\/script>
    </body>
    </html>`;
}

function openPresentation(deck){
  const w=window.open('','_blank');

  if(!w){
    toast('Allow pop-ups to present your slides.');
    return;
  }

  w.document.open();
  w.document.write(presentationDocument(deck));
  w.document.close();
  w.focus();
}

function exportPresentation(deck){
  downloadFile(
    safeName(deck.title)+'.html',
    presentationDocument(deck),
    'text/html;charset=utf-8'
  );
}

function bindSpreadsheet(){
  const sh=activeSpreadsheet();
  if(!sh)return;

  $('#sheetTitle').oninput=e=>{
    sh.title=e.target.value;
    sh.updated=Date.now();
    saveSoon();
  };

  function selectCell(addr){
    selectedCell=addr;
    $('#cellName').textContent=addr;

    const p=parseAddress(addr);
    $('#formulaInput').value=cellRaw(sh,p.r,p.c);

    $$('[data-cell]').forEach(input=>{
      input.style.background=input.dataset.cell===addr?'#183121':'';
    });
  }

  $$('[data-cell]').forEach(input=>{
    const addr=input.dataset.cell;

    input.addEventListener('focus',()=>selectCell(addr));
    input.addEventListener('click',()=>selectCell(addr));

    input.addEventListener('change',()=>{
      const p=parseAddress(addr);
      sh.cells[p.r][p.c]=input.value;
      sh.updated=Date.now();
      saveSoon();
      refreshSheet(sh);
    });

    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        input.blur();

        const p=parseAddress(addr);
        const nextRow=Math.min(15,p.r+2);
        $(`[data-cell="${colName(p.c)+nextRow}"]`)?.focus();
      }
    });
  });

  $('#formulaInput').onkeydown=e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      applyFormula();
    }
  };

  $('#applyFormula').onclick=applyFormula;

  function applyFormula(){
    const p=parseAddress(selectedCell);
    sh.cells[p.r][p.c]=$('#formulaInput').value;
    sh.updated=Date.now();
    saveNow();
    render();
  }

  $('#clearSheet').onclick=()=>{
    if(confirm('Clear all cells in this spreadsheet?')){
      sh.cells=blankGrid();
      selectedCell='A1';
      saveNow();
      render();
    }
  };

  $('#newSheet').onclick=addSpreadsheet;

  $('#exportCSV').onclick=()=>{
    const csv=sh.cells.map((row,r)=>
      row.map((_,c)=>{
        const v=String(cellValue(sh,r,c)??'');
        return'"'+v.replace(/"/g,'""')+'"';
      }).join(',')
    ).join('\r\n');

    downloadFile(
      safeName(sh.title)+'.csv',
      csv,
      'text/csv;charset=utf-8'
    );
  };

  selectCell(selectedCell);
}

function refreshSheet(sh){
  $$('[data-cell]').forEach(input=>{
    const p=parseAddress(input.dataset.cell);
    const raw=String(cellRaw(sh,p.r,p.c));

    input.classList.toggle('formula',raw.startsWith('='));

    input.value=raw.startsWith('=')?
      String(cellValue(sh,p.r,p.c)):raw;

    input.title=raw.startsWith('=')?
      raw+' = '+cellValue(sh,p.r,p.c):raw;
  });
}

function bindFileSearch(inputSelector,resultsSelector){
  const input=$(inputSelector);
  const results=$(resultsSelector);

  if(!input||!results)return;

  const update=()=>{
    searchTerm=input.value.toLowerCase().trim();

    const files=allFiles().filter(f=>
      f.title.toLowerCase().includes(searchTerm)
    );

    results.innerHTML=fileRows(files);
    bindCommon();
  };

  input.oninput=update;
  update();
}

function exportBackup(){
  saveNow();

  downloadFile(
    'clamme-studio-backup.json',
    JSON.stringify(state,null,2),
    'application/json;charset=utf-8'
  );
}

function importBackup(file){
  if(file.size>15*1024*1024){
    toast('Backup is too large to import.');
    return;
  }

  const reader=new FileReader();

  reader.onerror=()=>toast('Could not read that backup.');

  reader.onload=()=>{
    try{
      const next=JSON.parse(reader.result);

      if(!next||
        !Array.isArray(next.documents)||
        !Array.isArray(next.presentations)||
        !Array.isArray(next.spreadsheets)){
        throw new Error('Invalid backup');
      }

      if(!confirm('Import this backup? It replaces the workspace currently saved in this browser.')){
        return;
      }

      state={...initialState(),...next};

      saveNow();
      render();
      toast('Backup imported');
    }catch(e){
      toast('That file is not a valid Studio backup.');
    }
  };

  reader.readAsText(file);
}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){
    e.preventDefault();
    saveNow();
    toast('Everything saved');
  }

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    searchTerm='';
    setPage('search');
  }

  if(e.key==='Escape'){
    $('#sidebar').classList.remove('open');
  }
});

window.addEventListener('beforeunload',()=>{
  clearTimeout(saveTimer);
  saveNow();
});

render();

})();
</script>
</body>
</html>
