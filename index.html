
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clamme Studio — Presentations</title>

<style>
:root {
  --bg: #f4f6f3;
  --panel: #ffffff;
  --text: #19231e;
  --muted: #7b8980;
  --accent: #087e59;
  --border: #e4e9e5;
  --slide-bg: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 66px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  gap: 12px;
}

.brand {
  font-size: 22px;
  letter-spacing: -1px;
  font-weight: bold;
}

.brand span {
  color: var(--accent);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  padding: 10px 15px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: white;
  color: var(--text);
  font-size: 13px;
}

.btn:hover {
  background: #f1f5f2;
}

.btn.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.btn.primary:hover {
  opacity: .9;
}

/* WORKSPACE */

.workspace {
  display: grid;
  grid-template-columns: 215px minmax(0, 1fr) 235px;
  flex: 1;
  min-height: calc(100vh - 66px);
}

/* SIDEBAR */

.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 18px 13px;
  overflow-y: auto;
}

.section-label {
  font-family: Arial, sans-serif;
  color: var(--muted);
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1.5px;
  margin: 5px 0 15px;
}

.slide-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.slide-thumb {
  border: 2px solid transparent;
  border-radius: 7px;
  overflow: hidden;
  background: white;
  cursor: pointer;
  position: relative;
}

.slide-thumb.active {
  border-color: var(--accent);
}

.thumb-content {
  aspect-ratio: 16 / 9;
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
  text-align: center;
  color: var(--text);
}

.thumb-content strong {
  font-size: 11px;
  overflow: hidden;
}

.thumb-content small {
  font-size: 8px;
  margin-top: 5px;
}

.thumb-content img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.thumb-number {
  font-family: Arial, sans-serif;
  padding: 5px 8px;
  font-size: 10px;
  color: var(--muted);
}

/* EDITOR */

.editor {
  padding: 25px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.toolbar-left,
.toolbar-right {
  display: flex;
  gap: 8px;
  align-items: center;
}

.slide-counter {
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: var(--muted);
}

.canvas-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  min-height: 250px;
  perspective: 1100px;
  overflow: hidden;
}

.canvas {
  position: relative;
  width: min(100%, 950px);
  aspect-ratio: 16 / 9;
  background: var(--slide-bg);
  box-shadow: 0 8px 35px rgba(20, 40, 25, .10);
  overflow: hidden;
  transform-style: preserve-3d;
}

.slide-content {
  width: 100%;
  height: 100%;
  padding: 9%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.slide-title {
  font-size: clamp(20px, 4vw, 48px);
  font-weight: bold;
  outline: none;
  line-height: 1.15;
  margin-bottom: 18px;
  word-break: break-word;
}

.slide-body {
  font-size: clamp(12px, 1.7vw, 20px);
  line-height: 1.65;
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
}

.slide-image {
  max-width: 100%;
  max-height: 48%;
  object-fit: contain;
  margin: 0 auto 18px;
  display: none;
}

.slide-image.visible {
  display: block;
}

.canvas.has-image .slide-content {
  padding: 5%;
}

.canvas.has-image .slide-title {
  font-size: clamp(17px, 3vw, 34px);
  margin-bottom: 8px;
}

.canvas.has-image .slide-body {
  font-size: clamp(11px, 1.3vw, 16px);
}

/* TRANSITIONS */

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideIn {
  from { transform: translateX(60px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes zoomIn {
  from { transform: scale(.75); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes flipIn {
  from { transform: rotateY(75deg); opacity: 0; }
  to { transform: rotateY(0); opacity: 1; }
}

@keyframes cubeIn {
  from {
    transform: rotateY(-85deg) scale(.8);
    opacity: 0;
  }
  to {
    transform: rotateY(0) scale(1);
    opacity: 1;
  }
}

.transition-fade { animation: fadeIn .45s ease; }
.transition-slide { animation: slideIn .45s ease; }
.transition-zoom { animation: zoomIn .45s ease; }
.transition-flip { animation: flipIn .55s ease; }
.transition-cube { animation: cubeIn .65s ease; }

/* RIGHT PANEL */

.inspector {
  background: var(--panel);
  border-left: 1px solid var(--border);
  padding: 20px 15px;
  overflow-y: auto;
}

.inspector-section {
  margin-bottom: 28px;
}

.inspector h3 {
  font-size: 14px;
  margin: 0 0 15px;
}

.field-label {
  display: block;
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 7px;
}

select, .text-input {
  width: 100%;
  border: 1px solid var(--border);
  background: white;
  padding: 10px;
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  margin-bottom: 14px;
}

.theme-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.theme-option {
  border: 2px solid var(--border);
  border-radius: 7px;
  padding: 5px;
  background: white;
}

.theme-option.active {
  border-color: var(--accent);
}

.theme-preview {
  height: 47px;
  border-radius: 3px;
  margin-bottom: 6px;
}

.theme-option small {
  font-family: Arial, sans-serif;
  font-size: 10px;
}

.upload-box {
  border: 1px dashed #b8c6bb;
  padding: 15px 8px;
  text-align: center;
  border-radius: 7px;
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
}

.upload-box:hover {
  border-color: var(--accent);
}

#imageInput {
  display: none;
}

.status {
  font-family: Arial, sans-serif;
  font-size: 10px;
  color: var(--muted);
}

/* PRESENTATION MODE */

.presentation {
  position: fixed;
  inset: 0;
  background: #101712;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 35px;
}

.presentation.active {
  display: flex;
}

.presentation .canvas {
  width: min(100%, 1250px);
  box-shadow: none;
}

.present-controls {
  position: absolute;
  bottom: 15px;
  display: flex;
  gap: 12px;
  align-items: center;
}

.present-controls button {
  background: #24342b;
  border: 1px solid #405548;
  color: white;
  padding: 9px 15px;
  border-radius: 5px;
}

.present-controls span {
  color: white;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.close-presentation {
  position: absolute;
  right: 20px;
  top: 20px;
}

@media(max-width: 950px) {
  .workspace {
    grid-template-columns: 145px minmax(0, 1fr);
  }
  .inspector {
    grid-column: 1 / -1;
    border-left: none;
    border-top: 1px solid var(--border);
  }
  .theme-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media(max-width: 600px) {
  .header {
    padding: 0 12px;
  }
  .workspace {
    grid-template-columns: 105px minmax(0, 1fr);
  }
  .editor {
    padding: 12px;
  }
  .sidebar {
    padding: 12px 7px;
  }
  .btn {
    padding: 8px;
    font-size: 11px;
  }
  .inspector {
    padding: 15px;
  }
  .theme-grid {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="brand">clamme<span>.</span></div>

  <div class="header-actions">
    <span class="status" id="saveStatus">All changes saved</span>
    <button class="btn" onclick="exportPresentation()">Export HTML</button>
    <button class="btn primary" onclick="startPresentation()">Present</button>
  </div>
</header>

<div class="workspace">

  <aside class="sidebar">
    <div class="section-label">SLIDES</div>

    <div class="slide-list" id="slideList"></div>

    <button class="btn primary" style="width:100%;margin-top:15px"
      onclick="addSlide()">+ New slide</button>
  </aside>

  <main class="editor">

    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn" onclick="addSlide()">+ Slide</button>
        <button class="btn" onclick="duplicateSlide()">Duplicate</button>
        <button class="btn" onclick="deleteSlide()">Delete</button>
      </div>

      <div class="toolbar-right">
        <span class="slide-counter" id="slideCounter">1 / 1</span>
        <button class="btn" onclick="previousSlide()">Previous</button>
        <button class="btn" onclick="nextSlide()">Next</button>
      </div>
    </div>

    <div class="canvas-wrap">
      <div class="canvas" id="canvas">

        <div class="slide-content">

          <img id="slideImage" class="slide-image" alt="Slide image">

          <div class="slide-title"
            id="slideTitle"
            contenteditable="true"
            spellcheck="false"
            oninput="updateSlideText()">
            Welcome to Clamme
          </div>

          <div class="slide-body"
            id="slideBody"
            contenteditable="true"
            spellcheck="false"
            oninput="updateSlideText()">A quieter way to create.

Build your ideas into something meaningful.</div>

        </div>
      </div>
    </div>

  </main>

  <aside class="inspector">

    <section class="inspector-section">
      <h3>Slide settings</h3>

      <label class="field-label">Transition</label>

      <select id="transitionSelect" onchange="changeTransition()">
        <option value="fade">Fade</option>
        <option value="cube">Cube</option>
        <option value="slide">Slide</option>
        <option value="zoom">Zoom</option>
        <option value="flip">Flip</option>
        <option value="none">None</option>
      </select>

      <label class="field-label">Image</label>

      <label class="upload-box" for="imageInput">
        Add image to this slide
      </label>

      <input type="file" id="imageInput" accept="image/*"
        onchange="uploadImage(event)">

      <button class="btn" style="width:100%;margin-top:9px"
        onclick="removeImage()">Remove image</button>
    </section>

    <section class="inspector-section">
      <h3>Presentation themes</h3>

      <div class="theme-grid" id="themeGrid"></div>
    </section>

    <section class="inspector-section">
      <h3>Slide actions</h3>

      <button class="btn" style="width:100%;margin-bottom:8px"
        onclick="moveSlide(-1)">Move slide up</button>

      <button class="btn" style="width:100%"
        onclick="moveSlide(1)">Move slide down</button>
    </section>

  </aside>

</div>
</div>

<!-- PRESENTATION -->

<div class="presentation" id="presentation">

  <button class="present-controls close-presentation"
    onclick="stopPresentation()">Exit presentation</button>

  <div class="canvas" id="presentationCanvas">
    <div class="slide-content">
      <img id="presentationImage" class="slide-image" alt="">
      <div class="slide-title" id="presentationTitle"></div>
      <div class="slide-body" id="presentationBody"></div>
    </div>
  </div>

  <div class="present-controls">
    <button onclick="previousSlide()">Previous</button>
    <span id="presentationCounter">1 / 1</span>
    <button onclick="nextSlide()">Next</button>
  </div>

</div>

<script>

/* DATA */

const defaultSlide = {
  title: "Welcome to Clamme",
  body: "A quieter way to create.\n\nBuild your ideas into something meaningful.",
  image: null,
  transition: "fade",
  theme: "classic"
};

let slides = [
  structuredClone(defaultSlide)
];

let currentSlide = 0;

let themes = {
  classic: {
    name: "Classic",
    bg: "#ffffff",
    color: "#19231e",
    accent: "#087e59"
  },

  emerald: {
    name: "Emerald",
    bg: "#102d23",
    color: "#f1f5ee",
    accent: "#63b994"
  },

  midnight: {
    name: "Midnight",
    bg: "#151a28",
    color: "#f2f3f7",
    accent: "#a7b8e8"
  },

  paper: {
    name: "Paper",
    bg: "#f2eadb",
    color: "#392f26",
    accent: "#936d42"
  },

  forest: {
    name: "Forest",
    bg: "#20372b",
    color: "#f0f2e8",
    accent: "#b4c8a7"
  },

  minimal: {
    name: "Minimal",
    bg: "#f6f6f6",
    color: "#242424",
    accent: "#555555"
  },

  ocean: {
    name: "Ocean",
    bg: "#e6f0f2",
    color: "#183b47",
    accent: "#347d91"
  },

  charcoal: {
    name: "Charcoal",
    bg: "#252525",
    color: "#f5f5f5",
    accent: "#c7a76b"
  }
};

let activeTheme = "classic";

const STORAGE_KEY = "clamme-presentation-v1";

/* STORAGE */

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      slides,
      currentSlide,
      activeTheme
    }));

    document.getElementById("saveStatus").textContent =
      "All changes saved";
  } catch(error) {
    document.getElementById("saveStatus").textContent =
      "Storage full — export your presentation";
  }
}

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if(saved && Array.isArray(saved.slides) && saved.slides.length) {
      slides = saved.slides;
      currentSlide = Math.min(
        saved.currentSlide || 0,
        slides.length - 1
      );

      activeTheme = themes[saved.activeTheme]
        ? saved.activeTheme : "classic";
    }
  } catch(error) {
    console.warn("Could not load saved presentation.");
  }
}

/* SLIDE RENDERING */

function renderSlide(animate = false) {
  const slide = slides[currentSlide];

  const canvas = document.getElementById("canvas");
  const title = document.getElementById("slideTitle");
  const body = document.getElementById("slideBody");
  const image = document.getElementById("slideImage");

  title.textContent = slide.title;
  body.textContent = slide.body;

  if(slide.image) {
    image.src = slide.image;
    image.classList.add("visible");
    canvas.classList.add("has-image");
  } else {
    image.removeAttribute("src");
    image.classList.remove("visible");
    canvas.classList.remove("has-image");
  }

  document.getElementById("transitionSelect").value =
    slide.transition || "fade";

  applyTheme(slide.theme || activeTheme, false);

  if(animate) {
    canvas.classList.remove(
      "transition-fade",
      "transition-slide",
      "transition-zoom",
      "transition-flip",
      "transition-cube"
    );

    void canvas.offsetWidth;

    const transition = slide.transition || "fade";

    if(transition !== "none") {
      canvas.classList.add("transition-" + transition);
    }
  }

  renderThumbnails();
  updateCounters();
  saveData();
}

/* THUMBNAILS */

function renderThumbnails() {
  const list = document.getElementById("slideList");
  list.innerHTML = "";

  slides.forEach((slide, index) => {
    const item = document.createElement("div");

    item.className = "slide-thumb" +
      (index === currentSlide ? " active" : "");

    const content = document.createElement("div");
    content.className = "thumb-content";

    const theme = themes[slide.theme || activeTheme];

    content.style.background = theme.bg;
    content.style.color = theme.color;

    if(slide.image) {
      const img = document.createElement("img");
      img.src = slide.image;
      img.alt = "";
      content.appendChild(img);
    } else {
      const strong = document.createElement("strong");
      strong.textContent = slide.title;
      content.appendChild(strong);

      const small = document.createElement("small");
      small.textContent = slide.body.slice(0, 65);
      content.appendChild(small);
    }

    const number = document.createElement("div");
    number.className = "thumb-number";
    number.textContent = "Slide " + (index + 1);

    item.append(content, number);

    item.onclick = () => {
      currentSlide = index;
      renderSlide(true);
    };

    list.appendChild(item);
  });
}

/* COUNTERS */

function updateCounters() {
  document.getElementById("slideCounter").textContent =
    `${currentSlide + 1} / ${slides.length}`;

  document.getElementById("presentationCounter").textContent =
    `${currentSlide + 1} / ${slides.length}`;
}

/* SLIDE MANAGEMENT */

function addSlide() {
  slides.splice(currentSlide + 1, 0, {
    title: "New slide",
    body: "Start writing your ideas here.",
    image: null,
    transition: "fade",
    theme: activeTheme
  });

  currentSlide++;
  renderSlide();
}

function deleteSlide() {
  if(slides.length === 1) {
    alert("A presentation must have at least one slide.");
    return;
  }

  slides.splice(currentSlide, 1);
  currentSlide = Math.min(currentSlide, slides.length - 1);

  renderSlide();
}

function duplicateSlide() {
  const copy = JSON.parse(JSON.stringify(slides[currentSlide]));

  slides.splice(currentSlide + 1, 0, copy);
  currentSlide++;

  renderSlide();
}

function moveSlide(direction) {
  const target = currentSlide + direction;

  if(target < 0 || target >= slides.length) return;

  [slides[currentSlide], slides[target]] =
    [slides[target], slides[currentSlide]];

  currentSlide = target;

  renderSlide();
}

/* NAVIGATION */

function nextSlide() {
  if(currentSlide < slides.length - 1) {
    currentSlide++;
    renderSlide(true);
  } else if(
    document.getElementById("presentation").classList.contains("active")
  ) {
    stopPresentation();
  }
}

function previousSlide() {
  if(currentSlide > 0) {
    currentSlide--;
    renderSlide(true);
  }
}

/* TEXT EDITING */

function updateSlideText() {
  slides[currentSlide].title =
    document.getElementById("slideTitle").textContent;

  slides[currentSlide].body =
    document.getElementById("slideBody").textContent;

  renderThumbnails();
  saveData();
}

/* IMAGE MANAGEMENT */

function uploadImage(event) {
  const file = event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")) {
    alert("Please select an image file.");
    return;
  }

  if(file.size > 10 * 1024 * 1024) {
    alert("Image must be smaller than 10 MB.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    slides[currentSlide].image = e.target.result;
    renderSlide();
  };

  reader.readAsDataURL(file);

  event.target.value = "";
}

function removeImage() {
  slides[currentSlide].image = null;
  renderSlide();
}

/* TRANSITIONS */

function changeTransition() {
  slides[currentSlide].transition =
    document.getElementById("transitionSelect").value;

  saveData();
}

/* THEMES */

function buildThemes() {
  const grid = document.getElementById("themeGrid");
  grid.innerHTML = "";

  Object.entries(themes).forEach(([key, theme]) => {
    const button = document.createElement("button");

    button.className = "theme-option" +
      (activeTheme === key ? " active" : "");

    const preview = document.createElement("div");
    preview.className = "theme-preview";
    preview.style.background = theme.bg;

    const label = document.createElement("small");
    label.textContent = theme.name;
    label.style.color = theme.color;

    button.append(preview, label);

    button.onclick = () => {
      activeTheme = key;
      slides[currentSlide].theme = key;
      applyTheme(key);
      buildThemes();
      renderThumbnails();
      saveData();
    };

    grid.appendChild(button);
  });
}

function applyTheme(key, updateGrid = true) {
  const theme = themes[key] || themes.classic;

  activeTheme = key;

  const canvas = document.getElementById("canvas");

  canvas.style.background = theme.bg;
  canvas.style.color = theme.color;

  document.documentElement.style.setProperty(
    "--accent", theme.accent
  );

  if(updateGrid) buildThemes();
}

/* PRESENTATION MODE */

function startPresentation() {
  const presentation =
    document.getElementById("presentation");

  presentation.classList.add("active");
  renderPresentation();
}

function stopPresentation() {
  document.getElementById("presentation")
    .classList.remove("active");

  renderSlide();
}

function renderPresentation() {
  const slide = slides[currentSlide];
  const canvas = document.getElementById("presentationCanvas");

  const theme = themes[slide.theme || activeTheme];

  canvas.style.background = theme.bg;
  canvas.style.color = theme.color;

  document.getElementById("presentationTitle").textContent =
    slide.title;

  document.getElementById("presentationBody").textContent =
    slide.body;

  const image = document.getElementById("presentationImage");

  if(slide.image) {
    image.src = slide.image;
    image.classList.add("visible");
    canvas.classList.add("has-image");
  } else {
    image.removeAttribute("src");
    image.classList.remove("visible");
    canvas.classList.remove("has-image");
  }

  canvas.classList.remove(
    "transition-fade",
    "transition-slide",
    "transition-zoom",
    "transition-flip",
    "transition-cube"
  );

  void canvas.offsetWidth;

  if(slide.transition !== "none") {
    canvas.classList.add(
      "transition-" + (slide.transition || "fade")
    );
  }

  updateCounters();
}

/* EXPORT */

function exportPresentation() {
  const data = JSON.stringify({
    slides,
    themes
  }).replace(/</g, "\\u003c");

  const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clamme Presentation</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101712;font-family:Georgia,serif}
#stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:35px}
#slide{width:min(100%,1200px);aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;padding:9%;overflow:hidden}
h1{font-size:clamp(24px,5vw,65px);margin:0 0 20px}
p{font-size:clamp(14px,2vw,25px);line-height:1.65;white-space:pre-wrap}
img{max-width:100%;max-height:45%;object-fit:contain;margin:auto auto 15px}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:15px;align-items:center;color:white;font-family:Arial}
button{padding:10px 18px;background:#24342b;color:white;border:1px solid #405548;border-radius:5px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes zoom{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flip{from{transform:rotateY(75deg);opacity:0}to{transform:rotateY(0);opacity:1}}
@keyframes cube{from{transform:rotateY(-85deg) scale(.8);opacity:0}to{transform:rotateY(0) scale(1);opacity:1}}
</style>
</head>
<body>
<div id="stage"><article id="slide">
<img id="image" hidden>
<h1 id="title"></h1><p id="body"></p>
</article></div>
<div id="controls">
<button onclick="prev()">Previous</button>
<span id="counter"></span>
<button onclick="next()">Next</button>
</div>
<script>
const data=${data};
let index=0;
const slide=document.getElementById('slide');
function render(){
const s=data.slides[index];
const t=data.themes[s.theme]||data.themes.classic;
slide.style.background=t.bg;
slide.style.color=t.color;
document.getElementById('title').textContent=s.title;
document.getElementById('body').textContent=s.body;
const img=document.getElementById('image');
img.hidden=!s.image;
if(s.image)img.src=s.image;
slide.style.animation='none';
void slide.offsetWidth;
const transitions={fade:'fade',slide:'slide',zoom:'zoom',flip:'flip',cube:'cube'};
if(transitions[s.transition])slide.style.animation=transitions[s.transition]+' .55s ease';
document.getElementById('counter').textContent=(index+1)+' / '+data.slides.length;
}
function next(){if(index<data.slides.length-1){index++;render()}}
function prev(){if(index>0){index--;render()}}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')next();
if(e.key==='ArrowLeft')prev();
});
render();
<\/script>
</body>
</html>`;

  const blob = new Blob([html], {type:"text/html"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "Clamme-Presentation.html";
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* KEYBOARD */

document.addEventListener("keydown", event => {
  const presentation =
    document.getElementById("presentation");

  if(!presentation.classList.contains("active")) return;

  if(event.key === "ArrowRight") nextSlide();
  if(event.key === "ArrowLeft") previousSlide();
  if(event.key === "Escape") stopPresentation();
});

/* INITIALIZATION */

loadData();
renderSlide();
buildThemes();

</script>

</body>
</html>
